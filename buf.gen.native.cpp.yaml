version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: api/proto
    paths:
      # All pivox protos produce C++ proto types (so any service can be
      # used from shared C++ code / WinRT). Common deps included too.
      - api/proto/pivox
      - api/proto/google/api
      - api/proto/google/rpc
      - api/proto/google/type
      - api/proto/google/longrunning
      - api/proto/buf/validate
plugins:
  # C++ proto types — consumed by shared C++ code. Pinned to the version
  # matching vcpkg's libprotobuf. Latest plugin emits code referencing
  # newer runtime APIs (PROTOBUF_NONNULL, ParseNamedEnum overloads) that
  # older runtimes don't provide — verified empirically. Bump this only
  # when bumping vcpkg protobuf; keep them in lockstep.
  - remote: buf.build/protocolbuffers/cpp:v29.5
    out: native/core/generated/cpp

  # C++ bridge: per-RPC Apple bridge methods. Source:
  # tools/cmd/protoc-gen-pivox-cpp-bridge/. service_filter scopes bridge
  # emission to services that have a hand-written `ChatClient`-style
  # class — we only have AiChat today. Broaden as other services
  # acquire their own client classes.
  - local: bin/protoc-gen-pivox-cpp-bridge
    out: native/core/generated/bridge
    opt:
      - cpp_namespace=pivox::ai_chat
      - cpp_class=ChatClient
      - swift_module=PivoxModels
      - service_filter=pivox.ai.v1.AiChat
