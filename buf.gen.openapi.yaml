# OpenAPI-only buf template. Split out from buf.gen.yaml so the
# web-facing swagger can EXCLUDE pivox.mcp.v1 while the Go/gRPC plugins
# (in buf.gen.yaml) keep generating over every proto, mcp included.
#
# Why mcp is excluded here: mcp_service.proto has no `google.api.http`
# annotations (it is never exposed through REST), but it defines its own
# Organization / Space / ListSpacesResponse messages. With allow_merge,
# protoc-gen-openapiv2 sees those names collide with the canonical
# pivox.api.v1 messages and disambiguates by prefixing the canonical ones
# (v1Space -> pivoxApiV1Space), polluting the generated web client types.
# Dropping mcp from the openapi input removes the collision entirely.
#
# `clean: true` only wipes this template's plugin out dir (api/openapi/v2),
# so it does not touch internal/pkg/gen (owned by buf.gen.yaml).
version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
      path: google
    - file_option: go_package
      path: buf
  override:
    - file_option: go_package_prefix
      value: github.com/dashkan/pivox/internal/pkg/gen
inputs:
  - directory: api/proto
    paths:
      - api/proto/pivox
    exclude_paths:
      - api/proto/pivox/mcp
plugins:
  - local: protoc-gen-openapiv2
    out: api/openapi/v2
    strategy: all
    opt:
      - expand_slashed_path_patterns=true
      - allow_merge=true
      - merge_file_name=pivox
      - output_format=yaml
      - openapi_configuration=api/openapiv2.config.yaml
