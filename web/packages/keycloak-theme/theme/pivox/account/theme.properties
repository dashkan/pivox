# Pivox account console — our OWN React 19 SPA (@pivox/account-console), not
# Keycloak's PatternFly account-ui. Our index.ftl boots our app from
# resources/app/ and references ONLY our own assets — it never pulls the
# parent's styles/scripts — so inheriting a richer parent is safe.
#
# parent=keycloak.v3 (the account-ui theme) so the AccountConsole message
# endpoint (/resources/{realm}/account/{lng}) serves the FULL account message
# bundle (564 keys: doSave, unLink, addMultivaluedLabel, *SidebarTitle, …). Our
# SPA localizes via react-i18next against those exact keys, identical to KC's
# own console. parent=base only served ~388 keys, so half our t() keys rendered
# raw. (Requires a Keycloak theme reload / restart to take effect.)
#
# Keycloak's AccountConsole endpoint still renders this index.ftl and injects
# the environment model (authServerUrl, realm, clientId=account-console, …),
# which our SPA reads from the <script id="environment"> block.
#
# darkMode honors the realm's native "Dark mode" toggle; kcDarkModeClass=dark
# matches the .dark class our Tailwind tokens key off.
parent=keycloak.v3
deprecatedMode=false
darkMode=true
kcDarkModeClass=dark
