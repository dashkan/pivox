# Localization resources for Pivox custom User Profile attributes.
#
# Their display name in the realm's User Profile config is a ${key} reference
# (like the built-in ${firstName}/${lastName}); the AccountConsole message
# endpoint merges this file into the inherited keycloak.v3 bundle, so account-ui
# — and our renderer's label()/labelAttribute() — resolve the label per locale
# instead of showing a hard-coded English string. Add messages_<locale>.properties
# alongside this for each language you support.
photoUrl=Photo URL
