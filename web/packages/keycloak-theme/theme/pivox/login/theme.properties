# Pivox login theme.
#
# parent=base gives us the FreeMarker templates + functional JS (authChecker,
# passwordVisibility, menu-button-links) with NO PatternFly styling — every
# kc*Class property defaults to empty, so we own 100% of the look via the
# kc-* component classes below (compiled to css/theme.css from src/shared.css).
#
# import=common/keycloak supplies the shared vendor resources the inherited
# scripts need (rfc4648 for authChecker's importmap, etc.).
parent=base
import=common/keycloak

# Our compiled Tailwind bundle (the only stylesheet).
styles=css/theme.css

# Honor Keycloak's native realm-level "Dark mode" toggle (Realm Settings →
# Themes → Dark mode). darkMode=true advertises the capability; Keycloak then
# sets the `darkMode` template variable true only when the realm toggle is also
# on. template.ftl uses that to apply `.dark` based on the OS color scheme;
# when the toggle is off, the page stays light. kcDarkModeClass is OUR dark
# class (.dark), which the compiled Tailwind theme keys off.
darkMode=true
kcDarkModeClass=dark

# Keep <html>/<body> free of PatternFly page classes.
kcHtmlClass=
kcBodyClass=

# --- Forms / fields -------------------------------------------------
kcFormClass=
kcFormGroupClass=kc-field
kcFormGroupErrorClass=
kcLabelClass=kc-label
kcLabelWrapperClass=kc-label-row
kcInputWrapperClass=
kcInputClass=kc-input
kcInputErrorMessageClass=kc-field-error
kcInputGroup=kc-input-group
kcInputHelperTextClass=kc-hint
kcFormHelperTextClass=kc-hint
kcFormOptionsClass=
kcFormOptionsWrapperClass=
kcFormButtonsClass=kc-actions
kcFormSettingClass=kc-row

# Password reveal toggle (button styled; icons inlined per-page where shown).
kcFormPasswordVisibilityButtonClass=kc-input-toggle
kcFormPasswordVisibilityIconShow=
kcFormPasswordVisibilityIconHide=

# --- Buttons --------------------------------------------------------
kcButtonClass=kc-btn
kcButtonPrimaryClass=kc-btn-primary
kcButtonDefaultClass=kc-btn-outline
kcButtonSecondaryClass=kc-btn-outline
kcButtonBlockClass=
kcButtonLargeClass=
kcButtonLinkClass=kc-link

# --- Checkboxes / radios -------------------------------------------
kcCheckboxInputClass=kc-checkbox
kcCheckboxLabelClass=kc-check-label
kcRadioInputClass=kc-checkbox
kcRadioLabelClass=kc-check-label

# --- Social / identity providers -----------------------------------
kcFormSocialAccountSectionClass=kc-social-section
kcFormSocialAccountListClass=kc-social-list
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=kc-btn kc-btn-outline
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
kcFormSocialAccountListButtonDisabledClass=pointer-events-none opacity-50
kcCommonLogoIdP=

# --- Alerts ---------------------------------------------------------
kcAlertClass=kc-alert
kcAlertTitleClass=

# --- Select-authenticator list -------------------------------------
kcSelectAuthListClass=kc-actions
kcSelectAuthListItemClass=kc-select-item
kcSelectAuthListItemArrowIconClass=
kcSelectAuthListItemFillClass=
kcSelectAuthListItemIconClass=kc-select-item-icon
kcSelectAuthListItemTitle=kc-select-item-title
kcSelectAuthListItemDescriptionClass=kc-hint
kcSelectAuthListItemHeadingClass=

# --- Misc -----------------------------------------------------------
kcContentWrapperClass=
kcResetFlowIcon=
kcLogoIdP-apple=
