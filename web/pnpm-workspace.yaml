packages:
  - ./packages/*
  - ./apps/*
allowBuilds:
  "@firebase/util": true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# Keep @types/react / @types/react-dom on v19 only across the workspace.
#
# Source of the v18 pull: `react-jsx-parser@2.4.1` (transitive via
# @pivox/primitives → react-jsx-parser) declares the v18 type
# packages as optionalDependencies. Without a guard, pnpm installs
# both @18 and @19 side-by-side; tsc and typescript-eslint's project
# service walk both type-root directories and emit 80+
# no-unsafe-assignment errors across any feature that consumes
# @pivox/ui (which transitively pulls primitives → react-jsx-parser).
#
# `ignoredOptionalDependencies` below is the only guard needed: it
# tells pnpm to skip react-jsx-parser's optional @18 install entirely,
# so the orphan @18 directory is never created. The direct devDeps
# resolve to v19 via the catalog. (Verified: removing it reintroduces
# the @18 orphan; with it, `@types/react@18` resolves nowhere.)
#
# We previously ALSO had `overrides: { "@types/react": "catalog:" }`
# as belt-and-suspenders — but it was redundant (ignored deps already
# block the only v18 source) AND broke `pnpm update`, which can't
# round-trip a catalog-referenced override and ejected the `catalog:`
# refs in every consumer's package.json to hardcoded semver. Don't
# re-add it.
#
# Drop the ignoredOptionalDependencies entries (the @types/react pin
# stays in the catalog) once `react-jsx-parser` ships a release with
# @types/react ^19. Upstream: https://github.com/TroyAlford/react-jsx-parser/releases
catalog:
  "@assistant-ui/react": "0.14.23"
  "@assistant-ui/react-ai-sdk": "1.3.37"
  "@eslint/js": "9.39.4"
  "@fontsource-variable/roboto": "5.2.10"
  "@tailwindcss/vite": "4.3.1"
  "@tanstack/devtools-vite": "0.8.1"
  "@tanstack/react-devtools": "0.10.8"
  "@tanstack/react-query": "5.101.1"
  "@tanstack/react-router": "1.170.16"
  "@tanstack/react-router-devtools": "1.167.0"
  "@tanstack/react-router-ssr-query": "1.167.1"
  "@tanstack/react-start": "1.168.26"
  "@tanstack/router-plugin": "1.168.18"
  "@testing-library/dom": "10.4.1"
  "@testing-library/react": "16.3.2"
  "@types/node": "26.0.1"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "@vitejs/plugin-react": "6.0.3"
  "ai": "6.0.209"
  "electron": "42.5.0"
  "electron-builder": "26.15.3"
  "electron-vite": "6.0.0-beta.1"
  "eslint": "9.39.4"
  "firebase": "12.15.0"
  "lucide-react": "1.21.0"
  "prettier": "3.8.4"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "tailwindcss": "4.3.1"
  "typescript": "5.9.3"
  "vite": "8.1.0"
  "vitest": "4.1.9"
ignoredOptionalDependencies:
  - "@types/react"
  - "@types/react-dom"
cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
