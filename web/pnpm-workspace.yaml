packages:
  - ./packages/*
  - ./apps/*
allowBuilds:
  "@parcel/watcher": true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# Keep @types/react / @types/react-dom on v19 only across the workspace.
#
# Source of the v18 pull: `react-jsx-parser@2.4.1` (transitive via
# @pivox/primitives → react-jsx-parser) declares the v18 type
# packages as optionalDependencies. Without a guard, pnpm installs
# both @18 and @19 side-by-side; tsc walks both type-root directories
# and emits 80+ type errors across any feature that consumes
# @pivox/ui (which transitively pulls primitives → react-jsx-parser).
#
# `ignoredOptionalDependencies` below is the only guard needed: it
# tells pnpm to skip react-jsx-parser's optional @18 install entirely,
# so the orphan @18 directory is never created. The direct devDeps
# resolve to v19 via the catalog. (Verified: removing it reintroduces
# the @18 orphan; with it, `@types/react@18` resolves nowhere.)
#
# We previously ALSO had `overrides: { "@types/react": "catalog:react-19" }`
# as belt-and-suspenders — but it was redundant (ignored deps already
# block the only v18 source) AND broke `pnpm update`, which can't
# round-trip a catalog-referenced override and ejected the `catalog:`
# refs in every consumer's package.json to hardcoded semver. Don't
# re-add it.
#
# Drop the ignoredOptionalDependencies entries (the @types/react pin
# stays in the catalog) once `react-jsx-parser` ships a release with
# @types/react ^19. Upstream: https://github.com/TroyAlford/react-jsx-parser/releases
# @streamdown/code still pins shiki ^3 while streamdown 2.5 is on shiki 4. Two
# copies make their HighlightOptions/BundledLanguage types incompatible, so
# collapse them onto the version primitives already depends on.
overrides:
  shiki: "4.4.2"

catalog:
  "@assistant-ui/react": "0.15.13"
  "@assistant-ui/react-ai-sdk": "1.4.5"
  # Electron Forge 8 is PRERELEASE (no stable v8 exists; `latest` is still
  # 7.11.2). We're on it deliberately, for two reasons that v7 can't meet:
  #   1. @electron-forge/plugin-vite@8 is built + tested against `vite ^8`.
  #      v7's plugin-vite is tested against `vite ^5` (pre-Rolldown), so
  #      v7 + our catalog Vite 8 is an untested integration.
  #   2. v7 pulls @electron/rebuild@3.7.2, which resolves `@electron/node-gyp`
  #      from a GIT url — pnpm 11 rejects that under its default
  #      `blockExoticSubdeps` supply-chain policy (ERR_PNPM_EXOTIC_SUBDEP).
  #      v8 uses @electron/rebuild@^4, which resolves node-gyp from the
  #      registry, so the install is clean with the policy left ON.
  # Pinned exactly (no `^`): prerelease ranges drift and would let a new
  # alpha land silently. Bump all nine in lockstep — Forge cross-pins its
  # own packages to the exact same version.
  "@electron-forge/cli": "8.0.0-alpha.10"
  "@electron-forge/maker-deb": "8.0.0-alpha.10"
  "@electron-forge/maker-rpm": "8.0.0-alpha.10"
  "@electron-forge/maker-squirrel": "8.0.0-alpha.10"
  "@electron-forge/maker-zip": "8.0.0-alpha.10"
  "@electron-forge/plugin-fuses": "8.0.0-alpha.10"
  "@electron-forge/plugin-vite": "8.0.0-alpha.10"
  "@electron-forge/shared-types": "8.0.0-alpha.10"
  "@electron/fuses": "2.1.3"
  "@fontsource-variable/roboto": "5.3.0"
  "@tailwindcss/cli": "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  "@tanstack/devtools-vite": "0.8.3"
  "@tanstack/react-devtools": "0.10.9"
  "@tanstack/react-query": "5.101.4"
  "@tanstack/react-router": "1.170.25"
  "@tanstack/react-router-devtools": "1.167.1"
  "@tanstack/react-router-ssr-query": "1.167.1"
  "@tanstack/react-start": "1.168.42"
  "@tanstack/router-plugin": "1.168.29"
  "@testing-library/dom": "10.4.1"
  "@testing-library/react": "16.3.2"
  "@types/node": "26.2.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.4"
  "@vitejs/plugin-react": "6.0.5"
  "@xyflow/react": "12.11.2"
  "ai": "7.0.58"
  "electron": "43.3.0"
  "elkjs": "0.12.0"
  "jsdom": "30.0.1"
  "keycloak-js": "26.2.4"
  "lucide-react": "1.31.0"
  "prettier": "3.9.6"
  "react": "19.2.8"
  "react-dom": "19.2.8"
  "tailwindcss": "4.3.3"
  "typescript": "7.0.2"
  "vite": "8.2.1"
  "vitest": "4.1.10"
ignoredOptionalDependencies:
  - "@types/react"
  - "@types/react-dom"
cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true

# Satisfies Electron Forge's pnpm gate (apps/electron), which refuses to run unless
# node-linker=hoisted OR a hoist-pattern is defined. `*` is pnpm's own default,
# so this is a behavioral no-op — it hoists into the virtual store, not into a
# flat node_modules.
#
# node-linker=hoisted was rejected deliberately: it would flatten node_modules
# for every workspace project, losing strict isolation and risking the duplicate
# @types/react problem the ignoredOptionalDependencies guard above prevents.
#
# Safe because plugin-vite sets `packagerConfig.ignore = !file.startsWith('/.vite')`,
# so node_modules is never copied into the app — the asar ships zero of it.
#
# INVARIANT: apps/electron must ship no production dep Vite can't bundle, i.e. no
# native modules — those must exist in node_modules at package time and would
# silently produce a broken app. Adding one means revisiting this.
hoistPattern:
  - "*"
