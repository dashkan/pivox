packages:
  - ./packages/*
  - ./apps/*
allowBuilds:
  '@firebase/util': true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
# Pin @types/react and @types/react-dom to v19 across the workspace.
#
# Source of the v18 pull: `react-jsx-parser@2.4.1` (transitive via
# @pivox/primitives → react-jsx-parser) declares the v18 type
# packages as optionalDependencies in its package.json. Without
# this override, pnpm installs both @18 and @19 side-by-side; tsc
# and typescript-eslint's project service walk both type-root
# directories and emit 80+ no-unsafe-assignment errors across
# any feature that consumes @pivox/ui (which transitively pulls
# primitives → react-jsx-parser).
#
# The `overrides` block below steers consumers in the resolution
# graph to v19 — nothing actually USES the @18 install
# (`pnpm why @types/react@18` returns empty). The
# `ignoredOptionalDependencies` block tells pnpm to skip
# installing the optional deps entirely so the orphan @18
# directory isn't even created.
#
# Drop both entries (and update the workspace's @types/react pin)
# once `react-jsx-parser` ships a release with @types/react ^19.
# Check upstream: https://github.com/TroyAlford/react-jsx-parser/releases
overrides:
  '@types/react': '19.2.16'
  '@types/react-dom': '19.2.3'
ignoredOptionalDependencies:
  - '@types/react'
  - '@types/react-dom'
cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
