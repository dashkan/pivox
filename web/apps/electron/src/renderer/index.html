<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!--
      Content Security Policy for the renderer.

      Auth runs in the system browser (the main-process OIDC flow — see
      main/oidc-login-flow.ts), so the renderer needs no external
      identity-provider origins: it only talks to the Pivox cloud and its
      own bundled assets.

      `connect-src` allow-list:
        - 'self'                  — vite dev server + bundled assets (+ HMR ws)
        - https://pivox.ngrok.app — Pivox cloud (REST + chat SSE + OTLP traces).
                                    Matches the BASE_URL default in api-client.ts
                                    so a fresh clone without VITE_BASE_URL set
                                    still works. Search-replace when the
                                    production origin is provisioned.
        - %VITE_BASE_URL%         — Vite substitutes from the env at build time,
                                    letting direnv etc. override the cloud URL.
                                    Unset → CSP ignores the unknown token.
        - http://localhost:* / ws — vite dev server + HMR.

      Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://pivox.ngrok.app %VITE_BASE_URL% http://localhost:* ws://localhost:*"
    />
    <!--
      Pre-React storage bootstrap. Loaded synchronously in <head> so
      every registered StorageItem's `onBoot` (theme today; any pre-
      paint side effect tomorrow) runs before the React bundle parses.
      The script body is generated by @pivox/storage's
      `buildBootScript()` and emitted by the `pivox-storage-boot-script`
      Vite plugin in electron.vite.config.ts — same source of truth
      start uses for its SSR inline script. Same-origin asset is
      covered by `script-src 'self'`; no CSP hash maintenance.
    -->
    <script src="/bootstrap.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
