<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!--
      Content Security Policy for the renderer.

      `connect-src` allow-list:
        - 'self'                      — vite dev server + bundled assets
        - https://*.googleapis.com    — Firebase Auth identitytoolkit, Google APIs
        - https://*.firebaseio.com    — Firebase real-time DB
        - https://pivox.ngrok.app     — Pivox cloud (REST gateway). Matches
                                        the BASE_URL default in api-client.ts
                                        + broker-auth.ts so a fresh clone
                                        without VITE_BASE_URL set still works.
                                        Search-replace when the production
                                        origin is provisioned.
        - %VITE_BASE_URL%             — Vite substitutes from the env at
                                        build time, letting direnv etc.
                                        override the default cloud URL.
                                        Unset → CSP ignores the unknown
                                        token; the ngrok line above still
                                        covers the in-code fallback.
        - http://localhost:* / 127.*  — vite dev server, broker loopback HTTP

      Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://pivox.ngrok.app %VITE_BASE_URL% http://localhost:* http://127.0.0.1:*"
    />
    <!--
      Pre-React storage bootstrap. Loaded synchronously in <head> so
      every registered StorageItem's `onBoot` (theme today; any pre-
      paint side effect tomorrow) runs before the React bundle parses.
      The script body is generated by @pivox/storage's
      `buildBootScript()` and emitted by the `pivox-storage-boot-script`
      Vite plugin in electron.vite.config.ts — same source of truth
      start uses for its SSR inline script. Same-origin asset is
      covered by `script-src 'self'`; no CSP hash maintenance.
    -->
    <script src="/bootstrap.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
