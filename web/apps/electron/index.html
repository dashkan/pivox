<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pivox</title>
    <!--
      Content Security Policy for the renderer.

      Auth runs in the system browser (the main-process OIDC flow — see
      main/oidc-login-flow.ts), so the renderer needs no external
      identity-provider origins: it only talks to the Pivox cloud and its
      own bundled assets.

      `connect-src` allow-list:
        - 'self'                  — vite dev server + bundled assets (+ HMR ws)
        - %VITE_BASE_URL%         — the Pivox cloud origin (REST + chat SSE +
                                    OTLP traces). Vite substitutes from the env
                                    at build time; set VITE_BASE_URL to the
                                    public host. Unset → CSP drops the token and
                                    the localhost default below applies.
        - http://localhost:* / ws — vite dev server + HMR, and the
                                    http://localhost:8081 default cloud origin
                                    used when VITE_BASE_URL is unset.

      Reference: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' %VITE_BASE_URL% http://localhost:* ws://localhost:*"
    />
    <!-- Pre-React storage bootstrap: <script> is injected by the
         pivox-storage-boot-script plugin in vite.renderer.config.mts. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
