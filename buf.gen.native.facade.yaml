version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: api/proto
    paths:
      # Wide scope (matches cpp.yaml); the `service_filter` plugin
      # option below narrows emission to only services that have a C++
      # bridge counterpart. Emitting facade for services without a
      # bridge produces uncompileable references.
      - api/proto/pivox
      - api/proto/google/api
      - api/proto/google/rpc
      - api/proto/google/type
      - api/proto/google/longrunning
      - api/proto/buf/validate
plugins:
  # Swift facade — async/throws app-facing wrappers on top of the Apple
  # C++ bridge. Hides the withUnsafePointer / OpaquePointer dance. Source
  # in tools/cmd/protoc-gen-pivox-swift-facade/. Binary built by Makefile.
  - local: bin/protoc-gen-pivox-swift-facade
    out: native/platform/macos/swift/AIChat/Client/Generated
    opt:
      - cpp_namespace=pivox::ai_chat
      - cpp_class=ChatClient
      - swift_module=PivoxModels
      - service_filter=pivox.ai.v1.AiChat
