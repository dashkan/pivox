services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_DB: ${USER}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql
      - ./scripts/initdb:/docker-entrypoint-initdb.d

  rustfs:
    image: rustfs/rustfs:latest
    command: server /data
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker/rustfs:/data

  # Local Keycloak — used as a development IDP to validate Pivox SSO
  # configuration against a real OIDC/SAML provider before we wire up
  # Firebase Auth provider configs. Serves at ROOT (no /keycloak base
  # path): envoy proxies /realms/ + /resources/ for the browser SSO
  # login flow. Admin UI is reached directly at http://localhost:8082/
  # (not via envoy). Matches the Aspire keycloak so the issuer
  # (https://pivox.ngrok.app/realms/acme) is identical across both.
  #
  # Bootstrap admin: admin / admin (DEV ONLY — change before exposing
  # this beyond localhost / private ngrok tunnel).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8082:8080"
    volumes:
      - ./.docker/keycloak:/opt/keycloak/data
