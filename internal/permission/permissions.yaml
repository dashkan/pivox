# Source of truth for the v1 permission catalog.
# Edit this file, then run `make generate` to regenerate Go constants
# + matrix.
#
# Conventions:
#   - CRUD verbs (create / read / update / delete) cover standard
#     resource ops. `read` covers both single Get and List — we don't
#     split listing from viewing.
#   - Workflow / lifecycle actions get their own verb (transferOwnership,
#     import, deliver, approve, drain, etc.). These have different blast
#     radius from CRUD and need to be grantable independently.
permissions:
  - id: organizations.read
    display_name: Read Organization
    description: View organization details
    roles: [owner, admin, editor, viewer]
  - id: organizations.update
    display_name: Update Organization
    description: Modify organization settings
    roles: [owner, admin]
  - id: organizations.delete
    display_name: Delete Organization
    description: Delete or restore the organization (covers UndeleteOrganization too — same destruction-class tier)
    roles: [owner]
  - id: organizations.transferOwnership
    display_name: Transfer Ownership
    description: Atomically transfer the owner role to another member
    roles: [owner]
  - id: organizations.ssoConfig.read
    display_name: Read SSO Config
    description: View SSO configuration
    roles: [owner, admin]
  - id: organizations.ssoConfig.update
    display_name: Update SSO Config
    description: Modify SSO configuration
    roles: [owner]
  - id: spaces.create
    display_name: Create Space
    description: Create new spaces in the organization
    roles: [owner, admin]
  - id: spaces.read
    display_name: Read Space
    description: View and list spaces
    roles: [owner, admin, editor, viewer]
  - id: spaces.update
    display_name: Update Space
    description: Modify space metadata
    roles: [owner, admin]
  - id: spaces.delete
    display_name: Delete Space
    description: Delete or restore a space (covers UndeleteSpace too — same destruction-class tier). Admin-allowed because spaces have narrower blast radius than orgs (workgroup vs whole tenant); compare organizations.delete which is owner-only.
    roles: [owner, admin]
