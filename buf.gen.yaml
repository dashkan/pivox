version: v2
clean: true
managed:
  enabled: true
  disable:
    - file_option: go_package
      path: google
    - file_option: go_package
      path: buf
  override:
    - file_option: go_package_prefix
      value: github.com/dashkan/pivox/internal/pkg/gen
inputs:
  - directory: api/proto
    paths:
      - api/proto/pivox
plugins:
  - local: protoc-gen-go
    out: internal/pkg/gen
    opt:
      - module=github.com/dashkan/pivox/internal/pkg/gen
  - local: protoc-gen-go-grpc
    out: internal/pkg/gen
    opt:
      - module=github.com/dashkan/pivox/internal/pkg/gen
  - local: protoc-gen-grpc-gateway
    out: internal/pkg/gen
    opt:
      - module=github.com/dashkan/pivox/internal/pkg/gen
  # protoc-gen-openapiv2 lives in buf.gen.openapi.yaml, not here: the
  # web-facing swagger must EXCLUDE pivox.mcp.v1 (its Organization/Space/
  # ListSpacesResponse messages collide with the canonical pivox.api.v1
  # ones under allow_merge and pollute the web client types). The Go/gRPC
  # plugins above keep generating over every proto, mcp included.
