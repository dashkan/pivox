# Aspire variant of configs/envoy.yaml — DO NOT hand-edit cluster addresses.
# Generated from envoy.yaml with three changes for running envoy as an Aspire
# CONTAINER (Variant B):
#   1. cluster addresses 127.0.0.1 -> host.docker.internal, so the envoy
#      container reaches the host processes (pivox-cloud, web dev server,
#      storage-agent) and the port-pinned sibling containers (keycloak:8082).
#   2. cluster type STATIC -> STRICT_DNS + dns_lookup_family V4_ONLY: STATIC
#      clusters require literal IPs, but host.docker.internal is a DNS name;
#      V4_ONLY avoids the unreachable IPv6 (AAAA) record on Docker Desktop.
#   3. proto_descriptor -> absolute /etc/envoy/pivox.pb (bind-mounted), since
#      envoy resolves it relative to the container CWD, not the config file.
#   4. keycloak cluster: an UpstreamTlsContext transport_socket (NOT produced by
#      the sed below). Aspire's keycloak integration serves HTTPS on its :8082
#      endpoint, unlike the plain-HTTP compose keycloak — so envoy must speak
#      TLS to it. Re-add this block by hand after regenerating.
#   5. OpenTelemetry (NOT in envoy.yaml): (a) the HCM `tracing:` provider + the
#      `otel_collector` cluster -> the CommunityToolkit otel-collector
#      (otel-collector:4317, plaintext h2c) for envoy's own ingress spans; and
#      (b) the `/v1/traces` route + `otel_collector_http` cluster (:4318) for
#      BROWSER/SSR OTLP export from the start/electron apps. Re-add by hand on
#      regen. NOTE: apphost.mts does NOT mount this file directly — it reads it,
#      strips the `# BEGIN/END envoy-otel-tracing` block unless
#      ASPIRE_OTEL_ENVOY_ENABLED is set, and mounts .data/envoy.effective.yaml.
#      Keep those markers intact around the `tracing:` block.
#   6. API-reference (Scalar) direct_response routes: the /api-docs routes carry
#      file paths in `body.filename`. envoy.yaml uses paths relative to the repo
#      root (its CWD); the sed below does NOT rewrite them, so in the container
#      they must be ABSOLUTE under the /etc/envoy/openapi bind-mount (added in
#      apphost.mts from ../api/openapi/v3). Re-apply the absolute paths by hand
#      after regenerating.
# Regenerate after editing envoy.yaml:
#   sed -E -e '/port_value: 9901/!s/address: 127\.0\.0\.1/address: host.docker.internal/g' \
#          -e 's/      type: STATIC/      type: STRICT_DNS\n      dns_lookup_family: V4_ONLY/' \
#          -e 's|proto_descriptor: configs/pivox.pb|proto_descriptor: /etc/envoy/pivox.pb|' \
#     configs/envoy.yaml > configs/envoy.aspire.yaml
#
# Envoy ingress proxy — replaces configs/nginx.conf (Phase 1) and the
# Go grpc-gateway for the REST surface (Phase 2).
#
# The tunnel (Cloudflare) terminates TLS at the public host and forwards plain
# HTTP to localhost:8081. This listener owns 8081. Run /
# validate via the `proxy-envoy*` Makefile targets.
#
# THREE client surfaces share this one listener:
#   1. Native gRPC (grpcurl, macOS grpc-swift)   -> pass-through h2c
#   2. gRPC-Web (browser)                         -> grpc_web filter
#   3. REST/JSON (web app, openapi-typescript)    -> grpc_json_transcoder
# (1)+(2) reach the real gRPC servers untouched; (3) is transcoded to
# gRPC by Envoy and sent to the same servers — retiring grpc-gateway.
#
# What still goes to the Go process on :8080 (the old gateway port):
#   - /internal/  — plain HTTP hooks (identity-sync / registration webhooks), not gRPC.
#   - AiChat REST (:generateContent / :streamGenerateContent) — the SSE
#     ai-sdk stream format is produced by Go and can't be reproduced by
#     the generic transcoder, so AiChat is deliberately NOT transcoded.
#
# Behavioral notes carried over from Phase 1: Envoy streams responses
# natively (no proxy_buffering to port; we disable route+idle timeouts
# on SSE/long-poll routes instead), and x-forwarded-proto is forced to
# https on Keycloak/River/storage-agent (the tunnel is always https).

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    # Bound on :: with ipv4_compat rather than 0.0.0.0: Node resolves `localhost`
    # to ::1 FIRST, so an IPv4-only bind makes any server-side call from the BFF to
    # this ingress ECONNREFUSED. Same class of bug as the one already documented in
    # web/apps/start/vite.config.ts.
    - name: ingress_8081
      address:
        socket_address: { address: "::", port_value: 8081, ipv4_compat: true }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # Per-request access log to stdout — shows up in `make dev`
                # under the `envoy` prefix, one line per proxied request:
                #   <status> <method> <path> -> <cluster> (<ms>) <flags>
                # RESPONSE_FLAGS surfaces upstream issues (UH=no healthy
                # upstream, UF=connect fail, UAEX, etc.). A '-' cluster means
                # Envoy answered directly (CORS preflight, redirect). This is
                # the right knob for "see proxied requests"; raising
                # --log-level instead just floods internal component noise.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%RESPONSE_CODE% %REQ(:METHOD)% %REQ(:PATH)% -> %UPSTREAM_CLUSTER% (%DURATION%ms) %RESPONSE_FLAGS%\n"
                codec_type: AUTO
                use_remote_address: false
                xff_num_trusted_hops: 1
                # ASPIRE-ONLY: OpenTelemetry tracing — one ingress span per
                # request, exported to the otel-collector (otel_collector cluster
                # below). The block between the markers is STRIPPED by apphost.mts
                # unless ASPIRE_OTEL_ENVOY_ENABLED is set (toggle via direnv) — an
                # ingress span per request (incl. every static asset) is noisy.
                # When off, browser + SSR still connect to api: envoy forwards the
                # incoming traceparent and api continues it (one fewer hop span).
                # Keep the markers on their own lines — the apphost regex relies
                # on them. The otel_collector cluster below is kept for both modes.
                # BEGIN envoy-otel-tracing
                tracing:
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otel_collector
                        timeout: 1s
                      service_name: envoy
                # END envoy-otel-tracing
                upgrade_configs:
                  - upgrade_type: websocket
                http_filters:
                  # 1. grpc_web: de-frame browser gRPC-Web <-> gRPC. No-op on
                  #    non-grpc-web requests (REST, web, native gRPC).
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  # 2. cors: preflight + headers. Short-circuits OPTIONS before
                  #    the transcoder sees it. Policy is per-route below.
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  # 3. compressor: gzip. Sits ABOVE the transcoder so on the
                  #    response path it runs AFTER transcoding (gzips the JSON,
                  #    not the protobuf). Skips application/grpc* (not listed).
                  - name: envoy.filters.http.compressor
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
                      compressor_library:
                        name: gzip
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
                      response_direction_config:
                        common_config:
                          min_content_length: 256
                          content_type:
                            - text/plain
                            - text/css
                            - application/json
                            - application/javascript
                            - text/xml
                            - application/xml
                            - image/svg+xml
                            - font/woff2
                  # 4. grpc_json_transcoder: REST/JSON -> gRPC for the 18
                  #    services below. match_incoming_request_route keeps the
                  #    /v1 route explicit (-> grpc_main). AiChat is excluded
                  #    on purpose (SSE stays on Go). Non-matching paths
                  #    (/internal, AiChat verbs, web, assets) pass through.
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/pivox.pb
                      services:
                        - pivox.api.v1.Organizations
                        - pivox.api.v1.Spaces
                        - pivox.api.v1.TagKeys
                        - pivox.api.v1.TagValues
                        - pivox.api.v1.TagBindings
                        - pivox.api.v1.ApiKeys
                        - pivox.api.v1.Dashboards
                        - pivox.iam.v1.Iam
                        - pivox.storage.v1.StorageGateways
                        - pivox.storage.v1.Agents
                        - pivox.storage.v1.Endpoints
                        - pivox.assets.v1.Assets
                        - pivox.assets.v1.Requests
                        - pivox.secrets.v1.Secrets
                        - pivox.workflows.v1.Connectors
                        - pivox.workflows.v1.Workflows
                        - pivox.workflows.v1.WorkflowVersions
                        - pivox.workflows.v1.WorkflowRuns
                      match_incoming_request_route: true
                      auto_mapping: false
                      convert_grpc_status: true
                      print_options:
                        always_print_primitive_fields: false
                        preserve_proto_field_names: false
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: ingress_routes
                  # Raise the direct_response body cap from the 4096-byte default
                  # so the /api-docs routes can serve the OpenAPI spec inline
                  # (~540KB and growing) + the Scalar page. RouteConfiguration
                  # field — sibling of virtual_hosts, not a per-host setting.
                  max_direct_response_body_size_bytes: 4194304
                  # FIRST-MATCH-WINS: specific prefixes/regexes precede general.
                  virtual_hosts:
                    - name: ingress
                      domains: ["*"]
                      routes:
                        # --- Service-to-service gRPC: AgentService (50052) ---
                        # Internal (registration-token auth); no CORS.
                        - match: { prefix: "/pivox.agent.v1.AgentService/" }
                          route: { cluster: grpc_agent, timeout: 0s }

                        # --- Public gRPC + gRPC-Web -> 50051 -----------------
                        # grpc_web de-frames browser calls here; CORS exposes
                        # the grpc trailers browsers need.
                        - match: { prefix: "/pivox." }
                          route: { cluster: grpc_main, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.cors: &grpc_web_cors
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: &cors_origins
                                - safe_regex: { regex: '^https?://localhost(:[0-9]+)?$' }
                                - safe_regex: { regex: '^https?://127\.0\.0\.1(:[0-9]+)?$' }
                                - exact: "null"
                              allow_methods: "POST, OPTIONS"
                              allow_headers: "content-type, x-grpc-web, x-user-agent, grpc-timeout, authorization, traceparent, tracestate"
                              expose_headers: "grpc-status, grpc-message, grpc-status-details-bin"
                              max_age: "86400"
                              allow_credentials: true
                        - match: { prefix: "/google." }
                          route: { cluster: grpc_main, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.cors: *grpc_web_cors
                        - match: { prefix: "/grpc.reflection." }
                          route: { cluster: grpc_main, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.cors: *grpc_web_cors

                        # --- Debug endpoints -> 9090 -------------------------
                        - match: { prefix: "/healthz" }
                          route: { cluster: debug }
                        - match: { prefix: "/readyz" }
                          route: { cluster: debug }

                        # --- API reference (Scalar) — served inline by envoy -
                        # ASPIRE-ONLY PATHS (diverge from envoy.yaml): envoy runs
                        # as a CONTAINER here, so the relative api/openapi/v3/...
                        # filenames don't resolve — they must be absolute, under
                        # the /etc/envoy/openapi bind-mount (apphost.mts). The sed
                        # regen does NOT rewrite direct_response filenames, so
                        # re-apply these two absolute paths after regenerating.
                        # The exact /api-docs/pivox.yaml match MUST precede the
                        # /api-docs prefix, else the prefix swallows the spec.
                        - match: { path: "/api-docs/pivox.yaml" }
                          direct_response:
                            status: 200
                            body: { filename: "/etc/envoy/openapi/pivox.yaml" }
                          response_headers_to_add:
                            - header: { key: content-type, value: "application/yaml" }
                        - match: { prefix: "/api-docs" }
                          direct_response:
                            status: 200
                            body: { filename: "/etc/envoy/openapi/index.html" }
                          response_headers_to_add:
                            - header: { key: content-type, value: "text/html; charset=utf-8" }

                        # --- Keycloak (dev IDP) -> 8082 ----------------------
                        # ASPIRE-ONLY ROUTING (diverges from envoy.yaml): the
                        # Aspire keycloak serves at ROOT, not /keycloak. The OIDC
                        # flow + browser SSO login use /realms/ (auth, token, jwks,
                        # logout, broker, account, .well-known) and /resources/
                        # (login theme css/js) — these come from envoy.yaml and
                        # survive the sed regen unchanged.
                        #
                        # /admin/ + /js/ are MANUAL dev-only additions (not in
                        # envoy.yaml); re-apply THESE TWO after regenerating. They
                        # expose the KC admin console through the public ingress.
                        # SECURITY: never carry /admin/ to prod (prod reaches the
                        # console directly at :8082, not via envoy). The backend
                        # trusts the KC `sub` as identities.id, so realm control =
                        # impersonation of any user; with no edge rate-limit in the
                        # tunneled dev flow, an internet-reachable admin login widens
                        # the blast radius — keep the dev admin password
                        # non-guessable.
                        - match: { prefix: "/realms/" }
                          route: { cluster: keycloak, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # KC_PROXY_HEADERS=xforwarded makes Keycloak build its
                            # issuer + redirect URLs from X-Forwarded-* and IGNORE Host.
                            # With only x-forwarded-proto it assumed the default port for
                            # the scheme, so the local origin's :8443 vanished from the
                            # issuer (https://localhost/realms/pivox) and token validation
                            # failed against PIVOX_OIDC_ISSUER. :authority is whatever the
                            # client actually asked for — "localhost:8443" locally,
                            # "pivox.app" through the tunnel — so this is correct in both
                            # profiles with no per-profile value.
                            - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { prefix: "/resources/" }
                          route: { cluster: keycloak, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # KC_PROXY_HEADERS=xforwarded makes Keycloak build its
                            # issuer + redirect URLs from X-Forwarded-* and IGNORE Host.
                            # With only x-forwarded-proto it assumed the default port for
                            # the scheme, so the local origin's :8443 vanished from the
                            # issuer (https://localhost/realms/pivox) and token validation
                            # failed against PIVOX_OIDC_ISSUER. :authority is whatever the
                            # client actually asked for — "localhost:8443" locally,
                            # "pivox.app" through the tunnel — so this is correct in both
                            # profiles with no per-profile value.
                            - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { prefix: "/admin/" }
                          route: { cluster: keycloak, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # KC_PROXY_HEADERS=xforwarded makes Keycloak build its
                            # issuer + redirect URLs from X-Forwarded-* and IGNORE Host.
                            # With only x-forwarded-proto it assumed the default port for
                            # the scheme, so the local origin's :8443 vanished from the
                            # issuer (https://localhost/realms/pivox) and token validation
                            # failed against PIVOX_OIDC_ISSUER. :authority is whatever the
                            # client actually asked for — "localhost:8443" locally,
                            # "pivox.app" through the tunnel — so this is correct in both
                            # profiles with no per-profile value.
                            - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match: { prefix: "/js/" }
                          route: { cluster: keycloak, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            # KC_PROXY_HEADERS=xforwarded makes Keycloak build its
                            # issuer + redirect URLs from X-Forwarded-* and IGNORE Host.
                            # With only x-forwarded-proto it assumed the default port for
                            # the scheme, so the local origin's :8443 vanished from the
                            # issuer (https://localhost/realms/pivox) and token validation
                            # failed against PIVOX_OIDC_ISSUER. :authority is whatever the
                            # client actually asked for — "localhost:8443" locally,
                            # "pivox.app" through the tunnel — so this is correct in both
                            # profiles with no per-profile value.
                            - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # --- Kafka UI (dev tooling) -> /kafka ----------------
                        # ASPIRE-ONLY: browse Kafka topics/events. The UI serves
                        # under /kafka (SERVER_SERVLET_CONTEXT_PATH) so the prefix
                        # passes through unchanged. dev-only — NEVER expose in prod.
                        - match: { prefix: "/kafka" }
                          route: { cluster: kafka_ui, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # --- AiChat REST -> Go gateway (8080) ----------------
                        # BOTH verbs stay on Go: streamGenerateContent is SSE,
                        # and generateContent rides along to keep the AI surface
                        # whole. NOT in the transcoder services list, so it
                        # passes through untranscoded. timeout 0s for the SSE
                        # stream. CORS like /v1 but POST-only.
                        - match:
                            safe_regex:
                              regex: '^/v1/organizations/[^/]+/users/[^/]+:(streamGenerateContent|generateContent)$'
                          route:
                            cluster: rest_gateway
                            timeout: 0s
                            idle_timeout: 0s
                          response_headers_to_add:
                            - header: { key: vary, value: origin }
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: *cors_origins
                              allow_methods: "POST, OPTIONS"
                              allow_headers: "Authorization, Content-Type, traceparent, tracestate"
                              max_age: "86400"
                              allow_credentials: true

                        # --- Browser OTLP traces -> otel-collector (4318) ----
                        # ASPIRE-ONLY (no such cluster in envoy.yaml): the start +
                        # electron apps export browser spans here; envoy forwards
                        # to the collector's HTTP receiver, which fans out to the
                        # dashboard. MUST precede /v1/ (the transcoder route) so an
                        # exact /v1/traces isn't swallowed by it. CORS reuses the
                        # localhost/null origins (start same-origin, electron-dev
                        # localhost, electron-prod null).
                        #
                        # ⚠ DEV ONLY — this is an UNAUTHENTICATED OTLP ingest. It's
                        # fine behind the local dev tunnel, but NEVER add this route
                        # (or otel_collector_http) to a prod/public ingress: it would
                        # be an open span sink (dashboard pollution / DoS).
                        - match: { path: "/v1/traces" }
                          route: { cluster: otel_collector_http, timeout: 0s }
                          typed_per_filter_config:
                            envoy.filters.http.cors: *grpc_web_cors

                        # --- REST -> gRPC TRANSCODED -> grpc_main (50051) ----
                        # The 18 services above. Envoy turns JSON into gRPC and
                        # routes here (match_incoming_request_route keeps the
                        # /v1 path). Replaces grpc-gateway for these.
                        - match: { prefix: "/v1/" }
                          route: { cluster: grpc_main, timeout: 60s }
                          response_headers_to_add:
                            - header: { key: vary, value: origin }
                          typed_per_filter_config:
                            envoy.filters.http.cors: &rest_cors
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match: *cors_origins
                              allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                              allow_headers: "Authorization, Content-Type, traceparent, tracestate"
                              max_age: "86400"
                              allow_credentials: true

                        # --- Internal hooks -> Go gateway (8080) -------------
                        # Plain HTTP handlers (identity-sync / registration webhooks), NOT gRPC.
                        # Stays on Go; transcoder passes through (no http rule).
                        - match: { prefix: "/internal/" }
                          route: { cluster: rest_gateway, timeout: 60s }
                          response_headers_to_add:
                            - header: { key: vary, value: origin }
                          typed_per_filter_config:
                            envoy.filters.http.cors: *rest_cors

                        # --- River UI -> 8080 -------------------------------
                        - match: { path: "/river" }
                          redirect:
                            scheme_redirect: https
                            path_redirect: "/river/"
                            response_code: MOVED_PERMANENTLY
                        - match: { prefix: "/river/" }
                          route: { cluster: rest_gateway, timeout: 0s, idle_timeout: 0s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # --- Remote MCP server -> api REST (rest_gateway) ----
                        # /mcp (Streamable transport) + /mcp/.well-known/... (public
                        # PRM discovery). timeout/idle 0s for the long-lived SSE
                        # stream. Precedes the "/" catch-all (envoy = first match wins).
                        - match: { prefix: "/mcp" }
                          route: { cluster: rest_gateway, timeout: 0s, idle_timeout: 0s }

                        # --- OAuth/OIDC AS metadata discovery -> Keycloak ----
                        # MCP clients fetch the authorization-server metadata at the
                        # host-root or RFC-8414 path-inserted well-known, but Keycloak
                        # only serves it under /realms/{realm}/. Rewrite both forms to
                        # the realm endpoint so discovery succeeds. Realm pinned: pivox.
                        - match:
                            safe_regex:
                              regex: '^/\.well-known/(oauth-authorization-server|openid-configuration)(/.*)?$'
                          route:
                            cluster: keycloak
                            timeout: 0s
                            idle_timeout: 0s
                            regex_rewrite:
                              pattern:
                                regex: '^/\.well-known/([^/]+)(/.*)?$'
                              substitution: /realms/pivox/.well-known/\1
                          request_headers_to_add:
                            # Same reason as the /realms/ route: Keycloak builds the issuer
                            # in this discovery document from X-Forwarded-*, so without them
                            # the document advertises the wrong origin (the port is dropped:
                            # "https://localhost/realms/pivox"). This is the RFC 8414 metadata
                            # endpoint MCP clients discover through, so a wrong issuer here
                            # breaks their auth against any non-443 origin.
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header: { key: x-forwarded-host, value: "%REQ(:AUTHORITY)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # --- TanStack DevTools SSE -> web app (3000) --------
                        - match: { prefix: "/__tsd/" }
                          route: { cluster: web_app, timeout: 0s, idle_timeout: 0s }

                        # --- Hashed static assets -> web app (immutable) ----
                        - match: { prefix: "/assets/" }
                          route: { cluster: web_app }
                          response_headers_to_add:
                            - header:
                                key: cache-control
                                value: "public, max-age=31536000, immutable"

                        # --- Storage agent -> 8083 --------------------------
                        - match: { prefix: "/files/" }
                          route: { cluster: storage_agent, timeout: 60s }
                          request_headers_to_add:
                            - header: { key: x-forwarded-proto, value: https }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # --- Web app (catch-all) -> 3000, WebSocket HMR ------
                        - match: { prefix: "/" }
                          route: { cluster: web_app, timeout: 0s, idle_timeout: 0s }

  clusters:
    # gRPC backends speak HTTP/2 (h2c).
    - name: grpc_main
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_main
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 50051 }

    - name: grpc_agent
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 50052 }

    # HTTP/1.1 backends (default protocol).
    - name: rest_gateway
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest_gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8080 }

    - name: storage_agent
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: storage_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8083 }

    - name: debug
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: debug
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9090 }

    - name: keycloak
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      # Aspire's keycloak integration serves HTTPS (container :8443) on this
      # endpoint, unlike the compose keycloak which was plain HTTP. Speak TLS
      # upstream; an empty UpstreamTlsContext (no validation_context) skips
      # server-cert verification for the dev self-signed cert. NOTE: this block
      # is NOT produced by the regen sed — re-add it after regenerating.
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8082 }

    - name: web_app
      type: STRICT_DNS
      # host.docker.internal resolves to both A and AAAA on Docker Desktop;
      # the Docker host gateway is only reachable over IPv4, so pin V4 to avoid
      # "Network is unreachable" on the IPv6 address.
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: web_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    # IPv4 to match the start dev server's pinned host
                    # (apps/start vite server.host: 127.0.0.1) and every
                    # other cluster. Was "::1" — broke when localhost
                    # resolution flipped IPv6->IPv4 and the dev server
                    # moved to 127.0.0.1.
                    socket_address: { address: host.docker.internal, port_value: 3000 }

    # ASPIRE-ONLY: the CommunityToolkit otel-collector's OTLP gRPC receiver.
    # Container-to-container over the Aspire network (alias `otel-collector`,
    # internal port 4317), plaintext h2c — forceNonSecureReceiver makes the
    # collector accept non-TLS, so no transport_socket/key here.
    - name: otel_collector
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: otel-collector, port_value: 4317 }

    # HTTP/1.1 view of the collector for BROWSER OTLP export (start + electron).
    # Separate from otel_collector (which is h2c :4317 for envoy's own span
    # export) — the browser exporter speaks OTLP/HTTP to :4318. No
    # http2_protocol_options => HTTP/1.1. ASPIRE-ONLY (re-add on regen).
    - name: otel_collector_http
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: otel_collector_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: otel-collector, port_value: 4318 }

    # ASPIRE-ONLY (dev): Kafka UI for browsing topics/events, ingressed at /kafka.
    # Container-to-container over the Aspire network (alias `kafka-ui`, internal
    # port 8080 — kafka-ui's default server port). HTTP/1.1. Re-add on regen;
    # dev-only, NEVER ingress this in prod.
    - name: kafka_ui
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 1s
      load_assignment:
        cluster_name: kafka_ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: kafka-ui, port_value: 8080 }
