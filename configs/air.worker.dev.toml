# air config — hot reload for `pivox-worker` with the `dev` build
# tag. Used by `make dev-air-worker`. Sibling of `.air.worker.toml`;
# differs only in the `cmd` build flags and the `bin` output path
# so the two modes can run side-by-side without stomping each
# other.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/pivox-worker-dev"
  args_bin = []
  cmd = "go build -tags dev -o ./tmp/pivox-worker-dev ./cmd/pivox-worker"
  delay = 1000
  exclude_dir = [
    "bin",
    "build-xcode",
    "deployments",
    "docs",
    "native",
    "scripts",
    "testdata",
    "tmp",
    "tools",
    "vendor",
    "web",
    ".docker",
    ".git",
    ".idea",
    ".vscode",
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go", "_test_dev\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "api"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "sql"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
