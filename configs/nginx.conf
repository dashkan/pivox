daemon off;

events {}

http {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;
    gzip_min_length 256;
    gzip_vary on;

    # Preserve the upstream-forwarded scheme. ngrok terminates TLS and
    # forwards plain HTTP with X-Forwarded-Proto: https — without this
    # map, `proxy_set_header X-Forwarded-Proto $scheme` would clobber
    # that with `http` and downstream services (Keycloak especially)
    # would emit insecure absolute URLs into HTTPS pages.
    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $scheme;
        ~.+ $http_x_forwarded_proto;
    }

    # CORS allow-list for cross-origin API calls.
    #
    # The Electron renderer runs at http://localhost:5173 (electron-vite
    # dev) or file:// (packaged), and hits the REST gateway / internal
    # hooks at the pivox.ngrok.app origin. start is same-origin and
    # doesn't need CORS, but adding it to /v1/ + /internal/ is harmless.
    #
    # Echoes the request Origin back when it matches — never `*`, since
    # the renderer sends Authorization (CORS credentials mode requires
    # a specific origin). Unmatched origins get an empty value, which
    # the browser treats as no-CORS-header.
    map $http_origin $cors_origin {
        default                                 "";
        "~^https?://localhost(:[0-9]+)?$"       $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$"    $http_origin;
        # Electron packaged builds load from file://, which sends
        # `Origin: null`. Echoing back `null` is per-spec for the
        # packaged-app case.
        "null"                                  "null";
    }

    server {
        listen 8081;
        http2 on;

        # Service-to-service gRPC: AgentService is on its own listener
        # (registration-token authenticated, no Firebase). Routed by path so
        # the public listener never receives agent traffic. More specific
        # `location` wins in nginx, so this rule precedes /pivox.
        location /pivox.agent.v1.AgentService/ {
            grpc_pass grpc://127.0.0.1:50052;
        }

        # gRPC (native HTTP/2 clients like grpcurl)
        location /pivox. {
            grpc_pass grpc://127.0.0.1:50051;
        }
        location /google. {
            grpc_pass grpc://127.0.0.1:50051;
        }
        location /grpc.reflection. {
            grpc_pass grpc://127.0.0.1:50051;
        }

        # Debug endpoints
        location /healthz {
            proxy_pass http://127.0.0.1:9090;
        }
        location /readyz {
            proxy_pass http://127.0.0.1:9090;
        }

        # Keycloak (dev IDP). Configured with KC_HTTP_RELATIVE_PATH=/keycloak
        # so Keycloak generates URLs prefixed with /keycloak; nginx forwards
        # the full URI through to it. Used during phase 3 SSO proto work to
        # validate Firebase Auth provider config shapes against a real IDP.
        location /keycloak/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            # Long-poll friendly — admin UI uses background pings.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # REST gateway (internal + public)
        #
        # Both /internal/ and /v1/ carry the same CORS treatment — the
        # rules are line-for-line identical, but nginx can't `include`
        # a snippet from a single-file conf cleanly, and `add_header`
        # at outer scopes is dropped the moment an inner scope sets
        # one. So the rules are duplicated; keep them in sync.
        #
        # `always` is load-bearing: it sends CORS headers on 4xx/5xx
        # responses too. Without it, a 401 from pivox-cloud surfaces
        # to the browser as a CORS error instead of a 401, masking the
        # real cause.
        location /internal/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Credentials "true"       always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age           "86400"      always;
                add_header Vary                             "Origin"     always;
                add_header Content-Length                   "0"          always;
                add_header Content-Type                     "text/plain; charset=utf-8" always;
                return 204;
            }
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Vary                             "Origin"     always;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v1/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Credentials "true"       always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type" always;
                add_header Access-Control-Max-Age           "86400"      always;
                add_header Vary                             "Origin"     always;
                add_header Content-Length                   "0"          always;
                add_header Content-Type                     "text/plain; charset=utf-8" always;
                return 204;
            }
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Vary                             "Origin"     always;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # River UI — pivox-worker job admin (mounted on pivox-cloud
        # at /river/). Long-poll friendly for the UI's background
        # queries. Pre-prod posture: NO AUTH on /river — must be
        # gated before any production deploy.
        #
        # `/river` (no trailing slash) → 301 to `/river/`. Use
        # absolute_redirect off so nginx emits a path-only Location
        # header instead of `http://pivox.ngrok.app:8081/...` (the
        # default builds the URL from $scheme:$server_name:$port,
        # which ngrok can't reach and the browser would hang on).
        location = /river {
            absolute_redirect off;
            port_in_redirect off;
            return 301 /river/;
        }
        location /river/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Use the mapped forwarded-proto so requests through ngrok
            # (which terminates TLS) report https to riverui — without
            # this the UI would emit http:// asset URLs and the
            # browser would mixed-content-block them.
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            # HTTP/1.1 for chunked transfer + keep-alive. nginx
            # defaults proxy_http_version to 1.0 which breaks modern
            # apps that depend on either.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            absolute_redirect off;
            port_in_redirect off;
        }

        # TanStack DevTools SSE — needs long timeout and no buffering
        location /__tsd/ {
            proxy_pass http://[::1]:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # Hashed static assets — immutable cache
        location /assets/ {
            proxy_pass http://[::1]:3000;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Storage agent — proxies authenticated /files/ requests to
        # rustfs / S3. The agent strips /files/ and routes by first
        # path segment to the matching storage endpoint, validates
        # the bearer JWT, then forwards to its configured S3 backend.
        # /files/ is a permanent part of the URL design (mirrored in
        # prod when the per-gateway edge proxy fronts the agent),
        # not dev scaffolding.
        location /files/ {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Authorization header is forwarded by nginx by default;
            # the agent's strict Bearer parser depends on the exact
            # "Bearer " prefix surviving the hop.
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Web app
        location / {
            proxy_pass http://[::1]:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
