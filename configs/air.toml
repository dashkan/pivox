# air config — hot reload for `pivox-cloud serve` (prod build).
# Used by `make air`. The dev-mode equivalent (build with `-tags dev`)
# lives in `.air.dev.toml`, used by `make dev-air`. Two files instead
# of toggling via env so each mode's `bin` path doesn't collide.
#
# Watching: cmd/, internal/, api/proto/ (regenerated Go), Makefile.
# Excluding: build-xcode/, native/, web/, deployments/, .docker/,
# bin/, tmp/, scripts/, docs/, tools/ — anything that's not Go we
# either don't recompile from, or that has its own watcher.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/pivox-cloud"
  args_bin = ["serve"]
  cmd = "go build -o ./tmp/pivox-cloud ./cmd/pivox-cloud"
  delay = 1000
  exclude_dir = [
    "bin",
    "build-xcode",
    "deployments",
    "docs",
    "native",
    "scripts",
    "testdata",
    "tmp",
    "tools",
    "vendor",
    "web",
    ".docker",
    ".git",
    ".idea",
    ".vscode",
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go", "_test_dev\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "api"]
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "sql"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
