[package]
name = "pivox-highlight"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

# cdylib + embedded-as-Framework is the canonical fix for Apple's
# 3-personality compact-unwind ceiling when mixing Swift / C++ / Obj-C /
# Rust in one Mach-O image. Putting Rust in its own dylib gives the
# main executable __gxx + __objc + Swift slots, while Rust's
# _rust_eh_personality lives alongside its own C++ personality in the
# separate image. See docs/ai/ignored_risks.md and rust-lang#102754.
#
# panic=abort kept on top: we don't rely on catch_unwind across the
# FFI, so any Rust panic is a bug we want to surface as a crash.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"

# Language grammars
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
# tree-sitter-toml pinned to old tree-sitter core — incompatible. Re-add when updated.
tree-sitter-yaml = "0.7"
tree-sitter-swift = "0.7"
tree-sitter-md = "0.5"
