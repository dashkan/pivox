# SwiftLint — semantic analysis only.
# Formatting rules are disabled — Apple's swift-format owns those.

included:
  - platform/macos/swift
  - tests/macos

excluded:
  - build-xcode
  - third_party

# Disable rules that conflict with or duplicate swift-format.
disabled_rules:
  - trailing_comma              # swift-format adds trailing commas (Apple style)
  - trailing_whitespace         # swift-format
  - opening_brace               # swift-format
  - closing_brace               # swift-format
  - colon                       # swift-format
  - comma                       # swift-format
  - leading_whitespace          # swift-format
  - line_length                 # swift-format (100 col)
  - vertical_whitespace         # swift-format
  - closure_parameter_position  # swift-format
  - multiple_closures_with_trailing_closure  # standard SwiftUI pattern (Binding(get:set:))
  - identifier_name             # math code uses intentionally short names (x, y, w, h, tx, ty)

# Keep semantic rules that catch real bugs.
# Everything not disabled above runs with defaults.
