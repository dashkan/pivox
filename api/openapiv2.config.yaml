# Top-level OpenAPI v2 metadata for the merged spec emitted by
# protoc-gen-openapiv2. Consumed via `openapi_configuration=` in buf.gen.yaml.
#
# With `allow_merge=true`, the plugin builds a single swagger object and
# pulls top-level fields (info, schemes, consumes, produces, ...) from the
# proto file whose path matches `file:` below. The matched path must be
# the file path that buf emits in the CodeGeneratorRequest — i.e. relative
# to the buf input root (`api/proto`), NOT the repo root.
#
# Today `pivox/agent/v1/agent.proto` is what buf emits first (alphabetical),
# so we hang the swagger metadata off of it. If we ever add a proto that
# sorts before `pivox/agent/...`, move the `file:` reference accordingly —
# the merged output's `info` falls back to that file's auto-generated title
# otherwise.
openapiOptions:
  file:
    - file: pivox/agent/v1/agent.proto
      option:
        info:
          title: Pivox API
          version: "1.0"
          description: |
            Pivox Cloud Controller — gRPC + REST surface for organizations,
            spaces, IAM, assets, storage, and AI chat.
        schemes:
          - HTTPS
        consumes:
          - application/json
        produces:
          - application/json
        # OAuth2 so Scalar can obtain a token and make authenticated calls.
        # Swagger 2.0 has no openIdConnect scheme (that's OpenAPI 3.0), so this is
        # oauth2 + the authorization-code flow against Keycloak's `pivox` realm
        # (the issuer the backend verifies — PIVOX_OIDC_ISSUER). Point a PUBLIC
        # Keycloak client (PKCE) at the docs origin. URLs are the dev host; a prod
        # deploy needs its own KC origin (Swagger 2.0 can't template these).
        security_definitions:
          security:
            OAuth2:
              type: TYPE_OAUTH2
              flow: FLOW_ACCESS_CODE
              authorization_url: https://pivox.ngrok.app/realms/pivox/protocol/openid-connect/auth
              token_url: https://pivox.ngrok.app/realms/pivox/protocol/openid-connect/token
              scopes:
                scope:
                  openid: OpenID Connect
                  profile: Profile (name, username)
                  email: Email address
        security:
          - security_requirement:
              OAuth2: {}
