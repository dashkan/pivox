---
- disabled_rules:
    - 'core::0133::request-id-field'
    - 'core::0191::proto-package'
    - 'core::0191::java-package'
    - 'core::0191::java-multiple-files'
    - 'core::0191::java-outer-classname'
    # We use a structured Actor message for audit fields
    # (created_by/updated_by/deleted_by) instead of the AIP-148
    # `creator string` convention, so we can carry display_name +
    # email + is_deleted without an extra round-trip. The 'by'
    # preposition rule fires on those names — intentional departure.
    - 'core::0140::prepositions'
    # `pivox.types` is a shared types namespace deliberately
    # referenced from every domain package (pivox.api.v1, pivox.ai.v1,
    # etc.). The api-linter has no "common types" exception so the
    # foreign-type-reference rule fires on every import; suppress
    # globally rather than annotating each call site.
    - 'core::0215::foreign-type-reference'
- included_paths:
    - 'api/proto/pivox/ai/v1/ai_chat.proto'
    - 'api/proto/pivox/ai/v1/messages.proto'
  # The streaming chunk wire format AND the persisted message-part
  # shape both mirror the Vercel AI SDK schemas (UIMessageChunk +
  # UIMessagePart) verbatim so the SSE adapter and the Get/List
  # Message responses both emit the exact JSON useChat accepts.
  # Several AIP-style rules fight that alignment; we suppress them
  # ONLY for these two files with justifications below.
  disabled_rules:
    # Vercel wire field is `toolName` (camelCase) — our proto field
    # is `tool_name` which protojson emits as `toolName`. AIP-122
    # wants `tool` (no `_name` suffix), which would emit as `tool`
    # and break wire compatibility with useChat.
    - 'core::0122::name-suffix'
    # `transient` is a reserved word in Java but is the literal
    # wire field name in Vercel's `data-<name>` chunk schema. The
    # alternative (rename the proto field) forces a translator
    # shim for a field that's otherwise a 1:1 pass-through.
    - 'core::0140::reserved-words'
    # The `File` and `Start` chunk messages are streaming-wire
    # event payloads, not Pivox resources, so adding a
    # google.api.resource annotation would be incorrect.
    - 'core::0123::resource-annotation'
    # The chunk messages use section banner comments ("─── Text
    # ───") that AIP-192 reads as the leading comment for the
    # following entity. We keep the banners — they're the table of
    # contents for the chunk lineup — and rely on inline docs on
    # each message for the actual entity documentation.
    - 'core::0192::only-leading-comments'
    # The streaming chunk messages mirror the Vercel AI SDK
    # `UIMessageChunk` schema field-for-field. The canonical
    # documentation for those fields lives in the SDK
    # (node_modules/ai/src/ui-message-stream/ui-message-chunks.ts).
    # Re-stating it field-by-field in proto creates drift; we keep
    # inline docs where Pivox adds context beyond the spec and rely
    # on the file-level header for the rest.
    - 'core::0192::has-comments'
- included_paths:
    - 'api/proto/pivox/api/v1/watch.proto'
  disabled_rules:
    - 'all'
- included_paths:
    - 'api/proto/pivox/agent/v1/agent.proto'
  disabled_rules:
    - 'all'
- included_paths:
    - 'api/proto/pivox/mcp/v1/mcp_service.proto'
  # The MCP service is a curated, INTERNAL-ONLY, deliberately NON-AIP
  # surface (see the file header): no google.api.http, lite flat
  # messages, fat tools instead of standard methods, raw-slug fields
  # instead of resource paths. Every AIP rule fights that on purpose,
  # so the whole file is exempt from the api-linter.
  disabled_rules:
    - 'all'

