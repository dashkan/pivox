syntax = "proto3";

package pivox.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pivox/iam/v1/members.proto";
import "pivox/iam/v1/permissions.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/api/v1;apiv1";

// Manages Pivox Spaces.
service Spaces {
  option (google.api.default_host) = "api.pivox.io";

  // Retrieves the space identified by the specified `name` (for example,
  // `organizations/123/spaces/my-space`).
  //
  // The caller must have `resourcemanager.spaces.get` permission
  // for this space.
  rpc GetSpace(GetSpaceRequest) returns (Space) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/spaces/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "spaces.read";
  }

  // Lists spaces that are direct children of the specified organization
  // resource. `list()` provides a strongly consistent view of the
  // spaces underneath the specified parent resource. `list()` returns
  // spaces sorted based upon the (ascending) lexical ordering of their
  // `display_name`. The caller must have `resourcemanager.spaces.list`
  // permission on the identified parent.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/spaces"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "spaces.read";
  }

  // Creates a new space under the specified organization.
  rpc CreateSpace(CreateSpaceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/spaces"
      body: "space"
    };
    option (google.api.method_signature) = "parent,space,space_id";
    option (google.longrunning.operation_info) = {
      response_type: "Space"
      metadata_type: "CreateSpaceMetadata"
    };
    option (pivox.permission.v1.required_permission) = "spaces.create";
  }

  // Updates the `display_name` and labels of the space identified by the
  // specified `name` (for example, `organizations/123/spaces/my-space`).
  // Deleting all labels requires an update mask for labels field.
  //
  // The caller must have `resourcemanager.spaces.update` permission for this
  // space.
  rpc UpdateSpace(UpdateSpaceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{space.name=organizations/*/spaces/*}"
      body: "space"
    };
    option (google.api.method_signature) = "space,update_mask";
    option (google.longrunning.operation_info) = {
      response_type: "Space"
      metadata_type: "UpdateSpaceMetadata"
    };
    option (pivox.permission.v1.required_permission) = "spaces.update";
    option (pivox.permission.v1.scope_field) = "space.name";
  }

  // Marks the space identified by the specified
  // `name` (for example, `organizations/123/spaces/my-space`) for deletion.
  //
  // This method will only affect the space if it has a lifecycle state of
  // [ACTIVE][pivox.api.v1.Space.State.ACTIVE].
  //
  // This method changes the Space's lifecycle state from
  // [ACTIVE][pivox.api.v1.Space.State.ACTIVE]
  // to
  // [DELETE_REQUESTED][pivox.api.v1.Space.State.DELETE_REQUESTED].
  // The deletion starts at an unspecified time,
  // at which point the Space is no longer accessible.
  //
  // Until the deletion completes, you can check the lifecycle state
  // checked by retrieving the space with [GetSpace]
  // [pivox.api.v1.Spaces.GetSpace],
  // and the space remains visible to [ListSpaces]
  // [pivox.api.v1.Spaces.ListSpaces].
  // However, you cannot update the space.
  //
  // After the deletion completes, the space is not retrievable by
  // the [GetSpace]
  // [pivox.api.v1.Spaces.GetSpace] and
  // [ListSpaces]
  // [pivox.api.v1.Spaces.ListSpaces] method.
  //
  // This method behaves idempotently, such that deleting a `DELETE_REQUESTED`
  // space will not cause an error, but also won't do anything.
  //
  // If `force=true`, the 30-day grace window is skipped: the LRO
  // synchronously cascades all child data and frees the slug. The
  // space is unrecoverable.
  //
  // The caller must have `resourcemanager.spaces.delete` permissions for this
  // space.
  rpc DeleteSpace(DeleteSpaceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/spaces/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Space"
      metadata_type: "DeleteSpaceMetadata"
    };
    option (pivox.permission.v1.required_permission) = "spaces.delete";
  }

  // Restores the space identified by the specified
  // `name` (for example, `organizations/123/spaces/my-space`).
  // You can only use this method for a space that has a lifecycle state of
  // [DELETE_REQUESTED]
  // [Spaces.State.DELETE_REQUESTED].
  // After deletion starts, the space cannot be restored.
  //
  // The caller must have `resourcemanager.spaces.undelete` permission for
  // this space.
  rpc UndeleteSpace(UndeleteSpaceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/spaces/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Space"
      metadata_type: "UndeleteSpaceMetadata"
    };
    option (pivox.permission.v1.required_permission) = "spaces.delete";
  }

  // Gets a space-scope Member by resource name. Members here are
  // only direct space-level bindings; users with implicit access via
  // their organization role do not appear as space Members.
  rpc GetMember(pivox.iam.v1.GetMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/spaces/*/members/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "members.read";
  }

  // Lists space-scope Members. Direct bindings only — does not include
  // members inherited from the parent org.
  rpc ListMembers(pivox.iam.v1.ListMembersRequest) returns (pivox.iam.v1.ListMembersResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/spaces/*}/members"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "members.read";
  }

  // Creates a space-scope Member binding. The principal must already
  // be a member of the parent organization. No ≥1-owner boundary at
  // space scope.
  rpc CreateMember(pivox.iam.v1.CreateMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/spaces/*}/members"
      body: "member"
    };
    option (google.api.method_signature) = "parent,member,member_id";
    option (pivox.permission.v1.required_permission) = "members.create";
  }

  // Updates a space-scope Member's role. Only `role` is mutable.
  rpc UpdateMember(pivox.iam.v1.UpdateMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {
      patch: "/v1/{member.name=organizations/*/spaces/*/members/*}"
      body: "member"
    };
    option (google.api.method_signature) = "member,update_mask";
    option (pivox.permission.v1.required_permission) = "members.update";
    option (pivox.permission.v1.scope_field) = "member.name";
  }

  // Deletes a space-scope Member binding.
  rpc DeleteMember(pivox.iam.v1.DeleteMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/spaces/*/members/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "members.delete";
  }

  // Returns the subset of requested permissions the caller is allowed
  // on the space. Resolution unions direct space-level bindings with
  // parent-org-level bindings — an org-admin is implicitly a
  // space-admin without an explicit space-scope Member row.
  rpc TestIamPermissions(pivox.iam.v1.TestIamPermissionsRequest) returns (pivox.iam.v1.TestIamPermissionsResponse) {
    option (google.api.http) = {
      post: "/v1/{resource=organizations/*/spaces/*}:testIamPermissions"
      body: "*"
    };
    option (google.api.method_signature) = "resource,permissions";
    option (pivox.permission.v1.exempt) = true;
  }
}

// A space is a high-level Pivox entity. It is a
// container for ACLs, APIs, and other Pivox resources.
message Space {
  option (google.api.resource) = {
    type: "pivox.api/Space"
    pattern: "organizations/{organization}/spaces/{space}"
    plural: "spaces"
    singular: "space"
  };

  // Space lifecycle states.
  enum State {
    // Unspecified state.  This is only used/useful for distinguishing
    // unset values.
    STATE_UNSPECIFIED = 0;

    // The normal and active state.
    ACTIVE = 1;

    // The space has been marked for deletion by the user
    // (by invoking
    // [DeleteSpace][pivox.api.v1.Spaces.DeleteSpace])
    // or by the system (Pivox).
    // This can generally be reversed by invoking [UndeleteSpace]
    // [pivox.api.v1.Spaces.UndeleteSpace].
    DELETE_REQUESTED = 2;
  }

  // Output only. The unique resource name of the space.
  //
  // Example: `organizations/123/spaces/my-space`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The space lifecycle state.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. A user-assigned display name of the space.
  // When present it must be between 4 to 30 characters.
  // Allowed characters are: lowercase and uppercase letters, numbers,
  // hyphen, single-quote, double-quote, space, and exclamation point.
  //
  // Example: `My Space`
  string display_name = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 30
  ];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The most recent time this resource was modified.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which this resource was requested for deletion.
  google.protobuf.Timestamp delete_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which this space will be purged.
  // Approximately 30 days after deletion.
  google.protobuf.Timestamp purge_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A checksum computed by the server based on the current value
  // of the Space resource. This may be sent on update and delete requests to
  // ensure the client has an up-to-date value before proceeding.
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The labels associated with this space.
  //
  // Label keys must be between 1 and 63 characters long and must conform
  // to the following regular expression: \[a-z\](\[-a-z0-9\]*\[a-z0-9\])?.
  //
  // Label values must be between 0 and 63 characters long and must conform
  // to the regular expression (\[a-z\](\[-a-z0-9\]*\[a-z0-9\])?)?.
  //
  // No more than 64 labels can be associated with a given resource.
  //
  // Clients should store labels in a representation such as JSON that does not
  // depend on specific characters being disallowed.
  //
  // Example: `"myBusinessDimension" : "businessValue"`
  map<string, string> labels = 10 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the
// [GetSpace][pivox.api.v1.Spaces.GetSpace]
// method.
message GetSpaceRequest {
  // Required. The name of the space (for example,
  // `organizations/123/spaces/my-space`).
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Space"},
    (buf.validate.field).required = true
  ];
}

// The request sent to the
// [ListSpaces][pivox.api.v1.Spaces.ListSpaces]
// method.
message ListSpacesRequest {
  // Required. The name of the parent resource whose spaces are being listed.
  // Only children of this parent resource are listed; descendants are not
  // listed.
  //
  // Use the value `organizations/{org_id}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.api/Space"},
    (buf.validate.field).required = true
  ];

  // Optional. A pagination token returned from a previous call to
  // [ListSpaces] [pivox.api.v1.Spaces.ListSpaces] that
  // indicates from where listing should continue.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The maximum number of spaces to return in the response.
  // The server can return fewer spaces than requested.
  // If unspecified, server picks an appropriate default.
  int32 page_size = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Indicate that spaces in the `DELETE_REQUESTED` state should
  // also be returned. Normally only `ACTIVE` spaces are returned.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request.
  // Filter rules are case insensitive. Some eligible fields for filtering are:
  //
  // + `displayName`
  // + `state`
  // + `labels` (supports key and key=value matching)
  // + `createTime` (supports comparison operators)
  //
  // Some examples of filter strings:
  //
  // + `displayName = "My Space"` - returns spaces with display name
  //   "My Space".
  // + `displayName = "My*"` - returns spaces whose display name starts
  //   with "My".
  // + `state = ACTIVE` - returns only active spaces.
  // + `labels.color:*` - returns spaces that have the label "color".
  // + `labels.color = red` - returns spaces where label "color" is "red".
  // + `createTime > "2024-01-01T00:00:00Z"` - returns spaces created
  //   after the given timestamp.
  //
  // For more information, see [AIP-160](https://aip.dev/160).
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by. The default
  // order is ascending. Use "desc" after a field name for descending.
  // Supported fields:
  //
  // + `displayName`
  // + `createTime`
  // + `name`
  //
  // Example: `createTime desc, displayName`
  //
  // If not specified, the results are ordered by `name` ascending.
  string order_by = 6 [(google.api.field_behavior) = OPTIONAL];
}

// A page of the response received from the
// [ListSpaces][pivox.api.v1.Spaces.ListSpaces]
// method.
//
// A paginated response where more pages are available has
// `next_page_token` set. This token can be used in a subsequent request to
// retrieve the next request page.
//
// NOTE: A response may contain fewer elements than the request `page_size` and
// still have a `next_page_token`.
message ListSpacesResponse {
  // The list of Spaces under the parent. This list can be paginated.
  repeated Space spaces = 1;

  // Pagination token.
  //
  // If the result set is too large to fit in a single response, this token
  // is returned. It encodes the position of the current result cursor.
  // Feeding this value into a new list request with the `page_token` parameter
  // gives the next page of the results.
  //
  // When `next_page_token` is not filled in, there is no next page and
  // the list returned is the last page in the result set.
  //
  // Pagination tokens have a limited lifetime.
  string next_page_token = 2;
}

// The request sent to the
// [CreateSpace][pivox.api.v1.Spaces.CreateSpace]
// method.
message CreateSpaceRequest {
  // Required. The parent organization for the space.
  // Must be of the form `organizations/{org_id}`.
  string parent = 4 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.api/Space"},
    (buf.validate.field).required = true
  ];

  // Required. The Space to create.
  //
  // Space ID is required. If the requested ID is unavailable, the request
  // fails.
  Space space = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. A unique identifier for the space. If not provided, the server will
  // generate one.
  string space_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the
// [UpdateSpace][pivox.api.v1.Spaces.UpdateSpace]
// method.
//
// Only the `display_name` and `labels` fields can be changed.
message UpdateSpaceRequest {
  // Required. The new definition of the space.
  Space space = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. An update mask to selectively update fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, and the space is not found, a new space will be created.
  // In this situation, update_mask is ignored.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// [DeleteSpace][pivox.api.v1.Spaces.DeleteSpace]
// method.
message DeleteSpaceRequest {
  // Required. The name of the Space (for example,
  // `organizations/123/spaces/my-space`).
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Space"},
    (buf.validate.field).required = true
  ];

  // Optional. The etag known to the client for the expected state of the space.
  // This is to be used for optimistic concurrency.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, bypasses the 30-day grace window: the LRO
  // synchronously cascades all child data (assets, requests, line
  // items, space-scope member bindings, …) and frees the space slug.
  // The space is unrecoverable. Defaults to false (soft-delete with
  // grace; recoverable via `UndeleteSpace` until purge_time).
  bool force = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the [UndeleteSpace]
// [pivox.api.v1.Spaces.UndeleteSpace]
// method.
message UndeleteSpaceRequest {
  // Required. The name of the space (for example,
  // `organizations/123/spaces/my-space`).
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Space"},
    (buf.validate.field).required = true
  ];

  // Optional. The etag known to the client for the expected state of the space.
  // This is to be used for optimistic concurrency.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// A status object which is used as the `metadata` field for the Operation
// returned by CreateSpace.
message CreateSpaceMetadata {}

// A status object which is used as the `metadata` field for the Operation
// returned by UpdateSpace.
message UpdateSpaceMetadata {}

// Metadata for the `DeleteSpace` LRO. Surfaces phase progression
// so callers can render progress UI for long `force=true` cascades.
//
// With `force=false` the LRO completes once the space enters
// `DELETE_REQUESTED`; the data purge runs out of band after
// `purge_time`. With `force=true` the LRO drives the full cascade
// and completes only after child data is purged.
message DeleteSpaceMetadata {
  // Phases of the delete LRO.
  enum Phase {
    // Default; not used.
    PHASE_UNSPECIFIED = 0;

    // Validating preconditions; the space must be ACTIVE.
    VALIDATING = 1;

    // Cancelling other LROs scoped to this space (asset imports,
    // request workflows, etc.).
    CANCELLING_OPERATIONS = 2;

    // Marking the space soft-deleted: `delete_time` set,
    // `purge_time = delete_time + 30d`, state → `DELETE_REQUESTED`.
    // Soft-delete path only.
    MARKING_DELETED = 3;

    // Synchronously cascading child data (assets, requests, line
    // items, space-scope member bindings, …) and freeing the slug.
    // Force path only.
    PURGING = 4;

    // Done. For soft-delete, the space is recoverable via
    // `UndeleteSpace` until `purge_time`. For force, the space and
    // all child data are gone.
    COMPLETED = 5;
  }

  // Output only. Current phase of the cascade.
  Phase phase = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Resource name of the space being deleted.
  string space = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A status object which is used as the `metadata` field for the Operation
// returned by UndeleteSpace.
message UndeleteSpaceMetadata {
  // Output only. Resource name of the space being restored.
  string space = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
