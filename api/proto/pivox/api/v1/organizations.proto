syntax = "proto3";

package pivox.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pivox/api/v1/actor.proto";
import "pivox/api/v1/domains.proto";
import "pivox/api/v1/sso.proto";
import "pivox/iam/v1/members.proto";
import "pivox/iam/v1/permissions.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/api/v1;apiv1";

// Allows users to manage their organization resources.
service Organizations {
  option (google.api.default_host) = "api.pivox.io";

  // Fetches an organization resource identified by the specified resource name.
  rpc GetOrganization(GetOrganizationRequest) returns (Organization) {
    option (google.api.http) = {get: "/v1/{name=organizations/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "organizations.read";
  }

  // Lists organization resources that are visible to the user and satisfy
  // the specified filter.
  //
  // This will only return organizations on which the user has the permission
  // `resourcemanager.organizations.get`
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = {get: "/v1/organizations"};
    option (pivox.permission.v1.exempt) = true;
  }

  // Creates a new organization resource.
  //
  // The caller must have `resourcemanager.organizations.create` permission.
  rpc CreateOrganization(CreateOrganizationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/organizations"
      body: "organization"
    };
    option (google.api.method_signature) = "organization,organization_id";
    option (google.longrunning.operation_info) = {
      response_type: "Organization"
      metadata_type: "CreateOrganizationMetadata"
    };
    option (pivox.permission.v1.exempt) = true;
  }

  // Updates an organization resource. Only the `display_name` and
  // `annotations` fields can be updated. Use the field mask to specify which
  // fields to update. Omitting the field mask updates all mutable fields.
  //
  // The caller must have `resourcemanager.organizations.update` permission
  // on the specified organization.
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{organization.name=organizations/*}"
      body: "organization"
    };
    option (google.api.method_signature) = "organization,update_mask";
    option (google.api.method_signature) = "organization";
    option (google.longrunning.operation_info) = {
      response_type: "Organization"
      metadata_type: "UpdateOrganizationMetadata"
    };
    option (pivox.permission.v1.required_permission) = "organizations.update";
    option (pivox.permission.v1.scope_field) = "organization.name";
  }

  // Soft-deletes an organization. The org transitions to
  // `DELETE_REQUESTED` state with `delete_time` set; `purge_time` is
  // populated to `delete_time + 30 days`. Until purge, the org is
  // recoverable via `UndeleteOrganization` and remains visible to
  // `ListOrganizations` callers who pass `show_deleted=true`. After
  // purge, all data cascades and the slug is freed.
  //
  // If `force=true`, the 30-day grace window is skipped: the LRO
  // synchronously cascades all child data and frees the slug.
  // The org is unrecoverable.
  //
  // The caller must hold the `owner` role on the organization;
  // otherwise the LRO completes with PERMISSION_DENIED. The LRO
  // surfaces cascade progress via `DeleteOrganizationMetadata.Phase`.
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Organization"
      metadata_type: "DeleteOrganizationMetadata"
    };
    option (pivox.permission.v1.required_permission) = "organizations.delete";
  }

  // Restores a soft-deleted organization (`DELETE_REQUESTED` state)
  // back to `ACTIVE`, clearing `delete_time` and `purge_time`. Only
  // callable during the 30-day grace window before purge. After
  // purge there is no way back.
  //
  // The caller must hold the `owner` role on the organization.
  rpc UndeleteOrganization(UndeleteOrganizationRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "Organization"
      metadata_type: "UndeleteOrganizationMetadata"
    };
    option (pivox.permission.v1.required_permission) = "organizations.delete";
  }

  // Gets the SSO configuration for an organization. Returns the
  // SsoConfig singleton at `organizations/{org}/ssoConfig`. If no
  // config has been set, returns NOT_FOUND.
  //
  // (-- api-linter: core::0131::request-name-required=disabled
  //     aip.dev/not-precedent: GetSsoConfig is an AIP-156 singleton
  //     sub-resource read; the parent org disambiguates the singleton. --)
  rpc GetSsoConfig(GetSsoConfigRequest) returns (SsoConfig) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/ssoConfig}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "organizations.ssoConfig.read";
  }

  // Updates the SSO configuration for an organization (AIP-156
  // singleton sub-resource). The server applies changes by calling
  // Firebase Admin SDK to update the underlying provider config,
  // then persists the local SsoConfig row. `client_secret` (when
  // provided) is encrypted at rest via Cloud KMS before storage.
  //
  // (-- api-linter: core::0134::response-message-name=disabled
  //     aip.dev/not-precedent: UpdateSsoConfig is an AIP-156 singleton
  //     sub-resource update; returning the singleton is correct. --)
  rpc UpdateSsoConfig(UpdateSsoConfigRequest) returns (SsoConfig) {
    option (google.api.http) = {
      patch: "/v1/{sso_config.name=organizations/*/ssoConfig}"
      body: "sso_config"
    };
    option (google.api.method_signature) = "sso_config,update_mask";
    option (pivox.permission.v1.required_permission) = "organizations.ssoConfig.update";
    option (pivox.permission.v1.scope_field) = "sso_config.name";
  }

  // Claims a DNS domain on behalf of the organization. The server
  // generates a verification token (returned in the LRO metadata),
  // creates a `Domain` row with `state=PENDING`, and starts polling
  // DNS for the TXT record at `_pivox-verify.<domain>`. The LRO
  // completes when the record is observed (state → VERIFIED) or
  // when the grace window elapses (state → FAILED, phase=EXPIRED).
  //
  // The verification token lives in the LRO metadata and is
  // available immediately on operation creation — clients display
  // DNS-record instructions without waiting for the LRO to finish.
  //
  // The caller must hold a role on the organization that grants
  // `resourcemanager.domains.create`. Returns ALREADY_EXISTS if the
  // domain is already claimed by any organization (the response
  // does not disclose which org).
  rpc CreateDomain(CreateDomainRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/domains"
      body: "domain"
    };
    option (google.api.method_signature) = "parent,domain,domain_id";
    option (google.longrunning.operation_info) = {
      response_type: "Domain"
      metadata_type: "CreateDomainMetadata"
    };
    option (pivox.permission.v1.required_permission) = "domains.create";
  }

  // Lists the domains claimed by an organization, including those
  // still pending verification.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/domains"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "domains.read";
  }

  // Fetches a single domain by resource name.
  rpc GetDomain(GetDomainRequest) returns (Domain) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/domains/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "domains.read";
  }

  // Releases a domain claim. Cancels the in-flight `CreateDomain`
  // LRO if still running. Returns FAILED_PRECONDITION if the
  // domain is the last `VERIFIED` domain on an `enabled=true`
  // SsoConfig (admins must disable SSO or add another verified
  // domain first).
  rpc DeleteDomain(DeleteDomainRequest) returns (Domain) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/domains/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "domains.delete";
  }

  // Creates an invitation to join the organization.
  //
  // The server validates the email against the organization's invitation
  // policy before creating the invitation.
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/invitations"
      body: "invitation"
    };
    option (google.api.method_signature) = "parent,invitation,invitation_id";
    option (pivox.permission.v1.required_permission) = "invitations.create";
  }

  // Lists invitations for the organization.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/invitations"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "invitations.read";
  }

  // Gets an invitation by resource name.
  rpc GetInvitation(GetInvitationRequest) returns (Invitation) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/invitations/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.exempt) = true;
  }

  // Accepts a pending invitation. The caller must be authenticated and
  // their email must match the invitation's email. On success, a user
  // membership is created in the organization and the specified role is
  // assigned.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/invitations/*}:accept"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.exempt) = true;
  }

  // Declines a pending invitation. The caller must be authenticated and
  // their email must match the invitation's email.
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/invitations/*}:decline"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.exempt) = true;
  }

  // Revokes a pending invitation. Only org admins can revoke invitations.
  rpc DeleteInvitation(DeleteInvitationRequest) returns (Invitation) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/invitations/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "invitations.delete";
  }

  // Gets the invitation policy for an organization.
  rpc GetInvitationPolicy(GetInvitationPolicyRequest) returns (InvitationPolicy) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/invitationPolicy}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "invitations.read";
  }

  // Updates the invitation policy for an organization.
  // (-- api-linter: core::0134::response-message-name=disabled
  //     aip.dev/not-precedent: UpdateInvitationPolicy is a singleton sub-resource update. --)
  rpc UpdateInvitationPolicy(UpdateInvitationPolicyRequest) returns (InvitationPolicy) {
    option (google.api.http) = {
      patch: "/v1/{invitation_policy.name=organizations/*/invitationPolicy}"
      body: "invitation_policy"
    };
    option (google.api.method_signature) = "invitation_policy,update_mask";
    option (pivox.permission.v1.required_permission) = "invitations.updatePolicy";
    option (pivox.permission.v1.scope_field) = "invitation_policy.name";
  }

  // Gets an org-scope Member by resource name.
  rpc GetMember(pivox.iam.v1.GetMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/members/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "members.read";
  }

  // Lists org-scope Members.
  rpc ListMembers(pivox.iam.v1.ListMembersRequest) returns (pivox.iam.v1.ListMembersResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/members"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "members.read";
  }

  // Creates an org-scope Member binding. The principal (user or group)
  // must already exist in the organization. The role must be one of
  // the system roles (`owner`, `admin`, `editor`, `viewer`).
  rpc CreateMember(pivox.iam.v1.CreateMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/members"
      body: "member"
    };
    option (google.api.method_signature) = "parent,member,member_id";
    option (pivox.permission.v1.required_permission) = "members.create";
  }

  // Updates an org-scope Member's role. Only `role` is mutable.
  // Refuses to demote the last owner — use TransferOwnership instead.
  rpc UpdateMember(pivox.iam.v1.UpdateMemberRequest) returns (pivox.iam.v1.Member) {
    option (google.api.http) = {
      patch: "/v1/{member.name=organizations/*/members/*}"
      body: "member"
    };
    option (google.api.method_signature) = "member,update_mask";
    option (pivox.permission.v1.required_permission) = "members.update";
    option (pivox.permission.v1.scope_field) = "member.name";
  }

  // Deletes an org-scope Member binding. Refuses to delete the last
  // owner — use TransferOwnership first or promote a co-owner.
  rpc DeleteMember(pivox.iam.v1.DeleteMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/members/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "members.delete";
  }

  // Atomically promotes a user to `owner` and demotes the previous
  // sole owner to `admin` of the organization. Both updates run in a
  // single transaction so the org never has zero owners. Returns
  // FAILED_PRECONDITION when the org already has multiple owners
  // (use UpdateMember + CreateMember instead) or when the new owner
  // is already an owner.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*}:transferOwnership"
      body: "*"
    };
    option (google.api.method_signature) = "name,new_owner";
    option (pivox.permission.v1.required_permission) = "organizations.transferOwnership";
  }

  // Returns the subset of requested permissions the caller is allowed
  // on the organization. UI clients use this to gate buttons and
  // menus. Empty list (not an error) for callers with no role
  // bindings on the org.
  rpc TestIamPermissions(pivox.iam.v1.TestIamPermissionsRequest) returns (pivox.iam.v1.TestIamPermissionsResponse) {
    option (google.api.http) = {
      post: "/v1/{resource=organizations/*}:testIamPermissions"
      body: "*"
    };
    option (google.api.method_signature) = "resource,permissions";
    option (pivox.permission.v1.exempt) = true;
  }
}

// Request message for `Organizations.TransferOwnership`.
message TransferOwnershipRequest {
  // Required. The organization changing hands.
  // Format: `organizations/{organization}`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Organization"},
    (buf.validate.field).required = true
  ];

  // Required. The user receiving owner role.
  // Format: `organizations/{organization}/users/{user}`. Must be an
  // existing member of the org and not already an owner.
  string new_owner = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.iam/User"},
    (buf.validate.field).required = true
  ];

  // Optional. Etag of the organization for optimistic concurrency.
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `Organizations.TransferOwnership`. Returns the
// before/after owner refs so clients can confirm the swap and
// optimistically update their UI without a follow-up read of the
// affected Member rows.
message TransferOwnershipResponse {
  // The user resource that now holds the `owner` role on the
  // organization. Format: `organizations/{organization}/users/{user}`.
  string new_owner = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "pivox.iam/User"}
  ];

  // The user resource that previously held the `owner` role and was
  // demoted to `admin` as part of the transfer. Same format as
  // `new_owner`.
  string previous_owner = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "pivox.iam/User"}
  ];
}

// The root node in the resource hierarchy to which a particular entity's
// (a company, for example) resources belong.
message Organization {
  option (google.api.resource) = {
    type: "pivox.api/Organization"
    pattern: "organizations/{organization}"
    plural: "organizations"
    singular: "organization"
  };

  // Organization lifecycle states.
  enum State {
    // Unspecified state.  This is only useful for distinguishing unset values.
    STATE_UNSPECIFIED = 0;

    // The normal and active state.
    ACTIVE = 1;

    // The organization has been marked for deletion by the user.
    DELETE_REQUESTED = 2;
  }

  // Output only. The resource name of the organization. This is the
  // organization's relative path in the API. Its format is
  // "organizations/[organization_id]". For example, "organizations/1234".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. A human-readable string that refers to the organization in the
  // Pivox Console. This string is set by the server and cannot be
  // changed. The string will be set to the primary domain (for example,
  // "acme.com") of the customer that owns the organization.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The organization's current lifecycle state.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that created this organization.
  Actor created_by = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the Organization was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that last modified this organization.
  Actor updated_by = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the Organization was last modified.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that requested deletion of this organization.
  Actor deleted_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the Organization was requested for deletion.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The time at which this organization will be purged.
  // Approximately 30 days after deletion.
  google.protobuf.Timestamp purge_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A checksum computed by the server based on the current value
  // of the Organization resource. This may be sent on update and delete
  // requests to ensure the client has an up-to-date value before proceeding.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Labels associated with this organization.
  // Labels are key-value pairs that can be used to organize and track resources.
  map<string, string> annotations = 12 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the `GetOrganization` method. The `name` field is
// required. `organization_id` is no longer accepted.
message GetOrganizationRequest {
  // Required. The resource name of the Organization to fetch. This is the
  // organization's relative path in the API, formatted as
  // "organizations/[organizationId]". For example, "organizations/1234".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Organization"},
    (buf.validate.field).required = true
  ];
}

// The request sent to the `ListOrganizations` method.
message ListOrganizationsRequest {
  // Optional. The maximum number of organizations to return in the response.
  // The server can return fewer organizations than requested. If unspecified,
  // server picks an appropriate default.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A pagination token returned from a previous call to
  // `ListOrganizations` that indicates from where listing should continue.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Controls whether organizations in the DELETE_REQUESTED state
  // should be returned. Defaults to false.
  bool show_deleted = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request.
  // Filter rules are case insensitive. Filterable fields:
  //
  // + `displayName`
  // + `state`
  // + `createTime` (supports comparison operators)
  //
  // Examples:
  //
  // + `displayName = "Acme Corp"` — exact match on display name.
  // + `state = ACTIVE` — only active organizations.
  // + `createTime > "2025-01-01T00:00:00Z"` — created after date.
  //
  // For more information, see [AIP-160](https://aip.dev/160).
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by. The default
  // order is ascending. Use "desc" after a field name for descending.
  // Supported fields:
  //
  // + `displayName`
  // + `createTime`
  // + `name`
  //
  // Example: `createTime desc, displayName`
  //
  // If not specified, the results are ordered by `name` ascending.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the
// [CreateOrganization][pivox.api.v1.Organizations.CreateOrganization]
// method.
message CreateOrganizationRequest {
  // Required. The Organization to create.
  Organization organization = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. A unique identifier for the organization. If not provided, the
  // server will generate one. Must start with a letter, contain only lowercase
  // letters, digits, and hyphens, and be between 4 and 20 characters long.
  string organization_id = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string = {pattern: "^[a-z][a-z0-9-]{3,19}$"}
  ];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// The request sent to the
// [UpdateOrganization][pivox.api.v1.Organizations.UpdateOrganization]
// method.
//
// Only the `display_name` and `annotations` fields can be updated. Use the
// `update_mask` to selectively update specific fields.
message UpdateOrganizationRequest {
  // Required. The new definition of the organization. The `name` field must
  // be populated to identify the organization to update.
  Organization organization = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. An update mask to selectively update fields. If not provided,
  // all mutable fields will be updated. See
  // [FieldMask](https://protobuf.dev/reference/protobuf/google.protobuf/#field-mask)
  // for more details.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If set to true, the request will only validate the request
  // without persisting it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The response returned from the `ListOrganizations` method.
message ListOrganizationsResponse {
  // The list of Organizations that matched the list request, possibly
  // paginated.
  repeated Organization organizations = 1;

  // A pagination token to be used to retrieve the next page of results. If the
  // result is too large to fit within the page size specified in the request,
