syntax = "proto3";

package pivox.api.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "pivox/api/v1/data_sources.proto";
import "pivox/api/v1/widgets.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/api/v1;apiv1";

// Manages dashboards at the organization and space scopes.
//
// Dashboards come in two flavors, distinguished by `Dashboard.management_mode`:
//
// * SYSTEM_MANAGED — server-curated dashboards (e.g. the org-level
//   Library, Activity, Members views). Listed and read by all flows;
//   mutations are rejected.
// * USER_MANAGED — customer-owned dashboards. Full CRUD applies.
//
// In v1 every org-level dashboard is SYSTEM_MANAGED; every space-level
// dashboard is USER_MANAGED. The mutation guard is data-driven, not
// path-driven — Create/Update/Delete refuse a SYSTEM_MANAGED target
// regardless of which URL the request came in on.
service Dashboards {
  option (google.api.default_host) = "api.pivox.io";

  // Lists dashboards under a parent. The parent may be an organization
  // (returns the system-curated catalog) or a space (returns
  // user-managed dashboards).
  //
  // The `dashboards.read` permission gates the verb regardless of
  // parent scope; the membership interceptor ahead of it enforces
  // org-membership at org parent and space-membership at space parent.
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*}/dashboards"
      additional_bindings: {get: "/v1/{parent=organizations/*/spaces/*}/dashboards"}
    };
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "dashboards.read";
  }

  // Retrieves a dashboard by name.
  rpc GetDashboard(GetDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/dashboards/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/spaces/*/dashboards/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "dashboards.read";
  }

  // Creates a new dashboard in a space.
  rpc CreateDashboard(CreateDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/spaces/*}/dashboards"
      body: "dashboard"
    };
    option (google.api.method_signature) = "parent,dashboard,dashboard_id";
    option (pivox.permission.v1.required_permission) = "dashboards.create";
  }

  // Updates an existing dashboard.
  rpc UpdateDashboard(UpdateDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {
      patch: "/v1/{dashboard.name=organizations/*/spaces/*/dashboards/*}"
      body: "dashboard"
    };
    option (google.api.method_signature) = "dashboard,update_mask";
    option (pivox.permission.v1.required_permission) = "dashboards.update";
    option (pivox.permission.v1.scope_field) = "dashboard.name";
  }

  // Deletes a dashboard.
  rpc DeleteDashboard(DeleteDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/spaces/*/dashboards/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "dashboards.delete";
  }

  // Resolves a `ResourceQuery` into rows of data for rendering inside
  // a CollectionWidget. The handler dispatches per query.resource_type;
  // v1 supports `pivox.assets/Asset` only.
  //
  // Each row is a `google.protobuf.Struct` whose fields mirror the
  // CollectionWidget.columns / IconConfig contract documented on the
  // widget itself: `name`, `display_name`, `media_type`, `state`,
  // `size_bytes`, `create_time`, plus server-synthesized `icon` (the
  // numeric `Icon` enum value derived from the asset's content type)
  // and `thumbnail_url` (empty in v1; the per-row URL composition
  // lands when the storage-gateway session work merges).
  //
  // Permission: dashboards.read gates the verb. Per-resource ListPermission
  // (e.g. assets.assets.read) is checked at the handler layer once the
  // role hierarchy diverges enough that the two permissions can be
  // granted independently.
  rpc QueryDashboardData(QueryDashboardDataRequest) returns (QueryDashboardDataResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}:queryDashboardData"
      body: "*"
      additional_bindings: {
        post: "/v1/{parent=organizations/*/spaces/*}:queryDashboardData"
        body: "*"
      }
    };
    option (pivox.permission.v1.required_permission) = "dashboards.read";
  }
}

// A dashboard at the organization or space scope.
message Dashboard {
  option (google.api.resource) = {
    type: "pivox.api/Dashboard"
    pattern: "organizations/{organization}/dashboards/{dashboard}"
    pattern: "organizations/{organization}/spaces/{space}/dashboards/{dashboard}"
    plural: "dashboards"
    singular: "dashboard"
  };

  // Identifies who owns the lifecycle of a dashboard. SYSTEM_MANAGED
  // dashboards are server-curated and reject all mutations; USER_MANAGED
  // dashboards are owned by the customer and support full CRUD.
  enum ManagementMode {
    // Default. Server handlers always populate this field on read,
    // so UNSPECIFIED on the wire indicates a server bug, not a
    // legitimate state.
    MANAGEMENT_MODE_UNSPECIFIED = 0;
    // Customer-owned. Full CRUD applies.
    USER_MANAGED = 1;
    // Server-curated. Mutations are rejected with FAILED_PRECONDITION.
    SYSTEM_MANAGED = 2;
  }

  // Immutable. The resource name of the dashboard.
  // Format: `organizations/{organization}/dashboards/{dashboard}` or
  //         `organizations/{organization}/spaces/{space}/dashboards/{dashboard}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Required. A human-readable name for the dashboard.
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];

  // Optional. A longer description of the dashboard's purpose.
  string description = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];

  // The dashboard layout. Currently only grid layout is supported;
  // the oneof allows adding new layout types in the future.
  oneof layout {
    // A grid-based layout with positioned tiles.
    GridLayout grid_layout = 5;
  }

  // Optional. Template variables for parameterizing widget queries.
  repeated DashboardVariable variables = 6 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update time.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Entity tag for optimistic concurrency control.
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Free-form annotations for the dashboard.
  map<string, string> annotations = 10 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Identifies whether this dashboard is server-curated
  // (SYSTEM_MANAGED) or customer-owned (USER_MANAGED). Mutations of
  // SYSTEM_MANAGED dashboards are rejected with FAILED_PRECONDITION
  // regardless of URL path.
  //
  // MAINTAINER: `OUTPUT_ONLY` is documentation, not enforcement. The
  // UpdateDashboard handler MUST reject any FieldMask path that names
  // this field with `INVALID_ARGUMENT`, otherwise a customer can flip
  // the management_mode and escape the SYSTEM_MANAGED mutation guard.
  ManagementMode management_mode = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A template variable that can be referenced in widget queries.
message DashboardVariable {
  // Required. The variable key (used as a template parameter in queries).
  string key = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // Optional. A human-readable label for the variable.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The default value when no selection is made.
  string default_value = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A fixed set of allowed values. If empty, any value is accepted.
  repeated string allowed_values = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for ListDashboards.
message ListDashboardsRequest {
  // Required. The parent organization or space.
  // Format: `organizations/{organization}` or
  //         `organizations/{organization}/spaces/{space}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.api/Dashboard"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of dashboards to return.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous ListDashboards call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request.
  // Filter rules are case insensitive. Filterable fields:
  //
  // + `displayName`
  // + `createTime` (supports comparison operators)
  //
  // Examples:
  //
  // + `displayName = "Overview"` — exact match on display name.
  // + `createTime > "2025-01-01T00:00:00Z"` — created after date.
  //
  // For more information, see [AIP-160](https://aip.dev/160).
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by. The default
  // order is ascending. Use "desc" after a field name for descending.
  // Supported fields:
  //
  // + `displayName`
  // + `createTime`
  //
  // Example: `createTime desc, displayName`
  //
  // If not specified, the results are ordered by `createTime` descending.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ListDashboards.
message ListDashboardsResponse {
  // The dashboards in the space.
  repeated Dashboard dashboards = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// Request message for GetDashboard.
message GetDashboardRequest {
  // Required. The dashboard resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Dashboard"},
    (buf.validate.field).required = true
  ];
}

// Request message for CreateDashboard.
message CreateDashboardRequest {
  // Required. The parent space.
  // Format: `organizations/{organization}/spaces/{space}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.api/Dashboard"},
    (buf.validate.field).required = true
  ];

  // Required. The dashboard to create.
  Dashboard dashboard = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. A client-assigned dashboard ID. If not provided, the server
  // will generate one.
  string dashboard_id = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request without persisting it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for UpdateDashboard.
message UpdateDashboardRequest {
  // Required. The dashboard with updated fields.
  Dashboard dashboard = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. The fields to update. If omitted, all mutable fields are updated.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true and the dashboard does not exist, create it.
  // When set, update_mask is ignored.
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request without persisting it.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for DeleteDashboard.
message DeleteDashboardRequest {
  // Required. The dashboard resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.api/Dashboard"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request without persisting it.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The etag for optimistic concurrency control.
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for QueryDashboardData.
message QueryDashboardDataRequest {
  // Required. The parent scope under which to resolve the query.
  // Format: `organizations/{organization}` (org-scoped) or
  //         `organizations/{organization}/spaces/{space}` (space-scoped).
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Required. The query to resolve. v1 supports
  // `query.resource_type = "pivox.assets/Asset"` only; other resource
  // types return Unimplemented until per-type handlers land.
  ResourceQuery query = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of rows to return per page.
  int32 page_size = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous QueryDashboardData call.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for QueryDashboardData.
message QueryDashboardDataResponse {
  // The rows resolved by the query. Each row is a
  // `google.protobuf.Struct` whose fields correspond to the
  // resource's column-level data plus server-synthesized derived
  // fields (e.g. `icon` as the numeric `Icon` enum value, computed
  // per-row from the resource's content).
  repeated google.protobuf.Struct rows = 1;

  // Token for the next page of rows. Empty when the response is
  // the last page.
  string next_page_token = 2;
}
