syntax = "proto3";

package pivox.workflows.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pivox/permission/v1/options.proto";
import "pivox/types/actor.proto";

option go_package = "pivox/workflows/v1;workflowsv1";

// Connectors manages reusable, credentialed connections to external systems.
// A Connector holds the endpoint config for one system and the credential
// references it needs; workflow activities bind to a Connector by name so the
// workflow definition stays credential-free and portable.
//
// Credentials are never stored inline. Connector config fields are CEL
// expressions evaluated in the connector-config environment, which is the
// ONLY place the `secret("…")` function is available — it resolves a vault
// Secret at request time, at the injection boundary, and the plaintext never
// enters the run context or logs. The run-context CEL (conditions, transforms,
// activity inputs) does not have `secret()`.
//
// A Connector's `agent` decides where activities using it execute: empty runs
// in the cloud controller; a set agent routes execution to that on-prem agent
// over the bidi stream (different agents sit in different networks).
service Connectors {
  option (google.api.default_host) = "api.pivox.io";

  // Lists Connectors under an organization or space.
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*}/connectors"
      additional_bindings: {get: "/v1/{parent=organizations/*/spaces/*}/connectors"}
    };
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "connectors.read";
  }

  // Retrieves a Connector.
  rpc GetConnector(GetConnectorRequest) returns (Connector) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/connectors/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/spaces/*/connectors/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "connectors.read";
  }

  // Creates a Connector.
  rpc CreateConnector(CreateConnectorRequest) returns (Connector) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/connectors"
      body: "connector"
      additional_bindings: {
        post: "/v1/{parent=organizations/*/spaces/*}/connectors"
        body: "connector"
      }
    };
    option (google.api.method_signature) = "parent,connector,connector_id";
    option (pivox.permission.v1.required_permission) = "connectors.create";
  }

  // Updates a Connector.
  rpc UpdateConnector(UpdateConnectorRequest) returns (Connector) {
    option (google.api.http) = {
      patch: "/v1/{connector.name=organizations/*/connectors/*}"
      body: "connector"
      additional_bindings: {
        patch: "/v1/{connector.name=organizations/*/spaces/*/connectors/*}"
        body: "connector"
      }
    };
    option (google.api.method_signature) = "connector,update_mask";
    option (pivox.permission.v1.required_permission) = "connectors.update";
    option (pivox.permission.v1.scope_field) = "connector.name";
  }

  // Deletes a Connector.
  rpc DeleteConnector(DeleteConnectorRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/connectors/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/spaces/*/connectors/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "connectors.delete";
  }
}

// Connector is a reusable, credentialed connection to an external system.
message Connector {
  option (google.api.resource) = {
    type: "pivox.workflows/Connector"
    pattern: "organizations/{organization}/connectors/{connector}"
    pattern: "organizations/{organization}/spaces/{space}/connectors/{connector}"
    plural: "connectors"
    singular: "connector"
  };

  // Immutable. Resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. Human-readable name.
  string display_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 256
  ];

  // Optional. Description.
  string description = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];

  // The typed connector config. Secrets referenced by CEL `secret("…")` inside
  // these fields fire the vault Secret delete-guard.
  oneof config {
    // Configuration for an HTTP connector.
    HttpConnector http = 4;
  }

  // Optional. On-prem agent resource name whose network executes activities
  // using this connector. Empty = the cloud controller.
  string agent = 5 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The identity that created this connector.
  pivox.types.Actor created_by = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that last modified this connector.
  pivox.types.Actor updated_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update time.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Optimistic-concurrency tag.
  string etag = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Labels.
  map<string, string> annotations = 11 [(google.api.field_behavior) = OPTIONAL];
}

// HttpConnector supplies the base URL and headers for HTTP activities. Header
// values are CEL over the connector-config environment: a literal, a
// `secret("…/secrets/x")`, or an expression like `"Bearer " + secret("…")`.
message HttpConnector {
  // Required. The base URL prepended to each HTTP activity's path.
  string base_url = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {uri: true}
  ];

  // Optional. Header name to CEL value (connector-config env; `secret()`
  // allowed). These take precedence over an activity's headers.
  map<string, string> headers = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for ListConnectors.
message ListConnectorsRequest {
  // Required. The parent organization or space.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/Connector"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of Connectors to return; the server caps at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A pagination token from a previous ListConnectors call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An AIP-160 filter expression.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListConnectors.
message ListConnectorsResponse {
  // The Connectors under the requested parent.
  repeated Connector connectors = 1;

  // A pagination token for the next page, empty if there are no more.
  string next_page_token = 2;

  // The distinct, sorted set of non-empty `agent` values present across the
  // list's BASE SCOPE — the whole org (org-direct connectors plus every space)
  // for an org-level list, or the selected space for a space-level list. It is
  // NOT narrowed by the request `filter`, so a client can populate an
  // agent-filter facet with every agent actually assigned to a connector in
  // scope, regardless of the current page's filter. Empty when every connector
  // in scope runs on the cloud controller (agent = "").
  repeated string agents_in_use = 3;
}

// Request for GetConnector.
message GetConnectorRequest {
  // Required. The Connector resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Connector"},
    (buf.validate.field).required = true
  ];
}

// Request for CreateConnector.
message CreateConnectorRequest {
  // Required. The parent organization or space.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/Connector"},
    (buf.validate.field).required = true
  ];

  // Required. The Connector to create.
  Connector connector = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Required. The user-assigned id for the Connector, unique within the parent.
  string connector_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. If true, validate the request but do not create the Connector.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request for UpdateConnector.
message UpdateConnectorRequest {
  // Required. The new state of the Connector.
  Connector connector = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request but do not update the Connector.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for DeleteConnector.
message DeleteConnectorRequest {
  // Required. The Connector resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Connector"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not delete the Connector.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The etag the client expects; used for optimistic concurrency.
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}
