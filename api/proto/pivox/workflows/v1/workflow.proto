syntax = "proto3";

package pivox.workflows.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "pivox/permission/v1/options.proto";
import "pivox/types/actor.proto";

option go_package = "pivox/workflows/v1;workflowsv1";

// Workflows manages workflow definitions. A Workflow is a container; its
// behavior lives in immutable WorkflowVersions. The container points at the
// promoted (live) version, holds the customer's persistent parameter config,
// and records whether it's a Pivox-managed system workflow or customer-owned.
//
// A version's `trigger` decides whether it runs on its own (event/schedule)
// or is a building block invoked only via a `run_workflow` activity. System
// (MANAGED) workflows are always trigger-less building blocks composed by
// customer-owned orchestration workflows — that keeps Pivox free to land new
// versions underneath a caller without a fork/merge.
service Workflows {
  option (google.api.default_host) = "api.pivox.io";

  // Lists Workflows under an organization or space.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*}/workflows"
      additional_bindings: {get: "/v1/{parent=organizations/*/spaces/*}/workflows"}
    };
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "workflows.read";
  }

  // Retrieves a Workflow.
  rpc GetWorkflow(GetWorkflowRequest) returns (Workflow) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/workflows/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/spaces/*/workflows/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "workflows.read";
  }

  // Creates a customer-owned (OWNED) workflow. MANAGED workflows are
  // provisioned by Pivox and cannot be created via this RPC.
  rpc CreateWorkflow(CreateWorkflowRequest) returns (Workflow) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/workflows"
      body: "workflow"
      additional_bindings: {
        post: "/v1/{parent=organizations/*/spaces/*}/workflows"
        body: "workflow"
      }
    };
    option (google.api.method_signature) = "parent,workflow,workflow_id";
    option (pivox.permission.v1.required_permission) = "workflows.create";
  }

  // Updates the container (display_name, description, enabled, config). The
  // definition itself is changed by creating a new WorkflowVersion; the live
  // version is changed via PromoteWorkflowVersion — not here.
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (Workflow) {
    option (google.api.http) = {
      patch: "/v1/{workflow.name=organizations/*/workflows/*}"
      body: "workflow"
      additional_bindings: {
        patch: "/v1/{workflow.name=organizations/*/spaces/*/workflows/*}"
        body: "workflow"
      }
    };
    option (google.api.method_signature) = "workflow,update_mask";
    option (pivox.permission.v1.required_permission) = "workflows.update";
    option (pivox.permission.v1.scope_field) = "workflow.name";
  }

  // Deletes a Workflow. By default this fails if the Workflow has runs; set
  // `force` to cascade its versions and run history.
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/workflows/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/spaces/*/workflows/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "workflows.delete";
  }

  // Forks a Workflow into a new customer-OWNED Workflow: clones the source
  // version's definition and parameter schema and carries its config. Forks
  // receive no auto-upgrade — the escape hatch for structural change to a
  // MANAGED workflow.
  rpc ForkWorkflow(ForkWorkflowRequest) returns (Workflow) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/workflows/*}:fork"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/spaces/*/workflows/*}:fork"
        body: "*"
      }
    };
    option (pivox.permission.v1.required_permission) = "workflows.create";
  }

  // Promotes a version to live (sets Workflow.version). Explicit — a new
  // version is a draft until promoted, so edits never disturb production runs.
  rpc PromoteWorkflowVersion(PromoteWorkflowVersionRequest) returns (Workflow) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/workflows/*}:promote"
      body: "*"
      additional_bindings: {
        post: "/v1/{name=organizations/*/spaces/*/workflows/*}:promote"
        body: "*"
      }
    };
    option (pivox.permission.v1.required_permission) = "workflows.update";
    option (pivox.permission.v1.scope_field) = "name";
  }
}

// WorkflowVersions manages the immutable definition versions of a Workflow.
service WorkflowVersions {
  option (google.api.default_host) = "api.pivox.io";

  // Lists the versions of a Workflow.
  rpc ListWorkflowVersions(ListWorkflowVersionsRequest) returns (ListWorkflowVersionsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*/workflows/*}/versions"
      additional_bindings: {get: "/v1/{parent=organizations/*/spaces/*/workflows/*}/versions"}
    };
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "workflows.read";
  }

  // Retrieves a WorkflowVersion.
  rpc GetWorkflowVersion(GetWorkflowVersionRequest) returns (WorkflowVersion) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/workflows/*/versions/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/spaces/*/workflows/*/versions/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "workflows.read";
  }

  // Mints a new immutable version from a definition. The version is a draft
  // until PromoteWorkflowVersion makes it live.
  rpc CreateWorkflowVersion(CreateWorkflowVersionRequest) returns (WorkflowVersion) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/workflows/*}/versions"
      body: "workflow_version"
      additional_bindings: {
        post: "/v1/{parent=organizations/*/spaces/*/workflows/*}/versions"
        body: "workflow_version"
      }
    };
    option (google.api.method_signature) = "parent,workflow_version";
    option (pivox.permission.v1.required_permission) = "workflows.update";
  }

  // Deletes a version. Only permitted for a version that is not currently
  // promoted (Workflow.version must not point at it).
  rpc DeleteWorkflowVersion(DeleteWorkflowVersionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/workflows/*/versions/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/spaces/*/workflows/*/versions/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "workflows.update";
  }
}

// Workflow is the container for a versioned workflow definition.
message Workflow {
  option (google.api.resource) = {
    type: "pivox.workflows/Workflow"
    pattern: "organizations/{organization}/workflows/{workflow}"
    pattern: "organizations/{organization}/spaces/{space}/workflows/{workflow}"
    plural: "workflows"
    singular: "workflow"
  };

  // Immutable. Resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. Human-readable name.
  string display_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 256
  ];

  // Optional. Description.
  string description = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];

  // Optional. Master switch: when false, no trigger fires a run.
  bool enabled = 4 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Resource name of the promoted (live) WorkflowVersion. Empty
  // until a version is promoted. Set via PromoteWorkflowVersion, not Update.
  string version = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "pivox.workflows/WorkflowVersion"}
  ];

  // Optional. Persistent parameter values applied to every triggered run,
  // validated against the live version's parameter schema. This is where a
  // customer's configuration of a MANAGED workflow lives — it survives
  // version upgrades.
  google.protobuf.Struct config = 6 [(google.api.field_behavior) = OPTIONAL];

  // Output only. Whether Pivox manages this workflow's versions (MANAGED) or
  // the customer owns them (OWNED). Only OWNED workflows are structurally
  // editable; a MANAGED one is configured via `config` or forked.
  WorkflowOrigin origin = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that created this workflow.
  pivox.types.Actor created_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that last modified this workflow.
  pivox.types.Actor updated_by = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Update time.
  google.protobuf.Timestamp update_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Optimistic-concurrency tag.
  string etag = 12 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Labels.
  map<string, string> annotations = 13 [(google.api.field_behavior) = OPTIONAL];
}

// WorkflowVersion is an IMMUTABLE definition. Editing a workflow mints a new
// one; it is a draft until promoted.
message WorkflowVersion {
  option (google.api.resource) = {
    type: "pivox.workflows/WorkflowVersion"
    pattern: "organizations/{organization}/workflows/{workflow}/versions/{version}"
    pattern: "organizations/{organization}/spaces/{space}/workflows/{workflow}/versions/{version}"
    plural: "workflowVersions"
    singular: "workflowVersion"
  };

  // Immutable. Resource name; the {version} segment is a monotonic id.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. Author's change note for this version.
  string note = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 1024
  ];

  // Optional. The run input contract. Manual runs supply values for these;
  // triggered runs use the container's `config` + defaults.
  repeated ParameterDef parameters = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. What fires a run. Absent = a building block, runnable only via
  // a `run_workflow` activity (or a direct RunWorkflow RPC), never by events.
  Trigger trigger = 4 [(google.api.field_behavior) = OPTIONAL];

  // Required. The workflow body — the ordered, nested step sequence.
  Sequence root = 5 [(google.api.field_behavior) = REQUIRED];

  // Output only. The identity that created this version.
  pivox.types.Actor created_by = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time. Immutable — a version has no update time.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ParameterDef declares one input in a version's contract.
message ParameterDef {
  // Required. The parameter's key, unique within the version's contract.
  string key = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The parameter's value type.
  ParamType type = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. Whether a value must be supplied at run time.
  bool required = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Human-readable description of the parameter.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Value used when none is supplied. Every parameter should have a
  // default so the workflow runs out of the box.
  google.protobuf.Value default_value = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Sequence is an ordered list of steps, executed top to bottom.
message Sequence {
  // Required. The ordered steps.
  repeated Step steps = 1 [(google.api.field_behavior) = REQUIRED];
}

// Step is one node in the flow: a leaf Activity, a Condition, or a Parallel.
message Step {
  // Required. Unique within the WorkflowVersion. Names this step's output in
  // the run context (steps.<id>.output).
  string id = 1 [(google.api.field_behavior) = REQUIRED];

  // The step's behavior.
  oneof kind {
    // A leaf activity.
    Activity activity = 2;
    // A conditional block.
    Condition condition = 3;
    // A parallel block.
    Parallel parallel = 4;
  }
}

// Condition is an if / else-if / else block. The first branch whose `when`
// evaluates true runs; if none match, `otherwise` runs when present.
message Condition {
  // Required. The ordered if / else-if branches.
  repeated Branch branches = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. The else block, run when no branch matches.
  Sequence otherwise = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Branch is one arm of a Condition: a CEL guard and the steps it runs.
message Branch {
  // Required. CEL guard evaluated over the run context.
  string when = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. Steps run when `when` evaluates true.
  Sequence then = 2 [(google.api.field_behavior) = REQUIRED];
}

// Parallel runs its branches concurrently and joins (waits for all) at the
// block boundary — the steps after the Parallel run once every branch is done.
message Parallel {
  // Required. The branches run concurrently.
  repeated Sequence branches = 1 [(google.api.field_behavior) = REQUIRED];
}

// Activity is a typed leaf operation. The connector-backed variants (http, ...)
// reference a Connector.
message Activity {
  // The activity's operation.
  oneof kind {
    // An HTTP request through an http Connector.
    HttpActivity http = 1;
    // A run-variable assignment.
    SetActivity set = 2;
    // A sub-workflow invocation.
    RunWorkflowActivity run_workflow = 3;
  }
}

// HttpActivity calls an HTTP endpoint through an http Connector, which
// supplies the base URL, static/credentialed headers, and execution locality.
message HttpActivity {
  // Required. The Connector to use (must be an http connector).
  string connector = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Connector"}
  ];

  // Required. The HTTP method (GET, POST, PUT, DELETE, HEAD).
  string method = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional. CEL path appended to the connector's base URL.
  string path = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Query parameters as CEL over the run context (no secret()).
  map<string, string> query = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Header values as CEL over the run context (no secret()).
  map<string, string> headers = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Request body as a CEL expression producing JSON.
  string body = 6 [(google.api.field_behavior) = OPTIONAL];
}

// SetActivity assigns CEL expressions to named run variables (vars.<name>).
// This is the data-transformation activity — CEL provides math/string/JSON/
// conversion; the UI presents friendly builders that generate the CEL.
message SetActivity {
  // Required. Variable name to CEL expression over the run context (no
  // secret()).
  map<string, string> assignments = 1 [(google.api.field_behavior) = REQUIRED];
}

// RunWorkflowActivity invokes another workflow as a sub-workflow. Subject to
// a call-stack cycle guard + depth cap. This is how customer workflows compose
// system building blocks.
message RunWorkflowActivity {
  // Required. The workflow to run. Resolves to the target's live version at
  // call time; a WorkflowVersion name pins a specific version.
  string workflow = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Workflow"}
  ];

  // Optional. Parameter values (CEL over the run context) passed to the run.
  map<string, string> parameters = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Trigger declares what starts a run automatically.
message Trigger {
  // What fires the run.
  oneof kind {
    // Fires when a subject resource changes.
    ResourceEventTrigger resource_event = 1;
    // Fires on a schedule.
    ScheduleTrigger schedule = 2;
  }
}

// ResourceEventTrigger fires a run when a subject resource changes.
message ResourceEventTrigger {}

// ScheduleTrigger fires a run on a schedule.
message ScheduleTrigger {}

// Request for ListWorkflows.
message ListWorkflowsRequest {
  // Required. The parent organization or space.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of Workflows to return; the server caps at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A pagination token from a previous ListWorkflows call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An AIP-160 filter expression.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListWorkflows.
message ListWorkflowsResponse {
  // The Workflows under the requested parent.
  repeated Workflow workflows = 1;

  // A pagination token for the next page, empty if there are no more.
  string next_page_token = 2;
}

// Request for GetWorkflow.
message GetWorkflowRequest {
  // Required. The Workflow resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];
}

// Request for CreateWorkflow.
message CreateWorkflowRequest {
  // Required. The parent organization or space.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Required. The Workflow to create.
  Workflow workflow = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Required. The user-assigned id for the Workflow, unique within the parent.
  string workflow_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. If true, validate the request but do not create the Workflow.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request for UpdateWorkflow.
message UpdateWorkflowRequest {
  // Required. The new state of the Workflow.
  Workflow workflow = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request but do not update the Workflow.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for DeleteWorkflow.
message DeleteWorkflowRequest {
  // Required. The Workflow resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not delete the Workflow.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The etag the client expects; used for optimistic concurrency.
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Default false refuses to delete a Workflow that has runs; true
  // cascades its versions and run history.
  bool force = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Request for ForkWorkflow.
message ForkWorkflowRequest {
  // Required. The Workflow to fork.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Optional. Version to fork from; empty = the source's live version.
  string source_version = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "pivox.workflows/WorkflowVersion"}
  ];

  // Required. The parent organization or space the fork lands under.
  string parent = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Required. The user-assigned id for the forked Workflow.
  string workflow_id = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. Human-readable name for the forked Workflow.
  string display_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request but do not fork.
  bool validate_only = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Request for PromoteWorkflowVersion.
message PromoteWorkflowVersionRequest {
  // Required. The Workflow whose live version to set.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/Workflow"},
    (buf.validate.field).required = true
  ];

  // Required. The version to promote to live.
  string version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/WorkflowVersion"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not promote.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for ListWorkflowVersions.
message ListWorkflowVersionsRequest {
  // Required. The parent Workflow.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/WorkflowVersion"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of versions to return; the server caps at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A pagination token from a previous ListWorkflowVersions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response for ListWorkflowVersions.
message ListWorkflowVersionsResponse {
  // The versions under the requested Workflow.
  repeated WorkflowVersion workflow_versions = 1;

  // A pagination token for the next page, empty if there are no more.
  string next_page_token = 2;
}

// Request for GetWorkflowVersion.
message GetWorkflowVersionRequest {
  // Required. The WorkflowVersion resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/WorkflowVersion"},
    (buf.validate.field).required = true
  ];
}

// Request for CreateWorkflowVersion.
message CreateWorkflowVersionRequest {
  // Required. The parent Workflow.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.workflows/WorkflowVersion"},
    (buf.validate.field).required = true
  ];

  // Required. The version to create.
  WorkflowVersion workflow_version = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not create the version.
  bool validate_only = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for DeleteWorkflowVersion.
message DeleteWorkflowVersionRequest {
  // Required. The WorkflowVersion resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.workflows/WorkflowVersion"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not delete the version.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];
}

// WorkflowOrigin records who owns a Workflow's versions.
enum WorkflowOrigin {
  // Default, unused.
  WORKFLOW_ORIGIN_UNSPECIFIED = 0;

  // Customer-owned; fully editable.
  OWNED = 1;

  // Pivox-managed system workflow; versions land from Pivox, and the customer
  // configures via `config` or forks for structural change.
  MANAGED = 2;
}

// ParamType is the value type of a workflow parameter.
enum ParamType {
  // Default, unused.
  PARAM_TYPE_UNSPECIFIED = 0;

  // A string value.
  PARAM_STRING = 1;

  // A 64-bit integer value.
  PARAM_INT = 2;

  // A floating-point value.
  PARAM_NUMBER = 3;

  // A boolean value.
  PARAM_BOOL = 4;

  // An AIP resource name.
  PARAM_RESOURCE = 5;

  // A structured object value.
  PARAM_STRUCT = 6;

  // A list value.
  PARAM_LIST = 7;
}
