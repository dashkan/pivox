syntax = "proto3";

package pivox.ai.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "pivox/types/actor.proto";

option go_package = "pivox/ai/v1;aiv1";

// An artifact is a structured output produced during a conversation, such
// as a code snippet, markdown document, or SVG graphic. Artifacts are
// versioned — each edit produces a new ArtifactVersion.
message Artifact {
  option (google.api.resource) = {
    type: "pivox.ai/Artifact"
    pattern: "organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}"
    plural: "artifacts"
    singular: "artifact"
  };

  // The resource name of the artifact.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The type of artifact content (e.g. "code", "markdown", "svg", "image").
  string type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A human-readable title for the artifact.
  string title = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. An optional description of the artifact.
  string description = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The resource name of the latest version.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
  string latest_version = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "pivox.ai/ArtifactVersion"}
  ];

  // Output only. The identity that created this artifact.
  pivox.types.Actor created_by = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the artifact was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that last modified this artifact.
  pivox.types.Actor updated_by = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the artifact was last updated.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A single version of an artifact. Content is stored either inline (small
// text: code, markdown, svg) or as a pointer to the Pivox asset system
// (binary: image, pdf, video).
message ArtifactVersion {
  option (google.api.resource) = {
    type: "pivox.ai/ArtifactVersion"
    pattern: "organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}"
    plural: "versions"
    singular: "artifactVersion"
  };

  // The resource name of the artifact version.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The content storage mode. Either inline bytes or an asset system pointer.
  oneof content {
    // Inline content for small text artifacts (code, markdown, svg).
    InlineContent inline = 2;

    // Resource name of the asset version for binary artifacts.
    // Format: `organizations/{organization}/spaces/{space}/assets/{asset}/versions/{version}`
    string asset_version = 3;
  }

  // Output only. The identity that created this version.
  pivox.types.Actor created_by = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When this version was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Inline content stored directly in the artifact version.
// Capped at 1 MB for text-only artifacts.
message InlineContent {
  // The raw content bytes. Stripped in List responses, returned in Get.
  bytes data = 1;

  // The MIME type of the content (e.g. "text/x-python", "text/markdown").
  string mime_type = 2;

  // The size of the data in bytes.
  int64 size_bytes = 3;
}

// Request message for `GetArtifact`.
message GetArtifactRequest {
  // Required. The resource name of the artifact to retrieve.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/Artifact"},
    (buf.validate.field).required = true
  ];
}

// Request message for `ListArtifacts`.
message ListArtifactsRequest {
  // Required. The parent conversation.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.ai/Artifact"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of artifacts to return.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous ListArtifacts call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. AIP-160 filter. Filterable fields: `title`, `type`, `createTime`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. AIP-132 order_by. Sortable fields: `title`, `createTime`.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `ListArtifacts`.
message ListArtifactsResponse {
  // The artifacts in the conversation.
  repeated Artifact artifacts = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// Request message for `DeleteArtifact`.
message DeleteArtifactRequest {
  // Required. The resource name of the artifact to delete.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/Artifact"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, delete the artifact even if it has versions.
  // If false or unset, the request fails if versions exist.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for `GetArtifactVersion`.
message GetArtifactVersionRequest {
  // Required. The resource name of the artifact version to retrieve.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/ArtifactVersion"},
    (buf.validate.field).required = true
  ];
}

// Request message for `ListArtifactVersions`.
message ListArtifactVersionsRequest {
  // Required. The parent artifact.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.ai/ArtifactVersion"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of versions to return.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Optional. Page token from a previous ListArtifactVersions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. AIP-160 filter. Filterable fields: `createTime`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. AIP-132 order_by. Sortable fields: `createTime`.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `ListArtifactVersions`.
// (-- api-linter: core::0132::response-unknown-fields=disabled
//     aip.dev/not-precedent: versions is the standard name for this sub-resource. --)
message ListArtifactVersionsResponse {
  // The versions of the artifact.
  repeated ArtifactVersion versions = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// Request message for `DeleteArtifactVersion`.
message DeleteArtifactVersionRequest {
  // Required. The resource name of the artifact version to delete.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/ArtifactVersion"},
    (buf.validate.field).required = true
  ];
}
