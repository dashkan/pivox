syntax = "proto3";

package pivox.ai.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "pivox/ai/v1;aiv1";

// A message within a conversation. Messages are produced by the streaming
// path and are read-only through this API.
message Message {
  option (google.api.resource) = {
    type: "pivox.ai/Message"
    pattern: "organizations/{organization}/conversations/{conversation}/messages/{message}"
    plural: "messages"
    singular: "message"
  };

  // The resource name of the message.
  // Format: `organizations/{organization}/conversations/{conversation}/messages/{message}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The role of the message author.
  Role role = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The structured parts of the message.
  repeated MessagePart parts = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. When the message was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A single part of a message. Messages can contain multiple parts of
// different types (text, tool calls, tool results, file references).
message MessagePart {
  oneof part {
    // A text part.
    TextPart text = 1;

    // A reasoning/thinking part.
    ReasoningPart reasoning = 2;

    // A tool call issued by the assistant.
    ToolCallPart tool_call = 3;

    // A tool result provided by the executor.
    ToolResultPart tool_result = 4;

    // A file reference.
    FilePart file = 5;
  }
}

// A text part of a message.
message TextPart {
  // Output only. The text content.
  string text = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A reasoning/thinking part of a message.
message ReasoningPart {
  // Output only. The reasoning text.
  string text = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A tool call issued by the assistant.
message ToolCallPart {
  // Output only. The unique ID of this tool call.
  string tool_call_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The tool to call.
  string tool = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The JSON-encoded input arguments for the tool.
  string input_json = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A tool result produced by executing a tool call.
message ToolResultPart {
  // Output only. The ID of the tool call this result is for.
  string tool_call_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The tool that produced this result.
  string tool = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The JSON-encoded result.
  string result_json = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the tool execution resulted in an error.
  bool is_error = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A file reference within a message.
message FilePart {
  // Output only. The MIME type of the file.
  string mime_type = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The URL or resource name pointing to the file content.
  string url = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `GetMessage`.
message GetMessageRequest {
  // Required. The resource name of the message to retrieve.
  // Format: `organizations/{organization}/conversations/{conversation}/messages/{message}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/Message"},
    (buf.validate.field).required = true
  ];
}

// Request message for `ListMessages`.
message ListMessagesRequest {
  // Required. The parent conversation.
  // Format: `organizations/{organization}/conversations/{conversation}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.ai/Message"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of messages to return.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous ListMessages call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `ListMessages`.
message ListMessagesResponse {
  // The messages in the conversation, ordered by sequence.
  repeated Message messages = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// The role of a message author.
enum Role {
  // Unspecified role.
  ROLE_UNSPECIFIED = 0;

  // A message from the user.
  USER = 1;

  // A message from the AI assistant.
  ASSISTANT = 2;

  // A system prompt message.
  SYSTEM = 3;

  // A tool result message.
  TOOL = 4;
}
