syntax = "proto3";

package pivox.ai.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "pivox/ai/v1/artifacts.proto";
import "pivox/ai/v1/conversations.proto";
import "pivox/ai/v1/messages.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/ai/v1;aiv1";

// AI chat service providing conversation management and content generation.
//
// Resource methods follow AIP conventions. `StreamGenerateContent` is a
// non-AIP server-streaming RPC for live chat transport — it shares a
// request shape with the unary `GenerateContent` so callers can reuse
// request construction across streaming and non-streaming contexts (the
// same pattern the Vercel AI SDK uses with `streamText` / `generateText`,
// and Google's own `models.generateContent` /
// `models.streamGenerateContent`).
//
// Streaming wire format — the proto IS the spec.
//
// The `ServerEvent` oneof and every inner message in this file
// (TextStart, ToolInputAvailable, DataPart, etc.) mirror the
// Vercel AI SDK `UIMessageChunk` schema field-for-field so the
// REST/SSE adapter can produce the exact JSON that
// `uiMessageChunkSchema.parse(...)` accepts in useChat. The
// canonical field-by-field documentation is the Vercel source at
// `node_modules/ai/src/ui-message-stream/ui-message-chunks.ts`
// and `node_modules/ai/docs/04-ai-sdk-ui/50-stream-protocol.mdx`.
//
// Inline Pivox comments are added only where:
//   - the field semantics depart from the Vercel spec, or
//   - the Pivox-side mapping (e.g. tool input streaming, artifact
//     accumulation) needs explanation, or
//   - the field is Pivox-only (no Vercel counterpart).
//
// AIP-192 `has-comments` and `only-leading-comments` are suppressed
// for this file to avoid documentation drift; see
// `api/proto/api-linter.yaml` for the justification.
service AiChat {
  option (google.api.default_host) = "api.pivox.io";

  // Gets a conversation by resource name.
  rpc GetConversation(GetConversationRequest) returns (Conversation) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*/conversations/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Lists conversations in an organization.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/users/*}/conversations"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Creates a new conversation.
  rpc CreateConversation(CreateConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/users/*}/conversations"
      body: "conversation"
    };
    option (google.api.method_signature) = "parent,conversation";
    option (pivox.permission.v1.required_permission) = "ai.conversations.create";
  }

  // Updates a conversation's mutable fields.
  rpc UpdateConversation(UpdateConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      patch: "/v1/{conversation.name=organizations/*/users/*/conversations/*}"
      body: "conversation"
    };
    option (google.api.method_signature) = "conversation,update_mask";
    option (pivox.permission.v1.required_permission) = "ai.conversations.update";
    option (pivox.permission.v1.scope_field) = "conversation.name";
  }

  // Soft-deletes a conversation.
  rpc DeleteConversation(DeleteConversationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/users/*/conversations/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.delete";
  }

  // Gets a message by resource name.
  rpc GetMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*/conversations/*/messages/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Lists messages in a conversation.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/users/*/conversations/*}/messages"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Gets an artifact by resource name.
  rpc GetArtifact(GetArtifactRequest) returns (Artifact) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*/conversations/*/artifacts/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Lists artifacts in a conversation.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/users/*/conversations/*}/artifacts"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Deletes an artifact and all its versions.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/users/*/conversations/*/artifacts/*}"};
    option (google.api.method_signature) = "name";
    // Per YAML rollup: ai.conversations.update covers artifact mutations.
    option (pivox.permission.v1.required_permission) = "ai.conversations.update";
  }

  // Gets an artifact version by resource name.
  rpc GetArtifactVersion(GetArtifactVersionRequest) returns (ArtifactVersion) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*/conversations/*/artifacts/*/versions/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Lists versions of an artifact.
  rpc ListArtifactVersions(ListArtifactVersionsRequest) returns (ListArtifactVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*/users/*/conversations/*/artifacts/*}/versions"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "ai.conversations.read";
  }

  // Deletes an artifact version. If the last version is deleted, the parent
  // artifact is also deleted.
  rpc DeleteArtifactVersion(DeleteArtifactVersionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/users/*/conversations/*/artifacts/*/versions/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.update";
  }

  // Generates assistant content for the given input. Unary: collects
  // the full response and returns it as a single `Message`. Use this
  // for stateless one-shot completions (title summarization, intent
  // classification, etc.) and for stateful turns where the caller
  // doesn't need streaming. Mirrors `generateText` in the Vercel AI
  // SDK and `models.generateContent` in Google's AI APIs.
  rpc GenerateContent(GenerateContentRequest) returns (GenerateContentResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/users/*}:generateContent"
      body: "*"
    };
    option (pivox.permission.v1.required_permission) = "ai.chat.stream";
    option (pivox.permission.v1.scope_field) = "parent";
  }

  // Server-streaming counterpart to `GenerateContent`. Same request
  // shape; emits the response as a sequence of `ServerEvent`s
  // (lifecycle markers, text/reasoning/tool deltas, source/file
  // chunks, data parts, and a terminal `finish`).
  //
  // Each ServerEvent variant maps 1:1 to a Vercel AI SDK
  // UIMessageChunk on the wire — the SSE adapter
  // (POST /v1/{parent}:streamGenerateContent) is a thin translator
  // that strips the proto oneof wrapper and injects the `"type"`
  // discriminator. The proto IS the canonical wire format.
  //
  // The request name, response name, and HTTP suffix are
  // intentionally non-AIP — server-streaming custom methods aren't
  // covered by AIP-136. The streaming variant deliberately reuses
  // `GenerateContentRequest` so callers can construct the request
  // once and pick streaming vs unary at call time. The unary
  // `GenerateContent` above is AIP-clean.
  // (-- api-linter: core::0136::http-uri-suffix=disabled
  //     aip.dev/not-precedent: server-streaming custom method for live chat transport. --)
  // (-- api-linter: core::0136::request-message-name=disabled
  //     aip.dev/not-precedent: shares GenerateContentRequest with the unary variant by design. --)
  // (-- api-linter: core::0136::response-message-name=disabled
  //     aip.dev/not-precedent: server-streaming variant returns ServerEvent stream, not StreamGenerateContentResponse. --)
  rpc StreamGenerateContent(GenerateContentRequest) returns (stream ServerEvent) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*/users/*}:streamGenerateContent"
      body: "*"
    };
    option (pivox.permission.v1.required_permission) = "ai.chat.stream";
    option (pivox.permission.v1.scope_field) = "parent";
  }

  // Generates a short title for the conversation by summarizing its
  // current contents, persists the result to `Conversation.title`,
  // and returns the updated `Conversation`.
  //
  // No-ops (returns the conversation unchanged) when
  // `title_set_by_user` is true — never overwrites a user-curated
  // title. Idempotent in spirit: re-running on the same conversation
  // produces a (possibly updated) title from the latest contents.
  //
  // Typical callers: clients fire this after the first turn of a
  // brand-new conversation, or as a "Regenerate title" action.
  rpc SummarizeConversation(SummarizeConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/v1/{name=organizations/*/users/*/conversations/*}:summarize"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "ai.conversations.update";
  }
}

// Input to `GenerateContent` and `StreamGenerateContent`. Mirrors the
// shape of the Vercel AI SDK's `streamText` / `generateText` params
// and Google's `GenerateContentRequest`: a list of role-tagged
// messages (the conversation turns), an optional system instruction,
// optional tool definitions, and standard generation parameters.
//
// Pivox-specific: `parent` carries the org for routing, and
// `conversation` (optional) opts the call into stateful behavior —
// when set, the server prepends the conversation's stored history
// (and stored system instruction, if any) before the inline
// `messages`, and persists the resulting turn(s) on success. When
// unset, the call is fully stateless: the caller provides whatever
// history is needed inline.
message GenerateContentRequest {
  // Required. The user-in-org parent that scopes this call.
  // Format: `organizations/{organization}/users/{user}`
  //
  // Conversations and messages live under this parent, so the same
  // path is used here and on Get/List/Create/Update/Delete
  // Conversation. Stateless calls (title summarization, intent
  // classification) still carry a user parent — they're attributed
  // to the calling user for audit and billing.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. The conversation to attach this turn to. When set, the
  // server hydrates history from the conversation and persists the
  // new turn(s) on success. When unset, the call is stateless.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
  string conversation = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "pivox.ai/Conversation"}
  ];

  // Required. The new turn(s) the caller wants the model to act on.
  // For stateful calls (`conversation` set), this is typically a
  // single user message. For stateless calls, this is the full
  // conversation history with the final user turn at the end.
  repeated InputMessage messages = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Optional. System instruction applied to this generation. For
  // stateful calls, overrides the conversation's stored system
  // instruction for THIS call only. For stateless calls, this is the
  // only system prompt the model sees.
  string system_instruction = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Tools the model may call during this generation.
  repeated ToolDefinition tools = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Sampling temperature. Server picks a sensible default
  // when unset.
  float temperature = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Maximum output tokens. Server caps this if unset or
  // above its policy limit.
  int32 max_output_tokens = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Response from the unary `GenerateContent`. The streaming variant
// (`StreamGenerateContent`) emits the same content as a sequence of
// `ServerEvent`s instead.
message GenerateContentResponse {
  // The assistant message produced by this generation.
  Message message = 1;

  // Token accounting for billing/observability.
  TokenUsage usage = 2;

  // The model that produced the response.
  string model = 3;
}

// A single conversation turn supplied as input to a generation.
// Shape-matches the Vercel AI SDK `UIMessage` on the wire so the
// SSE handler can decode a request body into `[]*InputMessage`
// directly via `protojson.Unmarshal`. Tool calls, tool results,
// files, reasoning, and text are all represented as `MessagePart`
// variants — no separate request envelopes for tool flows.
message InputMessage {
  // Cross-field constraint: tool-role messages must include at
  // least one tool-* part with state=output-available (the Vercel
  // shape for a tool-result message). Without that, the model has
  // no way to match the result to its earlier tool call.
  option (buf.validate.message).cel = {
    id: "input_message.tool_role_must_have_tool_output"
    message: "tool-role message must include at least one tool-* part with state='output-available'"
    expression: "this.role != 'tool' || this.parts.exists(p, (p.type.startsWith('tool-') || p.type == 'dynamic-tool') && p.state == 'output-available')"
  };

  // Optional. The Vercel-side message ID. Carried for audit/replay
  // round-trip; not used to key persistence on the server (the
  // server generates its own message IDs for persisted turns).
  string id = 1 [(google.api.field_behavior) = OPTIONAL];

  // Required. The role of this message's author. One of:
  // "user", "assistant", "system", "tool".
  //
  // Vercel `useChat` sends the full conversation history on every
  // turn — including its own prior `assistant` responses, and an
  // optional `system` opening — so the server must accept all four
  // roles on input. The historical concern that a caller could
  // inject a fake assistant turn is addressed via:
  //   - stateful mode: when `conversation` is set, the server hydrates
  //     history from the DB and ignores client-claimed assistant turns
  //     beyond the most recent user message.
  //   - stateless mode: the caller controls the model context anyway;
  //     forging assistant context only deceives the caller's own
  //     model call.
  //
  // String (not enum) because Vercel writes lowercase strings on the
  // wire; `protojson` would round-trip a proto enum as uppercase,
  // forcing a translator shim.
  string role = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      in: [
        "user",
        "assistant",
        "system",
        "tool"
      ]
    }
  ];

  // Required. The structured parts of this message.
  repeated MessagePart parts = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];

  // Optional. Free-form metadata associated with this message.
  // Round-trips on the wire as Vercel's UIMessage.metadata.
  google.protobuf.Struct metadata = 4 [(google.api.field_behavior) = OPTIONAL];
}

// A tool the model may invoke during generation. Schemas are
// expressed as JSON Schema (encoded as a JSON string) so this proto
// doesn't need to model the schema language directly.
//
// The identifier field is named `tool` (not `name`) to match the
// existing convention in `ToolCallPart` / `ToolResultPart` and to
// avoid AIP-122's resource-annotation expectation triggered by
// messages containing a `name` field.
message ToolDefinition {
  // Required. The tool's identifier, as the model will reference it.
  string tool = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. A natural-language description shown to the model.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];

  // Required. JSON Schema describing the tool's input arguments,
  // encoded as a JSON string.
  string input_schema_json = 3 [(google.api.field_behavior) = REQUIRED];
}

// Token usage accounting for a generation.
message TokenUsage {
  // Approximate input token count (prompt + history + system).
  int32 input_tokens = 1;

  // Approximate output token count (the generated response).
  int32 output_tokens = 2;
}

// Request message for `SummarizeConversation`.
message SummarizeConversationRequest {
  // Required. The conversation to summarize.
  // Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.ai/Conversation"},
    (buf.validate.field).required = true
  ];
}

// One emission on the streaming wire. Each variant maps 1:1 to a
// Vercel AI SDK UIMessageChunk; the SSE translator strips this
// oneof wrapper and injects the `"type"` discriminator.
//
// Field names on the inner messages are chosen so `protojson` emits
// the exact Vercel JSON without translator field renaming.
//
// Variants are grouped (lifecycle 1-7, text 10-12, reasoning 13-15,
// tool 20-27, source/file 30-32, data 40) with gaps so additions
// don't churn the field-number namespace.
message ServerEvent {
  oneof event {
    // ─── Lifecycle ──────────────────────────────────────────
    // The assistant turn has started. Emitted before any text/
    // tool/reasoning events for the turn.
    Start start = 1;

    // A multi-step turn just rolled into a new model call.
    StartStep start_step = 2;

    // The step (one model call) is over. Followed by either a
    // subsequent `start_step` (tool loop continues) or `finish`.
    FinishStep finish_step = 3;

    // The assistant turn is complete. Terminal.
    Finish finish = 4;

    // The stream was cancelled. Terminal.
    Abort abort = 5;

    // A stream-level error. Terminal.
    Error error = 6;

    // Free-form metadata about the assistant message. Emitted
    // anytime — typically once at end-of-turn carrying final usage.
    MessageMetadata message_metadata = 7;

    // ─── Text ───────────────────────────────────────────────
    TextStart text_start = 10;
    TextDelta text_delta = 11;
    TextEnd text_end = 12;

    // ─── Reasoning ──────────────────────────────────────────
    ReasoningStart reasoning_start = 13;
    ReasoningDelta reasoning_delta = 14;
    ReasoningEnd reasoning_end = 15;

    // ─── Tool input ─────────────────────────────────────────
    ToolInputStart tool_input_start = 20;
    ToolInputDelta tool_input_delta = 21;
    ToolInputAvailable tool_input_available = 22;
    ToolInputError tool_input_error = 23;
    ToolApprovalRequest tool_approval_request = 24;

    // ─── Tool output ────────────────────────────────────────
    ToolOutputAvailable tool_output_available = 25;
    ToolOutputError tool_output_error = 26;
    ToolOutputDenied tool_output_denied = 27;

    // ─── Sources & files ────────────────────────────────────
    SourceUrl source_url = 30;
    SourceDocument source_document = 31;
    File file = 32;

    // ─── Custom data parts ──────────────────────────────────
    // Emitted as Vercel chunk type `data-<name>`. Repeated events
    // with the same `name` + `id` REPLACE the prior data on the
    // client. Used for artifacts (name="artifact"), progress
    // (name="progress"), and any future custom UI part.
    DataPart data = 40;
  }
}

// ─── Lifecycle event messages ───────────────────────────────

message Start {
  // The server-assigned ID for the assistant message produced by
  // this turn. The SSE client (Vercel useChat) keys the assistant
  // message off this; subsequent text/reasoning chunks reference
  // it via their own `id` field.
  string message_id = 1;

  // Optional. Initial metadata for the assistant message.
  google.protobuf.Struct message_metadata = 2;
}

// Marker — emitted before each model call in a multi-step turn.
message StartStep {}

// Marker — emitted after each model call in a multi-step turn.
message FinishStep {}

message Finish {
  // Why the generation stopped. One of: "stop", "length",
  // "content-filter", "tool-calls", "error", "other".
  string finish_reason = 1;

  // Optional. Final metadata for the assistant message (typically
  // input/output token counts, model id, etc.).
  google.protobuf.Struct message_metadata = 2;
}

message Abort {
  // Optional. Human-readable cancellation reason.
  string reason = 1;
}

message Error {
  // The error message surfaced to the client. Should not carry
  // server-internal detail.
  string error_text = 1;
}

// Free-form metadata about the assistant message. The wire chunk
// nests the payload under `messageMetadata`, hence the recursive
// field name — matches Vercel's UIMessageChunk shape verbatim.
message MessageMetadata {
  google.protobuf.Struct message_metadata = 1;
}

// ─── Text event messages ────────────────────────────────────

message TextStart {
  // Block ID. Wire chunk's `id` field; pairs the start/delta/end
  // events of the same text block.
  string id = 1;

  // Optional. Provider-specific metadata (e.g. Anthropic prompt
  // caching counts, OpenAI reasoning summaries).
  google.protobuf.Struct provider_metadata = 2;
}

message TextDelta {
  // Block ID matching the corresponding TextStart.
  string id = 1;

  // The incremental text content for this delta.
  string delta = 2;

  // Optional. Provider-specific metadata.
  google.protobuf.Struct provider_metadata = 3;
}

message TextEnd {
  // Block ID matching the corresponding TextStart.
  string id = 1;

  // Optional. Provider-specific metadata.
  google.protobuf.Struct provider_metadata = 2;
}

// ─── Reasoning event messages ───────────────────────────────

message ReasoningStart {
  string id = 1;
  google.protobuf.Struct provider_metadata = 2;
}

message ReasoningDelta {
  string id = 1;
  string delta = 2;
  google.protobuf.Struct provider_metadata = 3;
}

message ReasoningEnd {
  string id = 1;
  google.protobuf.Struct provider_metadata = 2;
}

// ─── Tool input event messages ──────────────────────────────

message ToolInputStart {
  string tool_call_id = 1;
  string tool_name = 2;

  // True when the upstream provider executes this tool itself
  // (e.g. Anthropic web search). When true, the client should not
  // attempt to run the tool locally.
  bool provider_executed = 3;

  // True when the tool was not statically declared in the
  // request's `tools` — i.e. provider-suggested at runtime.
  bool dynamic = 4;

  // Optional. Display title shown to the user while the tool
  // input is being streamed.
  string title = 5;

  google.protobuf.Struct provider_metadata = 6;
  google.protobuf.Struct tool_metadata = 7;
}

message ToolInputDelta {
  string tool_call_id = 1;

  // The raw provider-emitted input text being streamed (typically
  // JSON characters that will eventually parse into the full
  // `input` carried by `ToolInputAvailable`).
  string input_text_delta = 2;
}

message ToolInputAvailable {
  string tool_call_id = 1;
  string tool_name = 2;

  // The fully-parsed tool input. Carries the input as structured
  // data (not a JSON-encoded string), so consumers don't double-
  // parse and `protojson` emits a native JSON object on the wire.
  google.protobuf.Struct input = 3;

  bool provider_executed = 4;
  bool dynamic = 5;
  string title = 6;

  google.protobuf.Struct provider_metadata = 7;
  google.protobuf.Struct tool_metadata = 8;
}

// Tool input that failed validation (schema mismatch, missing
// required field, etc.). Distinct from `ToolOutputError`, which
// is for execution failures after the input was accepted.
message ToolInputError {
  string tool_call_id = 1;
  string tool_name = 2;
  google.protobuf.Struct input = 3;

  // Human-readable description of the validation failure.
  string error_text = 4;

  bool provider_executed = 5;
  bool dynamic = 6;
  string title = 7;

  google.protobuf.Struct provider_metadata = 8;
  google.protobuf.Struct tool_metadata = 9;
}

message ToolApprovalRequest {
  // Approval session ID; the client returns this on
  // approve/deny to disambiguate concurrent approvals.
  string approval_id = 1;

  // The tool call awaiting approval.
  string tool_call_id = 2;
}

// ─── Tool output event messages ─────────────────────────────

message ToolOutputAvailable {
  string tool_call_id = 1;

  // The tool's result, as structured data. Mirrors
  // ToolInputAvailable.input on the output side.
  google.protobuf.Struct output = 2;

  bool provider_executed = 3;
  bool dynamic = 4;

  // True for a partial/in-progress output (the tool will emit a
  // subsequent non-preliminary output before the call closes).
  bool preliminary = 5;

  google.protobuf.Struct provider_metadata = 6;
  google.protobuf.Struct tool_metadata = 7;
}

message ToolOutputError {
  string tool_call_id = 1;
  string error_text = 2;

  bool provider_executed = 3;
  bool dynamic = 4;

  google.protobuf.Struct provider_metadata = 5;
  google.protobuf.Struct tool_metadata = 6;
}

// The user denied the pending approval request for this tool
// call. Terminal for the call.
message ToolOutputDenied {
  string tool_call_id = 1;
}

// ─── Source & file event messages ───────────────────────────

message SourceUrl {
  string source_id = 1;
  string url = 2;
  string title = 3;
  google.protobuf.Struct provider_metadata = 4;
}

message SourceDocument {
  string source_id = 1;
  string media_type = 2;
  string title = 3;
  string filename = 4;
  google.protobuf.Struct provider_metadata = 5;
}

message File {
  string url = 1;
  string media_type = 2;
  google.protobuf.Struct provider_metadata = 3;
}

// ─── Custom data part ───────────────────────────────────────

// A custom UI part. Emitted on the wire as `data-<name>`. When
// `id` is set, repeated events with the same `name` + `id`
// REPLACE the data part on the client — used for streaming
// artifacts and other in-place updates. When `transient` is true,
// the client fires its `onData` callback but does NOT persist the
// chunk to message state.
//
// Artifacts use this with `name = "artifact"` and stable per-
// artifact `id`; the server-side accumulator builds growing
// snapshots inside `data`.
message DataPart {
  // The Vercel data type suffix; the SSE translator emits the
  // wire `type` as `"data-" + name`. Must be non-empty.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Optional. Stable replace-on-update key.
  string id = 2;

  // The payload. Carried as structured data so `protojson` emits
  // a native JSON object on the wire.
  google.protobuf.Struct data = 3;

  // True to skip persistence on the client (fire `onData` only).
  bool transient = 4;
}
