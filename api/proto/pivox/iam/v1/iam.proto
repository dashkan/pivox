syntax = "proto3";

package pivox.iam.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "pivox/iam/v1/accounts.proto";
import "pivox/iam/v1/groups.proto";
import "pivox/iam/v1/permissions.proto";
import "pivox/iam/v1/roles.proto";
import "pivox/iam/v1/users.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/iam/v1;iampb";

// Iam hosts cross-resource IAM operations:
//
//   - read paths for `User`, `Role`, and `Permission`
//   - full CRUD for `Group` and group membership
//   - the global user lifecycle LRO (`DeleteUser`)
//
// Org and space-scoped IAM operations live on their respective
// services:
//
//   - org-scoped Member CRUD + `TransferOwnership` + permission tests
//     on `Organizations`
//   - space-scoped Member CRUD + permission tests on `Spaces`
//
// `Member`, `Permission`, and the `TestIamPermissions{Request,Response}`
// messages defined in this package are shared by those services.
//
// Resource definitions live in their per-resource files (`users.proto`,
// `roles.proto`, `groups.proto`, `permissions.proto`, `members.proto`).
// This file contains only the service contract.
//
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: Permission is a global, code-defined
//     catalog consumed via ListPermissions only; per-permission Get
//     carries no additional information beyond what the catalog
//     already exposes. --)
// (-- api-linter: core::0121::resource-must-support-list=disabled
//     aip.dev/not-precedent: Account is a singleton ("accounts/me");
//     GetAccount is the whoami, but listing isn't meaningful — there
//     is only one account from the caller's perspective. --)
service Iam {
  option (google.api.default_host) = "api.pivox.io";

  // Gets a user by resource name. Users are synced from Keycloak
  // and are read-only through this API.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "users.read";
  }

  // Lists users in an organization.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/users"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "users.read";
  }

  // Removes a user from an organization. Sync hard-delete: drops
  // the user's `org_members`, `space_members` (for spaces in this
  // org), and `group_members` (for groups in this org) rows. The
  // user's Pivox account (`identities` row), Keycloak identity,
  // content they own (audit-column references survive), and
  // memberships in other orgs are untouched. Use `DeleteAccount`
  // for full account deletion.
  //
  // Why sync, not LRO: this is a tiny pointer-row removal. Recovery
  // from a mistake is just re-running `Iam.CreateMember` to re-add
  // the user — their content is preserved because everything is
  // keyed on `identities.id`. The org/space-delete LRO+grace
  // pattern is reserved for ops where the cascade is destructive and
  // unrecoverable without a grace window.
  //
  // Sole-owner blocking: if removing this user would leave the org
  // with zero owners (counting both user and active-group owners),
  // returns FAILED_PRECONDITION. Resolve via
  // `Organizations.TransferOwnership` first.
  //
  // The {user} segment is `identities.id`. The literal `me`
  // is not a valid {user} segment; v1 has no self-leave-org.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/users/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "users.delete";
  }

  // Lists the active organizations the authenticated caller has
  // membership in. Slim, caller-scoped view — (slug, display_name,
  // role) — distinct from `Organizations.ListOrganizations`, which
  // returns the full Organization resource and is reserved for the
  // admin/undelete UX. Used by the post-sign-in bootstrap to detect
  // the zero-membership state and by the in-app org picker.
  //
  // Soft-deleted orgs are excluded — those surface only through
  // `Organizations.ListOrganizations` (which the undelete UX needs).
  //
  // On the membership-exempt list, like
  // `Organizations.ListOrganizations`: this RPC IS the bootstrap
  // membership query, so gating it on membership would be
  // chicken-and-egg. Authn still runs; the result only ever surfaces
  // the caller's own memberships, so there is no over-disclosure
  // vector beyond what authentication already grants.
  // (-- api-linter: core::0127::http-template-pattern=disabled
  //     aip.dev/not-precedent: Only support listing the caller's
  //     own account organizations; `accounts/me` is the only valid
  //     parent since there is no other account a caller can
  //     address. Parallels the same disable on DeleteAccount. --)
  rpc ListAccountOrganizations(ListAccountOrganizationsRequest) returns (ListAccountOrganizationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=accounts/me}/organizations"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.exempt) = true;
  }

  // Gets the authenticated caller's account (whoami). Returns the
  // caller's identity as carried on the verified access token
  // (subject, email, display_name) plus the single organization the
  // token is scoped to (`active_organization`), derived from the
  // token's `organization` claim and resolved against the caller's
  // own memberships so its `role` matches what
  // `ListAccountOrganizations` reports for that org.
  //
  // `active_organization` is unset when the token carries no
  // `organization` claim (the non-MCP web/electron tokens, where the
  // claim is gated behind the `organization` scope) or when the
  // claimed org is not one the caller is an active member of.
  //
  // On the membership-exempt list, like `ListAccountOrganizations`
  // and `DeleteAccount`: whoami targets `accounts/me`, the caller's
  // own account, with no org scope. A memberless caller (mid-bootstrap)
  // must be able to learn who they are; gating this on membership
  // would be chicken-and-egg. Authn still runs; the result only ever
  // surfaces the caller's own identity, so there is no over-disclosure
  // vector beyond what authentication already grants.
  // (-- api-linter: core::0127::http-template-pattern=disabled
  //     aip.dev/not-precedent: Only support getting the caller's own
  //     account; `accounts/me` is the only valid name since there is
  //     no other account a caller can address. Parallels the same
  //     disable on DeleteAccount. --)
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1/{name=accounts/me}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.exempt) = true;
  }

  // Deletes the authenticated caller's Pivox account (LRO). Cascades
  // through Pivox-side state across every org the caller is in and
  // soft-deletes their identity row. Cross-org by design — this is
  // the only Pivox RPC that legitimately reaches across orgs. The
  // Keycloak realm user is deleted out-of-band.
  //
  // Why Pivox-owned: the sole-owner precondition must be validated
  // server-side before any deletion, so Pivox is the entry point.
  // Removal of the Keycloak realm user is a separate, out-of-band
  // step.
  //
  // Sole-owner blocking: if the caller is the sole owner of any
  // active org, the LRO completes with FAILED_PRECONDITION listing
  // them. Resolve via `Organizations.TransferOwnership` or
  // `Organizations.DeleteOrganization` on each.
  //
  // No permission annotation: on the membership-exempt list, like
  // CreateOrganization, so memberless callers (stuck in a
  // half-bootstrapped state) can still delete their account.
  // (-- api-linter: core::0127::http-template-pattern=disabled
  //     aip.dev/not-precedent: Only support deleting own account. --)
  // (-- api-linter: core::0156::forbidden-methods=disabled
  //     aip.dev/not-precedent: Only support deleting own account. --)
  rpc DeleteAccount(DeleteAccountRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=accounts/me}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "DeleteAccountMetadata"
    };
    option (pivox.permission.v1.exempt) = true;
  }

  // Gets a role by resource name. v1 returns only system roles
  // (owner, admin, editor, viewer); custom roles are deferred.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/roles/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "roles.read";
  }

  // Lists roles in an organization.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/roles"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "roles.read";
  }

  // Lists all system-defined permissions. Permissions are global and
  // code-defined; the catalog is identical for every caller.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/permissions"};
    option (pivox.permission.v1.exempt) = true;
  }

  // Gets a group by resource name.
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/groups/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "groups.read";
  }

  // Lists groups in an organization.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/groups"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "groups.read";
  }

  // Creates a new group.
  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/groups"
      body: "group"
    };
    option (google.api.method_signature) = "parent,group,group_id";
    option (pivox.permission.v1.required_permission) = "groups.create";
  }

  // Updates a group.
  rpc UpdateGroup(UpdateGroupRequest) returns (Group) {
    option (google.api.http) = {
      patch: "/v1/{group.name=organizations/*/groups/*}"
      body: "group"
    };
    option (google.api.method_signature) = "group,update_mask";
    option (pivox.permission.v1.required_permission) = "groups.update";
    option (pivox.permission.v1.scope_field) = "group.name";
  }

  // Soft-deletes a group.
  rpc DeleteGroup(DeleteGroupRequest) returns (Group) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/groups/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "groups.delete";
  }

  // Adds members to a group.
  rpc AddGroupMembers(AddGroupMembersRequest) returns (AddGroupMembersResponse) {
    option (google.api.http) = {
      post: "/v1/{group=organizations/*/groups/*}:addGroupMembers"
      body: "*"
    };
    option (google.api.method_signature) = "group,members";
    option (pivox.permission.v1.required_permission) = "groups.manageMembers";
    option (pivox.permission.v1.scope_field) = "group";
  }

  // Removes members from a group.
  rpc RemoveGroupMembers(RemoveGroupMembersRequest) returns (RemoveGroupMembersResponse) {
    option (google.api.http) = {
      post: "/v1/{group=organizations/*/groups/*}:removeGroupMembers"
      body: "*"
    };
    option (google.api.method_signature) = "group,members";
    option (pivox.permission.v1.required_permission) = "groups.manageMembers";
    option (pivox.permission.v1.scope_field) = "group";
  }

  // Lists members of a group.
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {
    option (google.api.http) = {get: "/v1/{group=organizations/*/groups/*}/members"};
    option (google.api.method_signature) = "group";
    option (pivox.permission.v1.required_permission) = "groups.read";
    option (pivox.permission.v1.scope_field) = "group";
  }
}
