syntax = "proto3";

package pivox.iam.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "pivox/iam/v1/groups.proto";
import "pivox/iam/v1/members.proto";
import "pivox/iam/v1/permissions.proto";
import "pivox/iam/v1/roles.proto";
import "pivox/iam/v1/users.proto";
import "pivox/permission/v1/options.proto";

option go_package = "pivox/iam/v1;iampb";

// Iam hosts cross-resource IAM operations:
//
//   - read paths for `User`, `Role`, and `Permission`
//   - full CRUD for `Group` and group membership
//   - the global user lifecycle LRO (`DeleteUser`)
//
// Org and space-scoped IAM operations live on their respective
// services:
//
//   - org-scoped Member CRUD + `TransferOwnership` + permission tests
//     on `Organizations`
//   - space-scoped Member CRUD + permission tests on `Spaces`
//
// `Member`, `Permission`, and the `TestIamPermissions{Request,Response}`
// messages defined in this package are shared by those services.
//
// Resource definitions live in their per-resource files (`users.proto`,
// `roles.proto`, `groups.proto`, `permissions.proto`, `members.proto`).
// This file contains only the service contract.
//
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: Permission is a global, code-defined
//     catalog consumed via ListPermissions only; per-permission Get
//     carries no additional information beyond what the catalog
//     already exposes. --)
service Iam {
  option (google.api.default_host) = "api.pivox.io";

  // Gets a user by resource name. Users are synced from Firebase Auth
  // and are read-only through this API.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/users/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "users.read";
  }

  // Lists users in an organization.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/users"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "users.read";
  }

  // Deletes a user (LRO). Cascades through Pivox-side state and
  // finishes by deleting the underlying Firebase Auth identity.
  // Self-delete: address `organizations/{org}/users/me`.
  //
  // Sole-owner blocking: if the caller owns any active org with no
  // other owners, the LRO completes with FAILED_PRECONDITION listing
  // affected orgs. Resolve via `Organizations.TransferOwnership` or
  // `Organizations.DeleteOrganization` first.
  rpc DeleteUser(DeleteUserRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/users/*}"};
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "google.protobuf.Empty"
      metadata_type: "DeleteUserMetadata"
    };
    // users.deleteSelf is the entry-level perm so any role can delete
    // themselves (target = "me"). The handler bumps to users.delete
    // when the target is a different user — that's the owner-only
    // destructive verb against arbitrary users. Two-tier because the
    // proto annotation system is one-perm-per-method; the looser
    // permission goes here, the stricter check is in-handler.
    option (pivox.permission.v1.required_permission) = "users.deleteSelf";
  }

  // Gets a role by resource name. v1 returns only system roles
  // (owner, admin, editor, viewer); custom roles are deferred.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/roles/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "roles.read";
  }

  // Lists roles in an organization.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/roles"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "roles.read";
  }

  // Lists all system-defined permissions. Permissions are global and
  // code-defined; the catalog is identical for every caller.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/permissions"};
    option (pivox.permission.v1.exempt) = true;
  }

  // Gets a group by resource name.
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/groups/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "groups.read";
  }

  // Lists groups in an organization.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/groups"};
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "groups.read";
  }

  // Creates a new group.
  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/groups"
      body: "group"
    };
    option (google.api.method_signature) = "parent,group,group_id";
    option (pivox.permission.v1.required_permission) = "groups.create";
  }

  // Updates a group.
  rpc UpdateGroup(UpdateGroupRequest) returns (Group) {
    option (google.api.http) = {
      patch: "/v1/{group.name=organizations/*/groups/*}"
      body: "group"
    };
    option (google.api.method_signature) = "group,update_mask";
    option (pivox.permission.v1.required_permission) = "groups.update";
    option (pivox.permission.v1.scope_field) = "group.name";
  }

  // Soft-deletes a group.
  rpc DeleteGroup(DeleteGroupRequest) returns (Group) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/groups/*}"};
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "groups.delete";
  }

  // Adds members to a group.
  rpc AddGroupMembers(AddGroupMembersRequest) returns (AddGroupMembersResponse) {
    option (google.api.http) = {
      post: "/v1/{group=organizations/*/groups/*}:addGroupMembers"
      body: "*"
    };
    option (google.api.method_signature) = "group,members";
    option (pivox.permission.v1.required_permission) = "groups.manageMembers";
    option (pivox.permission.v1.scope_field) = "group";
  }

  // Removes members from a group.
  rpc RemoveGroupMembers(RemoveGroupMembersRequest) returns (RemoveGroupMembersResponse) {
    option (google.api.http) = {
      post: "/v1/{group=organizations/*/groups/*}:removeGroupMembers"
      body: "*"
    };
    option (google.api.method_signature) = "group,members";
    option (pivox.permission.v1.required_permission) = "groups.manageMembers";
    option (pivox.permission.v1.scope_field) = "group";
  }

  // Lists members of a group.
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {
    option (google.api.http) = {get: "/v1/{group=organizations/*/groups/*}/members"};
    option (google.api.method_signature) = "group";
    option (pivox.permission.v1.required_permission) = "groups.read";
    option (pivox.permission.v1.scope_field) = "group";
  }
}
