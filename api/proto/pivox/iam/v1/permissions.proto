syntax = "proto3";

package pivox.iam.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option go_package = "pivox/iam/v1;iampb";

// A system-defined permission that can be assigned to roles. Permissions
// are global (no parent resource) and code-defined; they are exposed
// read-only via `Iam.ListPermissions`.
message Permission {
  option (google.api.resource) = {
    type: "pivox.iam/Permission"
    pattern: "permissions/{permission}"
    plural: "permissions"
    singular: "permission"
  };

  // The resource name of the permission.
  // Format: `permissions/{permission}` (e.g. `permissions/spaces.create`)
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A human-readable name for the permission.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // A description of what the permission allows.
  string description = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `Iam.ListPermissions`.
// (-- api-linter: core::0132::request-parent-required=disabled
//     aip.dev/not-precedent: Permissions are global, not scoped to a parent. --)
// (-- api-linter: core::0132::request-required-fields=disabled
//     aip.dev/not-precedent: Permissions are global, not scoped to a parent. --)
message ListPermissionsRequest {
  // Optional. Maximum number of permissions to return.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous ListPermissions call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `Iam.ListPermissions`.
// (-- api-linter: core::0132::response-unknown-fields=disabled
//     aip.dev/not-precedent: Permission is a lightweight message, not a full resource. --)
message ListPermissionsResponse {
  // The available permissions.
  repeated Permission permissions = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// Request message for `Iam.TestIamPermissions`.
//
// Used by clients (notably UI layers) to ask the server: "out of this
// list of permissions, which ones does the caller actually have on
// this resource?" The server resolves the caller's effective role at
// the resource and returns the subset of requested permissions that
// role grants.
message TestIamPermissionsRequest {
  // Required. The resource to test permissions on. Typically an
  // organization or space:
  //   `organizations/{organization}`
  //   `organizations/{organization}/spaces/{space}`
  string resource = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // Required. The permissions to check. Each entry is a permission ID
  // (e.g. `spaces.create`, `assets.assets.list`). Wildcards are not
  // supported.
  repeated string permissions = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
      items: {
        string: {min_len: 1}
      }
    }
  ];
}

// Response message for `Iam.TestIamPermissions`.
message TestIamPermissionsResponse {
  // The subset of `TestIamPermissionsRequest.permissions` that the
  // caller is allowed on the resource. Permissions not in this list
  // are denied (or unknown).
  repeated string permissions = 1;
}
