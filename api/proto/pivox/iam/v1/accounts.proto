syntax = "proto3";

package pivox.iam.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option go_package = "pivox/iam/v1;iampb";

// Account is the singleton representing the authenticated caller's
// global Pivox account, mirrored from the Keycloak identity. The
// resource exists as an addressing target for custom verbs Pivox
// legitimately owns (today: DeleteAccount; future: data export,
// account disable, etc.). Standard methods (Get, List, Update,
// Create) are intentionally NOT exposed:
//
//   - Profile fields (email, display_name, photo_url, email_verified)
//     are owned by Keycloak and synced into Pivox via the
//     KC→Kafka→Pivox identity-sync pipeline. Surfacing Get/Update
//     here would either expose stale replicas or force Pivox to
//     write through to the IdP from the server, both of which
//     violate the "Keycloak owns the account profile" rule.
//
//   - Create is implicit via Keycloak registration + the identity-
//     sync pipeline; not a public RPC.
//
// (-- api-linter: core::0121::resource-must-support-get=disabled
//     aip.dev/not-precedent: Account is a singleton mirroring the
//     Keycloak identity; profile reads come from the identity-sync
//     pipeline. Pivox only owns delete-class verbs against this
//     resource. --)
// (-- api-linter: core::0121::resource-must-support-list=disabled
//     aip.dev/not-precedent: Account is a singleton ("accounts/me");
//     listing isn't meaningful — there's only one account from the
//     caller's perspective. --)
message Account {
  option (google.api.resource) = {
    type: "pivox.iam/Account"
    pattern: "accounts/{account}"
    plural: "accounts"
    singular: "account"
  };

  // The resource name. Always `accounts/me`. The caller is implicit
  // from the authentication context — there's no other account a
  // caller can address.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
}

// Request message for `Iam.DeleteAccount`. The account being deleted
// is always the authenticated caller's account; the only valid value
// for `name` is `accounts/me`. The handler validates this literal
// to defend against a misconfigured client constructing a path
// pointing at someone else.
message DeleteAccountRequest {
  // Required. Must be `accounts/me`. The caller is implicit from
  // the authentication context.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.iam/Account"},
    (buf.validate.field).required = true
  ];
}

// A status object used as the `metadata` field for the Operation
// returned by `Iam.DeleteAccount`. Surfaces incremental progress
// through the cross-org cascade phases.
//
// Cascade phases:
//   1. VALIDATING — sole-owner check across every active org the
//      caller is in. If the caller is sole owner of one or more
//      orgs, the LRO completes with FAILED_PRECONDITION naming
//      them. The caller resolves by TransferOwnership or by
//      DeleteOrganization on each.
//   2. REVOKING_MEMBERSHIPS — drops every org_members and
//      space_members row whose principal is this identity.
//      Cross-org by design.
//   3. DELETING_PIVOX_RECORDS — soft-deletes the identities row
//      (PII blanked, is_deleted=true). The row itself is preserved
//      so audit *_by references still resolve.
//   4. COMPLETED.
//
// The Keycloak realm user is deleted out-of-band (via Keycloak's own
// account console / admin flows), so the LRO owns only the Pivox-side
// records.
message DeleteAccountMetadata {
  // Output only. The phase of the cascade currently executing.
  enum Phase {
    // Default; not used.
    PHASE_UNSPECIFIED = 0;

    // Validating preconditions (cross-org sole-owner check).
    VALIDATING = 1;

    // Removing role / group memberships across all orgs.
    REVOKING_MEMBERSHIPS = 2;

    // Soft-deleting the Pivox-side identity row (PII blanked,
    // is_deleted=true; the row is preserved for audit references).
    DELETING_PIVOX_RECORDS = 3;

    // Done.
    COMPLETED = 4;
  }

  // Output only. Current phase of the cascade.
  Phase phase = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Always `accounts/me` for the caller. Echoed back
  // for client-side correlation.
  string account = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AccountOrganization is the slim, caller-scoped projection of an
// org the authenticated caller has membership in. Intentionally NOT
// a `google.api.resource` — it's a derived view (Organization joined
// with the caller's role binding), not a durable, independently
// addressable entity. Get/Update/Delete don't apply; only the
// `ListAccountOrganizations` projection.
//
// Distinct from `pivox.api/Organization` (the full resource on
// `/v1/organizations/{org}`): the post-sign-in bootstrap and
// org-picker UIs need (slug, display_name, role) without the full
// Organization's Actor fields, etag, annotations, timestamps, and
// lifecycle state. Soft-deleted orgs are excluded from this view —
// those surface only through `Organizations.ListOrganizations` for
// the undelete UX.
message AccountOrganization {
  // The canonical Organization this view derives from.
  // Format: `organizations/{organization}`.
  string organization = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "pivox.api/Organization"}
  ];

  // Human-readable organization name shown in pickers.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Caller's effective role on this org. One of `owner`, `admin`,
  // `editor`, `viewer` — the v1 system roles. When the caller has
  // both a direct binding and group-mediated bindings on the same
  // org, the highest-precedence role wins
  // (owner > admin > editor > viewer). Bindings to non-system roles
  // are excluded from this view in v1.
  string role = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `Iam.ListAccountOrganizations`.
//
// Intentionally unpaginated. AIP-158 requires `page_size` /
// `page_token`; this endpoint omits them because a single account's
// org-membership list is small (1–10 typical, capped at 1000 by the
// underlying query). Pagination would be busywork for clients on
// every cold load and gives no realistic benefit.
//
// (-- api-linter: core::0158::request-page-size-field=disabled
//     aip.dev/not-precedent: caller's org membership is small and
//     bounded; pagination would be ceremony, not value. --)
// (-- api-linter: core::0158::request-page-token-field=disabled
//     aip.dev/not-precedent: see above; we don't paginate this
//     bootstrap endpoint. --)
message ListAccountOrganizationsRequest {
  // Required. The parent. Must be `accounts/me`. The caller is
  // implicit from the authentication context.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.iam/Account"},
    (buf.validate.field).required = true
  ];
}

// Response message for `Iam.ListAccountOrganizations`.
//
// Intentionally omits `next_page_token` — the request is unpaginated;
// see `ListAccountOrganizationsRequest` for the rationale.
//
// (-- api-linter: core::0158::response-next-page-token-field=disabled
//     aip.dev/not-precedent: request is unpaginated; no token to
//     return. --)
message ListAccountOrganizationsResponse {
  // The active organizations the caller has membership in. Field
  // name matches the lowercase-plural of the message being listed
  // (`AccountOrganization` → `account_organizations`) per AIP-132,
  // even though `AccountOrganization` is not a `google.api.resource`.
  repeated AccountOrganization account_organizations = 1;
}
