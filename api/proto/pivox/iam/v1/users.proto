syntax = "proto3";

package pivox.iam.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "pivox/iam/v1;iampb";

// A user within an organization. Users are synced from Keycloak and
// are read-only via `Iam.GetUser` / `Iam.ListUsers`.
message User {
  option (google.api.resource) = {
    type: "pivox.iam/User"
    pattern: "organizations/{organization}/users/{user}"
    plural: "users"
    singular: "user"
  };

  // The resource name of the user.
  // Format: `organizations/{organization}/users/{user}`
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The user's email address.
  string email = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the user's email address has been verified.
  bool email_verified = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The user's display name.
  string display_name = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The URL of the user's profile photo.
  string photo_url = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Whether the user account is disabled.
  bool disabled = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the user was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp when the user was last modified.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Timestamp of the user's last login.
  google.protobuf.Timestamp last_login_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. A checksum computed by the server based on the current value
  // of the User resource.
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for `Iam.GetUser`.
message GetUserRequest {
  // Required. The resource name of the user to retrieve.
  // Format: `organizations/{organization}/users/{user}`
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.iam/User"},
    (buf.validate.field).required = true
  ];
}

// Request message for `Iam.ListUsers`.
message ListUsersRequest {
  // Required. The parent organization.
  // Format: `organizations/{organization}`
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.iam/User"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of users to return.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. Page token from a previous ListUsers call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An expression for filtering the results of the request.
  // Filter rules are case insensitive. Filterable fields:
  //
  // + `email`
  // + `displayName`
  //
  // Examples:
  //
  // + `email = "alice@example.com"` — exact match on email.
  // + `displayName = "Alice"` — exact match on display name.
  //
  // For more information, see [AIP-160](https://aip.dev/160).
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by. The default
  // order is ascending. Use "desc" after a field name for descending.
  // Supported fields:
  //
  // + `email`
  // + `displayName`
  // + `createTime`
  //
  // Example: `createTime desc, email`
  //
  // If not specified, the results are ordered by `createTime` ascending.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for `Iam.ListUsers`.
message ListUsersResponse {
  // The users in the organization.
  repeated User users = 1;

  // Token for the next page of results.
  string next_page_token = 2;
}

// Request message for `Iam.DeleteUser`.
//
// Org-scoped removal: removes a user FROM a single org. The user's
// Pivox account itself is unaffected; their memberships in OTHER
// orgs are unaffected; their Keycloak identity is unaffected.
// Use `Iam.DeleteAccount` for global account deletion.
//
// Sole-owner blocking: if removing this user from this org would
// leave the org with zero owners, the LRO completes with
// `FAILED_PRECONDITION`. Resolve via `TransferOwnership` first
// (promote another member to owner) before retrying.
//
// Self-target rejection: paths of the form
// `organizations/{org}/users/me` are NOT supported on this RPC.
// `me` does not parse as a UUID and surfaces InvalidArgument. v1
// has no self-leave-org capability — see roadmap for the open
// product question (SSO vs non-SSO orgs need different policies).
//
// Cascade order inside the LRO (all bounded to the path's org):
//   1. Validate org-local sole-owner constraint.
//   2. Delete this user's org-level Member bindings in this org.
//   3. Delete this user's space-level Member bindings in spaces of this org.
//   4. Delete this user's group memberships in groups of this org.
//   5. Soft-delete the per-org users row (30-day grace + purge_time).
message DeleteUserRequest {
  // Required. The user to delete. Format:
  // `organizations/{organization}/users/{user}` where {user} is a
  // UUID. The literal `me` is rejected.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.iam/User"},
    (buf.validate.field).required = true
  ];

  // Optional. Etag of the user for optimistic concurrency.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// `DeleteUserMetadata` was retired post-Phase-7 along with the
// org-scoped DeleteUser LRO orchestration. DeleteUser is now a sync
// hard-delete returning google.protobuf.Empty; there's no
// phase-progression metadata to surface. The wire-message namespace
// stays free for a future re-introduction if a workflow ever
// requires it.
