syntax = "proto3";

package pivox.secrets.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pivox/permission/v1/options.proto";
import "pivox/types/actor.proto";

option go_package = "pivox/secrets/v1;secretsv1";

// Secrets is the encrypted credential vault. A Secret holds a single
// opaque, write-only value — a shared/reusable credential such as a
// connector's DB URI, API token, or a JSON blob — encrypted at rest with
// the platform Encryptor and bound (via AAD) to the Secret's identity so a
// stored ciphertext cannot be replayed against a different Secret.
//
// The value is NEVER returned; callers rotate it by overwriting. Secrets
// are referenced by connector instances (and, later, workflow activities)
// by resource name; use is gated by Pivox IAM.
service Secrets {
  option (google.api.default_host) = "api.pivox.io";

  // Lists Secrets under a parent. The value is never included.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (google.api.http) = {
      get: "/v1/{parent=organizations/*}/secrets"
      additional_bindings: {get: "/v1/{parent=organizations/*/spaces/*}/secrets"}
    };
    option (google.api.method_signature) = "parent";
    option (pivox.permission.v1.required_permission) = "secrets.read";
  }

  // Retrieves a Secret's metadata. The value is never included.
  rpc GetSecret(GetSecretRequest) returns (Secret) {
    option (google.api.http) = {
      get: "/v1/{name=organizations/*/secrets/*}"
      additional_bindings: {get: "/v1/{name=organizations/*/spaces/*/secrets/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "secrets.read";
  }

  // Creates a new Secret. The value is required and is encrypted at rest.
  rpc CreateSecret(CreateSecretRequest) returns (Secret) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/secrets"
      body: "secret"
      additional_bindings: {
        post: "/v1/{parent=organizations/*/spaces/*}/secrets"
        body: "secret"
      }
    };
    option (google.api.method_signature) = "parent,secret,secret_id";
    option (pivox.permission.v1.required_permission) = "secrets.create";
  }

  // Updates a Secret. Rotate the value by naming it in the update mask with
  // a new non-empty value; omit it from the mask to change only metadata.
  rpc UpdateSecret(UpdateSecretRequest) returns (Secret) {
    option (google.api.http) = {
      patch: "/v1/{secret.name=organizations/*/secrets/*}"
      body: "secret"
      additional_bindings: {
        patch: "/v1/{secret.name=organizations/*/spaces/*/secrets/*}"
        body: "secret"
      }
    };
    option (google.api.method_signature) = "secret,update_mask";
    option (pivox.permission.v1.required_permission) = "secrets.update";
    option (pivox.permission.v1.scope_field) = "secret.name";
  }

  // Deletes a Secret. Returns FAILED_PRECONDITION if any connector still
  // references it — remove the references first. There is no cascade.
  rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/{name=organizations/*/secrets/*}"
      additional_bindings: {delete: "/v1/{name=organizations/*/spaces/*/secrets/*}"}
    };
    option (google.api.method_signature) = "name";
    option (pivox.permission.v1.required_permission) = "secrets.delete";
  }
}

// A Secret is one encrypted, write-only credential in the vault.
message Secret {
  option (google.api.resource) = {
    type: "pivox.secrets/Secret"
    pattern: "organizations/{organization}/secrets/{secret}"
    pattern: "organizations/{organization}/spaces/{space}/secrets/{secret}"
    plural: "secrets"
    singular: "secret"
  };

  // Immutable. The resource name for a Secret, in the format
  // `organizations/{organization}/secrets/{secret}` or
  // `organizations/{organization}/spaces/{space}/secrets/{secret}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Optional. Human-readable name. Must not exceed 256 characters.
  string display_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.max_len = 256
  ];

  // Input only. The opaque secret value, encrypted at rest and NEVER
  // returned in any response. Required (non-empty) on create. On update it
  // is written only when `value` is named in the update mask, and must be
  // non-empty then — an empty value in scope is rejected (INVALID_ARGUMENT).
  // A Secret always holds a value: rotate by sending a new one, and remove
  // by deleting the Secret; there is no empty/unset state. Store multi-field
  // credentials (e.g. AWS access+secret keys) as a JSON blob the consuming
  // connector parses — the vault treats the value as opaque.
  bytes value = 3 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).bytes.max_len = 65536
  ];

  // Output only. The identity that created this secret.
  pivox.types.Actor created_by = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Creation time.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The identity that last rotated or modified this secret.
  pivox.types.Actor updated_by = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Last update (or rotation) time.
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. Entity tag for optimistic concurrency. Always set in server
  // responses; pass it back on update/delete to guard against a lost write.
  string etag = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Labels for organizing and filtering secrets.
  map<string, string> annotations = 9 [(google.api.field_behavior) = OPTIONAL];
}

// The request message for listing Secrets under a parent.
message ListSecretsRequest {
  // Required. The parent, of the form `organizations/{organization}` or
  // `organizations/{organization}/spaces/{space}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.secrets/Secret"},
    (buf.validate.field).required = true
  ];

  // Optional. Maximum number of Secrets to return. Server caps at 1000;
  // defaults to 100 when unspecified.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Optional. A pagination token from a previous ListSecrets call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. An AIP-160 filter expression. Filterable fields:
  //
  // + `displayName`
  //
  // For more information, see [AIP-160](https://aip.dev/160).
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A comma-separated list of fields to order by (append " desc"
  // for descending). Supported: `displayName`, `createTime`. Defaults to
  // `displayName` ascending.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];
}

// The response message for ListSecrets.
message ListSecretsResponse {
  // The Secrets under the requested parent (values omitted).
  repeated Secret secrets = 1;

  // A pagination token for the next page, empty if there are no more.
  string next_page_token = 2;
}

// The request message for getting a Secret.
message GetSecretRequest {
  // Required. The Secret resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.secrets/Secret"},
    (buf.validate.field).required = true
  ];
}

// The request message for creating a Secret.
message CreateSecretRequest {
  // Required. The parent, of the form `organizations/{organization}` or
  // `organizations/{organization}/spaces/{space}`.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "pivox.secrets/Secret"},
    (buf.validate.field).required = true
  ];

  // Required. The Secret to create. Its `value` is required here and is
  // encrypted at rest.
  Secret secret = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Required. The user-assigned id for the Secret, unique within the parent.
  string secret_id = 3 [(google.api.field_behavior) = REQUIRED];

  // Optional. If true, validate the request but do not create the Secret.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The request message for updating a Secret.
message UpdateSecretRequest {
  // Required. The new state of the Secret. To rotate the value, name `value`
  // in the update mask with a new non-empty value; an empty value in scope
  // is rejected. To change only metadata, omit `value` from the mask and the
  // stored value is untouched. If `etag` is set it must match the stored
  // etag or `ABORTED` is returned.
  Secret secret = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Optional. Fields to update (`display_name`, `value`, `annotations`,
  // `etag`). If omitted, all provided fields are significant.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true and the Secret does not exist, create it (update_mask
  // is then ignored).
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. If true, validate the request but do not update the Secret.
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// The request message for deleting a Secret.
message DeleteSecretRequest {
  // Required. The Secret resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "pivox.secrets/Secret"},
    (buf.validate.field).required = true
  ];

  // Optional. If true, validate the request but do not delete the Secret.
  bool validate_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The etag the client expects; used for optimistic concurrency.
  string etag = 3 [(google.api.field_behavior) = OPTIONAL];
}
