<!doctype html>
<html>
  <head>
    <title>Pivox API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <!-- Scalar API Reference, from the jsDelivr CDN (needs internet at page load). -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

    <script>
      // Derive the OAuth endpoints from this page's own origin, so "Authorize"
      // always targets the Keycloak fronting whatever host is serving the docs.
      // Overrides the spec's placeholder authorizationUrl/tokenUrl.
      const kcOidc = `${window.location.origin}/realms/pivox/protocol/openid-connect`;
      Scalar.createApiReference('#app', {
        url: '/api-docs/pivox.yaml',
        // Pre-fill the public "api-docs" Keycloak client (realm pivox) so the
        // OAuth2 panel is one-click. x-usePkce 'SHA-256' marks it a public
        // client (no secret sent). The redirect URI defaults to this page's own
        // URL — register that in Keycloak (e.g. https://<this-host>/api-docs).
        authentication: {
          preferredSecurityScheme: 'OAuth2',
          securitySchemes: {
            OAuth2: {
              flows: {
                authorizationCode: {
                  authorizationUrl: `${kcOidc}/auth`,
                  tokenUrl: `${kcOidc}/token`,
                  'x-scalar-client-id': 'api-docs',
                  selectedScopes: ['openid', 'profile', 'email'],
                  'x-usePkce': 'SHA-256',
                },
              },
            },
          },
        },
      })
    </script>
  </body>
</html>
