        - AiChat
    patch:
      summary: Updates a conversation's mutable fields.
      operationId: AiChat_UpdateConversation
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Conversation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: user
          in: path
          required: true
          type: string
        - name: conversation
          in: path
          required: true
          type: string
        - name: conversation
          description: Required. The conversation to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              creator:
                type: string
                title: |-
                  Output only. Path-style creator reference, denormalized from the
                  resource path. Kept alongside `created_by` for clients that
                  resolve the user via routing rather than the structured Actor.
                  Format: `organizations/{organization}/users/{user}`
                readOnly: true
              title:
                type: string
                description: |-
                  The conversation title. May be set by the user or auto-generated.

                  A title supplied at `CreateConversation` time does NOT mark the
                  conversation as user-titled (`title_user_set` stays false), so
                  the auto-summarization path is free to overwrite it once the
                  first turn lands. Only an explicit `UpdateConversation` whose
                  update mask covers `title` flips `title_user_set` to true and
                  makes the title sticky against future `:summarize` calls.
              titleUserSet:
                type: boolean
                description: |-
                  Output only. Whether the user has set the title via an explicit
                  `UpdateConversation` call (mask covering `title`) — as opposed
                  to a heuristic stub from `CreateConversation` or a server-side
                  summary from `:summarize`. Used to suppress regeneration:
                  re-running `:summarize` on a conversation whose title the user
                  has already curated would overwrite their work.
                readOnly: true
              description:
                type: string
                description: An optional description of the conversation.
              archived:
                type: boolean
                description: Whether the conversation is archived.
              pinned:
                type: boolean
                description: Whether the conversation is pinned.
              messageCount:
                type: integer
                format: int32
                description: Output only. The number of messages in the conversation.
                readOnly: true
              lastMessageTime:
                type: string
                format: date-time
                description: Output only. The time of the last message in the conversation.
                readOnly: true
              createdBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that created this conversation.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Output only. When the conversation was created.
                readOnly: true
              updatedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that last modified this conversation.
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Output only. When the conversation was last updated.
                readOnly: true
              etag:
                type: string
                description: |-
                  Output only. A checksum computed by the server based on the current value
                  of the Conversation resource.
                readOnly: true
            title: Required. The conversation to update.
      tags:
        - AiChat
