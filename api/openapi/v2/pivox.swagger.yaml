          format: int32
        - name: pageToken
          description: Optional. Page token from a previous ListMembers call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Optional. An expression for filtering the results of the request.
            Filterable fields:

            + `role` — exact match on a role resource name.
            + `principal_kind` — `user` or `group`.

            For more information, see [AIP-160](https://aip.dev/160).
          in: query
          required: false
          type: string
        - name: orderBy
          description: |-
            Optional. A comma-separated list of fields to order by. Supported
            fields: `createTime`, `role`. Default: `createTime` ascending.
          in: query
          required: false
          type: string
      tags:
        - Organizations
    post:
      summary: |-
        Creates an org-scope Member binding. The principal (user or group)
        must already exist in the organization. The role must be one of
        the system roles (`owner`, `admin`, `editor`, `viewer`).
      operationId: Organizations_CreateMember
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Member'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: member
          description: |-
            Required. The Member to create. The `principal` oneof must be set
            and `role` must reference an existing system role.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Member'
        - name: memberId
          description: |-
            Optional. A client-specified member ID. If provided, must be
            `user-{user_id}` or `group-{group_id}` and must agree with the
            `principal` oneof. If omitted, the server derives it from
            `member.principal`.
          in: query
          required: false
          type: string
      tags:
        - Organizations
