        - Organizations
  /v1/organizations/{organization}/invitations:
    get:
      summary: Lists invitations for the organization.
      operationId: Organizations_ListInvitations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListInvitationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. Maximum number of invitations to return.
          in: query
