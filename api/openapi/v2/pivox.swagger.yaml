            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
      tags:
        - Organizations
    patch:
      summary: Updates the invitation policy for an organization.
      operationId: Organizations_UpdateInvitationPolicy
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1InvitationPolicy'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: invitationPolicy
          description: Required. The invitation policy with updated fields.
          in: body
          required: true
          schema:
            type: object
            properties:
              disablePublicEmailAddresses:
                type: boolean
                description: |-
                  Optional. When true, invitations to public email addresses (gmail.com,
                  yahoo.com, etc.) are rejected. The server maintains the list of
                  public email domains.
              allowedDomains:
                type: array
                items:
                  type: string
                description: |-
                  Optional. If non-empty, only email addresses from these domains are
                  allowed. This is the strictest check and takes precedence over other
                  settings.
              disallowedDomains:
                type: array
                items:
                  type: string
                description: |-
                  Optional. Email addresses from these domains are always rejected,
                  even if they pass other checks.
              updateTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the policy was last modified.
                readOnly: true
              etag:
                type: string
                description: Output only. A checksum for optimistic concurrency control.
                readOnly: true
