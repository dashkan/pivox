      operationId: Assets_UpdateAsset
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: space
          in: path
          required: true
          type: string
        - name: asset
          in: path
          required: true
          type: string
        - name: asset
          description: Required. The asset with updated fields.
          in: body
          required: true
          schema:
            type: object
            properties:
              displayName:
                type: string
                description: Required. A human-readable name for the asset.
              state:
                $ref: '#/definitions/v1AssetState'
                description: Output only. The current lifecycle state.
                readOnly: true
              mediaType:
                $ref: '#/definitions/AssetMediaType'
                description: |-
                  Output only. The broad media category, derived from the content
                  type during ingestion.
                readOnly: true
              contentType:
                type: string
                description: |-
                  Output only. The content type of the original file (e.g.
                  `image/jpeg`, `video/mp4`). Determined from magic bytes during
                  ingestion, not from the file extension.
                readOnly: true
              filename:
                type: string
                description: |-
                  Output only. The original filename as provided by the client at
                  upload time.
                readOnly: true
              importPath:
                type: string
                description: |-
                  Output only. The original filesystem path when this asset was created
                  via ImportAssets. Read-only historical label — not a folder, not
                  editable. Empty for directly uploaded assets.
                readOnly: true
              endpoint:
                type: string
                title: |-
                  Output only. The storage endpoint where the asset's files are stored.
                  Format: `organizations/{organization}/storageGateways/{gateway}/endpoints/{endpoint}`
                readOnly: true
              checksumSha256:
                type: string
                description: |-
                  Output only. SHA-256 checksum of the original file. Used for
                  deduplication — if a file with the same checksum already exists
                  in the space, the existing asset is returned instead of creating
                  a duplicate.
                readOnly: true
              sizeBytes:
                type: string
                format: int64
                description: Output only. Size of the original file in bytes.
                readOnly: true
              latestVersion:
                $ref: '#/definitions/v1AssetVersion'
                description: Output only. The latest version of the asset.
                readOnly: true
              versionCount:
                type: integer
                format: int32
                description: Output only. Total number of versions.
                readOnly: true
              ttl:
                type: string
                description: |-
                  Input only. The time-to-live for the asset, as an alternative to
                  setting expire_time directly. The server computes expire_time from
                  create_time + ttl.
              duration:
                type: string
                description: Output only. Duration of the media, for video and audio assets.
                readOnly: true
              width:
                type: integer
                format: int32
                description: Output only. Width in pixels, for image and video assets.
                readOnly: true
              height:
                type: integer
                format: int32
                description: Output only. Height in pixels, for image and video assets.
                readOnly: true
              expireTime:
                type: string
                format: date-time
                description: |-
                  Optional. The time at which this asset should expire. When set,
                  a background reaper will soft-delete the asset after this time.
                  Can be set directly or via a retention policy (tag-based rules).
              annotations:
                type: object
                additionalProperties:
                  type: string
                description: Optional. Annotations associated with this asset.
              etag:
                type: string
                description: |-
                  Output only. A checksum computed by the server based on the current
                  value of the Asset resource.
                readOnly: true
              createdBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that created this asset.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the asset was created.
                readOnly: true
              updatedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that last modified this asset.
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the asset was last modified.
                readOnly: true
              deletedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that requested deletion of this asset.
                readOnly: true
              deleteTime:
                type: string
                format: date-time
                description: Output only. The time at which the asset was soft-deleted.
                readOnly: true
              purgeTime:
                type: string
                format: date-time
                description: Output only. The time at which the asset will be permanently purged.
                readOnly: true
            title: Required. The asset with updated fields.
            required:
              - displayName
        - name: validateOnly
          description: Optional. If set to true, validate only without persisting.
          in: query
          required: false
          type: boolean
      tags:
        - Assets
