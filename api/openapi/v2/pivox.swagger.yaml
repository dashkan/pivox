swagger: "2.0"
info:
  title: Pivox API
  description: |
    Pivox Cloud Controller — gRPC + REST surface for organizations,
    spaces, IAM, assets, storage, and AI chat.
  version: "1.0"
tags:
  - name: AgentService
  - name: AiChat
  - name: ApiKeys
  - name: Dashboards
  - name: Organizations
  - name: Spaces
  - name: TagBindings
  - name: TagKeys
  - name: TagValues
  - name: Watcher
  - name: Assets
  - name: Requests
  - name: Iam
  - name: Agents
  - name: Endpoints
  - name: StorageGateways
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/accounts/me:
    delete:
      summary: |-
        Deletes the authenticated caller's Pivox account (LRO). Cascades
        through Pivox-side state across every org the caller is in, then
        deletes the underlying Firebase Auth identity. Cross-org by
        design — this is the only Pivox RPC that legitimately reaches
        across orgs.
      description: |-
        Why Pivox-owned: Firebase Auth has no blocking pre-delete
        trigger, so server-side validation (sole-owner check) requires
        Pivox to be the entry point. The webhook for direct-Console
        bypass is a separate fallback path.

        Sole-owner blocking: if the caller is the sole owner of any
        active org, the LRO completes with FAILED_PRECONDITION listing
        them. Resolve via `Organizations.TransferOwnership` or
        `Organizations.DeleteOrganization` on each.

        No permission annotation: on the membership-exempt list, like
        CreateOrganization, so memberless callers (stuck in a
        half-bootstrapped state) can still delete their account.
      operationId: Iam_DeleteAccount
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: name
          description: |-
            Required. Must be `accounts/me`. The caller is implicit from
            the authentication context.
          in: path
          required: true
          type: string
      tags:
        - Iam
  /v1/accounts/me/organizations:
    get:
      summary: |-
        Lists the active organizations the authenticated caller has
        membership in. Slim, caller-scoped view — (slug, display_name,
        role) — distinct from `Organizations.ListOrganizations`, which
        returns the full Organization resource and is reserved for the
        admin/undelete UX. Used by the post-sign-in bootstrap to detect
        the zero-membership state and by the in-app org picker.
      description: |-
        Soft-deleted orgs are excluded — those surface only through
        `Organizations.ListOrganizations` (which the undelete UX needs).

        On the membership-exempt list, like
        `Organizations.ListOrganizations`: this RPC IS the bootstrap
        membership query, so gating it on membership would be
        chicken-and-egg. Authn still runs; the result only ever surfaces
        the caller's own memberships, so there is no over-disclosure
        vector beyond what authentication already grants.
      operationId: Iam_ListAccountOrganizations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAccountOrganizationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: parent
          description: |-
            Required. The parent. Must be `accounts/me`. The caller is
            implicit from the authentication context.
          in: path
          required: true
          type: string
      tags:
        - Iam
  /v1/keys:lookupKey:
    get:
      summary: |-
        Find the parent organization and resource name of the API
        key that matches the key string in the request. If the API key has been
        purged, resource name will not be set.
        The service account must have the `apikeys.keys.lookup` permission
        on the parent organization.
      operationId: ApiKeys_LookupKey
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1LookupKeyResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: keyString
          description: Required. Finds the organization that owns the key string value.
          in: query
          required: true
          type: string
      tags:
        - ApiKeys
  /v1/organizations:
    get:
      summary: |-
        Lists organization resources that are visible to the user and satisfy
        the specified filter.
      description: |-
        This will only return organizations on which the user has the permission
        `resourcemanager.organizations.get`
      operationId: Organizations_ListOrganizations
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListOrganizationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: |-
            Optional. The maximum number of organizations to return in the response.
            The server can return fewer organizations than requested. If unspecified,
            server picks an appropriate default.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: |-
            Optional. A pagination token returned from a previous call to
            `ListOrganizations` that indicates from where listing should continue.
          in: query
          required: false
          type: string
        - name: showDeleted
          description: |-
            Optional. Controls whether organizations in the DELETE_REQUESTED state
            should be returned. Defaults to false.
          in: query
          required: false
          type: boolean
        - name: filter
          description: |-
            Optional. An expression for filtering the results of the request.
            Filter rules are case insensitive. Filterable fields:

            + `displayName`
            + `state`
            + `createTime` (supports comparison operators)

            Examples:

            + `displayName = "Acme Corp"` — exact match on display name.
            + `state = ACTIVE` — only active organizations.
            + `createTime > "2025-01-01T00:00:00Z"` — created after date.

            For more information, see [AIP-160](https://aip.dev/160).
          in: query
          required: false
          type: string
        - name: orderBy
          description: |-
            Optional. A comma-separated list of fields to order by. The default
            order is ascending. Use "desc" after a field name for descending.
            Supported fields:

            + `displayName`
            + `createTime`
            + `name`

            Example: `createTime desc, displayName`

            If not specified, the results are ordered by `name` ascending.
          in: query
          required: false
          type: string
      tags:
        - Organizations
    post:
      summary: Creates a new organization resource.
      description: The caller must have `resourcemanager.organizations.create` permission.
      operationId: Organizations_CreateOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          description: Required. The Organization to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Organization'
        - name: organizationId
          description: |-
            Optional. A unique identifier for the organization. If not provided, the
            server will generate one. Must start with a letter, contain only lowercase
            letters, digits, and hyphens, and be between 4 and 20 characters long.
          in: query
          required: false
          type: string
        - name: validateOnly
          description: |-
            Optional. If set to true, the request will only validate the request
            without persisting it.
          in: query
          required: false
          type: boolean
      tags:
        - Organizations
  /v1/organizations/{organization}:
    get:
      summary: Fetches an organization resource identified by the specified resource name.
      operationId: Organizations_GetOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Organization'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
      tags:
        - Organizations
    delete:
      summary: |-
        Soft-deletes an organization. The org transitions to
        `DELETE_REQUESTED` state with `delete_time` set; `purge_time` is
        populated to `delete_time + 30 days`. Until purge, the org is
        recoverable via `UndeleteOrganization` and remains visible to
        `ListOrganizations` callers who pass `show_deleted=true`. After
        purge, all data cascades and the slug is freed.
      description: |-
        If `force=true`, the 30-day grace window is skipped: the LRO
        synchronously cascades all child data and frees the slug.
        The org is unrecoverable.

        The caller must hold the `owner` role on the organization;
        otherwise the LRO completes with PERMISSION_DENIED. The LRO
        surfaces cascade progress via `DeleteOrganizationMetadata.Phase`.
      operationId: Organizations_DeleteOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: etag
          description: |-
            Optional. The etag known to the client for the expected state of
            the organization. Used for optimistic concurrency control.
          in: query
          required: false
          type: string
        - name: force
          description: |-
            Optional. If true, bypasses the 30-day grace window: the LRO
            synchronously cascades all child data (spaces, members, assets,
            SSO config, invitations, …) and frees the slug. The org is
            unrecoverable. Defaults to false (soft-delete with grace).
          in: query
          required: false
          type: boolean
      tags:
        - Organizations
    patch:
      summary: |-
        Updates an organization resource. Only the `display_name` and
        `annotations` fields can be updated. Use the field mask to specify which
        fields to update. Omitting the field mask updates all mutable fields.
      description: |-
        The caller must have `resourcemanager.organizations.update` permission
        on the specified organization.
      operationId: Organizations_UpdateOrganization
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: organization
          description: |-
            Required. The new definition of the organization. The `name` field must
            be populated to identify the organization to update.
          in: body
          required: true
          schema:
            type: object
            properties:
              displayName:
                type: string
                description: |-
                  Output only. A human-readable string that refers to the organization in the
                  Pivox Console. This string is set by the server and cannot be
                  changed. The string will be set to the primary domain (for example,
                  "acme.com") of the customer that owns the organization.
                readOnly: true
              state:
                $ref: '#/definitions/v1OrganizationState'
                description: Output only. The organization's current lifecycle state.
                readOnly: true
              createdBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that created this organization.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the Organization was created.
                readOnly: true
              updatedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that last modified this organization.
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the Organization was last modified.
                readOnly: true
              deletedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that requested deletion of this organization.
                readOnly: true
              deleteTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the Organization was requested for deletion.
                readOnly: true
              purgeTime:
                type: string
                format: date-time
                description: |-
                  Output only. The time at which this organization will be purged.
                  Approximately 30 days after deletion.
                readOnly: true
              etag:
                type: string
                description: |-
                  Output only. A checksum computed by the server based on the current value
                  of the Organization resource. This may be sent on update and delete
                  requests to ensure the client has an up-to-date value before proceeding.
                readOnly: true
              annotations:
                type: object
                additionalProperties:
                  type: string
                description: |-
                  Optional. Labels associated with this organization.
                  Labels are key-value pairs that can be used to organize and track resources.
            description: |-
              Required. The new definition of the organization. The `name` field must
              be populated to identify the organization to update.
        - name: validateOnly
          description: |-
            Optional. If set to true, the request will only validate the request
            without persisting it.
          in: query
          required: false
          type: boolean
      tags:
        - Organizations
  /v1/organizations/{organization}/dashboards:
    get:
      summary: |-
        Lists dashboards under a parent. The parent may be an organization
        (returns the system-curated catalog) or a space (returns
        user-managed dashboards).
      description: |-
        The `dashboards.read` permission gates the verb regardless of
        parent scope; the membership interceptor ahead of it enforces
        org-membership at org parent and space-membership at space parent.
      operationId: Dashboards_ListDashboards
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDashboardsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. Maximum number of dashboards to return.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Optional. Page token from a previous ListDashboards call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Optional. An expression for filtering the results of the request.
            Filter rules are case insensitive. Filterable fields:

            + `displayName`
            + `createTime` (supports comparison operators)

            Examples:

            + `displayName = "Overview"` — exact match on display name.
            + `createTime > "2025-01-01T00:00:00Z"` — created after date.

            For more information, see [AIP-160](https://aip.dev/160).
          in: query
          required: false
          type: string
        - name: orderBy
          description: |-
            Optional. A comma-separated list of fields to order by. The default
            order is ascending. Use "desc" after a field name for descending.
            Supported fields:

            + `displayName`
            + `createTime`

            Example: `createTime desc, displayName`

            If not specified, the results are ordered by `createTime` descending.
          in: query
          required: false
          type: string
      tags:
        - Dashboards
  /v1/organizations/{organization}/dashboards/{dashboard}:
    get:
      summary: Retrieves a dashboard by name.
      operationId: Dashboards_GetDashboard
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Dashboard'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: dashboard
          in: path
          required: true
          type: string
      tags:
        - Dashboards
  /v1/organizations/{organization}/domains:
    get:
      summary: |-
        Lists the domains claimed by an organization, including those
        still pending verification.
      operationId: Organizations_ListDomains
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListDomainsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. Maximum number of domains to return.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Optional. Page token from a previous ListDomains call.
          in: query
          required: false
          type: string
      tags:
        - Organizations
    post:
      summary: |-
        Claims a DNS domain on behalf of the organization. The server
        generates a verification token (returned in the LRO metadata),
        creates a `Domain` row with `state=PENDING`, and starts polling
        DNS for the TXT record at `_pivox-verify.<domain>`. The LRO
        completes when the record is observed (state → VERIFIED) or
        when the grace window elapses (state → FAILED, phase=EXPIRED).
      description: |-
        The verification token lives in the LRO metadata and is
        available immediately on operation creation — clients display
        DNS-record instructions without waiting for the LRO to finish.

        The caller must hold a role on the organization that grants
        `resourcemanager.domains.create`. Returns ALREADY_EXISTS if the
        domain is already claimed by any organization (the response
        does not disclose which org).
      operationId: Organizations_CreateDomain
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: domain
          description: |-
            Required. The Domain to create. The `domain` field must be set;
            all other fields are output-only.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Domain'
        - name: domainId
          description: |-
            Optional. The id portion of the resource name. If unset, the
            server uses the lowercase form of `domain.domain`. If set, must
            equal that value (provided for AIP-133 compliance and idempotent
            retries).
          in: query
          required: false
          type: string
      tags:
        - Organizations
  /v1/organizations/{organization}/domains/{domain}:
    get:
      summary: Fetches a single domain by resource name.
      operationId: Organizations_GetDomain
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Domain'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: domain
          in: path
          required: true
          type: string
      tags:
        - Organizations
    delete:
      summary: |-
        Releases a domain claim. Cancels the in-flight `CreateDomain`
        LRO if still running. Returns FAILED_PRECONDITION if the
        domain is the last `VERIFIED` domain on an `enabled=true`
        SsoConfig (admins must disable SSO or add another verified
        domain first).
      operationId: Organizations_DeleteDomain
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Domain'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: domain
          in: path
          required: true
          type: string
        - name: etag
          description: |-
            Optional. The etag known to the client. Used for optimistic
            concurrency control.
          in: query
          required: false
          type: string
      tags:
        - Organizations
  /v1/organizations/{organization}/effectiveTags:
    get:
      summary: |-
        Return a list of effective tags for the given Pivox resource, as
        specified in `parent`.
      operationId: TagBindings_ListEffectiveTags
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListEffectiveTagsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: |-
            Optional. The maximum number of effective tags to return in the response.
            The server allows a maximum of 300 effective tags to return in a single
            page. If unspecified, the server will use 100 as the default.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: |-
            Optional. A pagination token returned from a previous call to
            `ListEffectiveTags` that indicates from where this listing should continue.
          in: query
          required: false
          type: string
      tags:
        - TagBindings
  /v1/organizations/{organization}/groups:
    get:
      summary: Lists groups in an organization.
      operationId: Iam_ListGroups
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListGroupsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. Maximum number of groups to return.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Optional. Page token from a previous ListGroups call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Optional. An expression for filtering the results of the request.
            Filter rules are case insensitive. Filterable fields:

            + `state`
            + `displayName`
            + `createTime` (supports comparison operators)

            Examples:

            + `displayName = "Engineering"` — exact match on display name.
            + `state = ACTIVE` — only active groups.
            + `createTime > "2025-01-01T00:00:00Z"` — created after date.

            For more information, see [AIP-160](https://aip.dev/160).
          in: query
          required: false
          type: string
        - name: orderBy
          description: |-
            Optional. A comma-separated list of fields to order by. The default
            order is ascending. Use "desc" after a field name for descending.
            Supported fields:

            + `displayName`
            + `createTime`

            Example: `createTime desc, displayName`

            If not specified, the results are ordered by `displayName` ascending.
          in: query
          required: false
          type: string
        - name: showDeleted
          description: Optional. Whether to include soft-deleted groups.
          in: query
          required: false
          type: boolean
      tags:
        - Iam
    post:
      summary: Creates a new group.
      operationId: Iam_CreateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: group
          description: Required. The group to create.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Group'
        - name: groupId
          description: |-
            Optional. The server-generated group ID. If not provided, the server
            will generate one.
          in: query
          required: false
          type: string
      tags:
        - Iam
  /v1/organizations/{organization}/groups/{group}:
    get:
      summary: Gets a group by resource name.
      operationId: Iam_GetGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: group
          in: path
          required: true
          type: string
      tags:
        - Iam
    delete:
      summary: Soft-deletes a group.
      operationId: Iam_DeleteGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: group
          in: path
          required: true
          type: string
        - name: etag
          description: Optional. The etag for optimistic concurrency control.
          in: query
          required: false
          type: string
      tags:
        - Iam
    patch:
      summary: Updates a group.
      operationId: Iam_UpdateGroup
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Group'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: group
          in: path
          required: true
          type: string
        - name: group
          description: Required. The group with updated fields.
          in: body
          required: true
          schema:
            type: object
            properties:
              displayName:
                type: string
                description: Required. A human-readable name for the group.
              description:
                type: string
                description: Optional. A longer description of the group's purpose.
              createTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the group was created.
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the group was last modified.
                readOnly: true
              deleteTime:
                type: string
                format: date-time
                description: Output only. Timestamp when the group was soft-deleted.
