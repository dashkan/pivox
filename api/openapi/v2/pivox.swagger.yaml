      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: space
          in: path
          required: true
          type: string
        - name: asset
          in: path
          required: true
          type: string
        - name: etag
          description: Optional. The etag for optimistic concurrency.
          in: query
          required: false
          type: string
        - name: force
          description: Optional. If true, delete the asset even if it has versions.
          in: query
          required: false
          type: boolean
        - name: validateOnly
          description: Optional. If set to true, validate only without persisting.
