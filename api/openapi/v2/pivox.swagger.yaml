  v1RenditionType:
    type: string
    enum:
      - TYPE_UNSPECIFIED
      - THUMBNAIL_SMALL
      - THUMBNAIL_MEDIUM
      - THUMBNAIL_LARGE
      - ANIMATED_PREVIEW
      - VIDEO_PROXY
      - AUDIO_PREVIEW
      - POSTER_FRAME
    default: TYPE_UNSPECIFIED
    description: |-
      The type of rendition.

       - TYPE_UNSPECIFIED: Unspecified rendition type.
       - THUMBNAIL_SMALL: Small thumbnail (e.g. 150x150).
       - THUMBNAIL_MEDIUM: Medium thumbnail (e.g. 400x400).
       - THUMBNAIL_LARGE: Large thumbnail (e.g. 800x800).
       - ANIMATED_PREVIEW: Animated preview for video (short WebP/GIF loop).
       - VIDEO_PROXY: Video proxy for web playback (H.264 720p).
       - AUDIO_PREVIEW: Audio preview (MP3, short clip or full).
       - POSTER_FRAME: Poster frame extracted from video.
  v1Request:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the request. Format:
          `organizations/{organization}/spaces/{space}/requests/{request}`
        readOnly: true
      displayName:
        type: string
        description: Required. A human-readable title for the request.
      description:
        type: string
        description: Optional. A detailed description of what is needed.
      state:
        $ref: '#/definitions/v1RequestState'
        description: Output only. The current lifecycle state.
        readOnly: true
      priority:
        $ref: '#/definitions/RequestPriority'
        description: Optional. The priority of the request.
      assignee:
        type: string
        title: 'Optional. The assigned artist. Format: `users/{user}`'
      dueTime:
        type: string
        format: date-time
        description: Optional. The requested deadline.
      deliveredTime:
        type: string
        format: date-time
        description: Output only. When the artist marked the request as delivered.
        readOnly: true
      approvedTime:
        type: string
        format: date-time
        description: Output only. When the producer approved the request.
        readOnly: true
      lineItemCount:
        type: integer
        format: int32
        description: Output only. Total number of line items.
        readOnly: true
      fulfilledCount:
        type: integer
        format: int32
        description: Output only. Number of line items with fulfilled (ACTIVE) assets.
        readOnly: true
      lineItems:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1LineItem'
        description: |-
          Output only. Line items belonging to this request. Populated on
          GetRequest. Not populated on ListRequests for efficiency.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Annotations associated with this request.
      etag:
        type: string
        description: Output only. A checksum computed by the server.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created the request.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the request was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified the request.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the request was last modified.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: Output only. The time at which the request was soft-deleted.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: Output only. The time at which the request will be permanently purged.
        readOnly: true
    description: |-
      A request represents an order for one or more assets. Producers
      create requests, assign artists, and approve deliverables. Each
      request contains line items that map to individual PLACEHOLDER
      assets.
    required:
      - displayName
  v1RequestState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - DRAFT
      - OPEN
      - IN_PROGRESS
      - DELIVERED
      - APPROVED
      - REVISION_REQUESTED
      - REJECTED
      - CANCELLED
    default: STATE_UNSPECIFIED
    description: |-
      Request lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state.
       - DRAFT: Producer is composing the request. Not visible to artists.
       - OPEN: Submitted and awaiting artist assignment or self-claim.
       - IN_PROGRESS: An artist is actively working on the request.
       - DELIVERED: The artist has delivered all line items for review.
       - APPROVED: The producer has approved the deliverables.
       - REVISION_REQUESTED: The producer has requested changes. The artist picks it up
      and the request moves back to IN_PROGRESS.
       - REJECTED: The producer has rejected the deliverables.
       - CANCELLED: The request was cancelled.
  v1ResourceQuery:
    type: object
    properties:
      resourceType:
        type: string
        description: |-
          Required. The fully-qualified Pivox resource type to query
          (e.g. "pivox.api/Proxy").
      filter:
        type: string
        description: Optional. An AIP-160 filter expression applied to the resources.
      aggregation:
        $ref: '#/definitions/v1Aggregation'
        description: Optional. The aggregation function to apply.
      aggregationField:
        type: string
        description: |-
          Optional. The field to aggregate on. Required when aggregation is
          SUM, AVG, MIN, or MAX.
      groupingFields:
        type: array
        items:
          type: string
        description: Optional. Fields to group results on.
      timeRange:
        $ref: '#/definitions/v1TimeRange'
        description: Optional. The time range for the query.
      timeGranularity:
        type: string
        description: Optional. The granularity for time-series bucketing.
      orderBy:
        type: string
        description: Optional. An ordering expression (e.g. "create_time desc").
      limit:
        type: integer
        format: int32
        description: Optional. Maximum number of results to return.
    description: |-
      ResourceQuery describes a query against Pivox resources. It is a declarative
      DSL stored in the dashboard configuration; a future QueryDashboardData RPC
      will resolve it server-side.
    required:
      - resourceType
  v1Restrictions:
    type: object
    properties:
      browserKeyRestrictions:
        $ref: '#/definitions/v1BrowserKeyRestrictions'
        description: The HTTP referrers (websites) that are allowed to use the key.
      serverKeyRestrictions:
        $ref: '#/definitions/v1ServerKeyRestrictions'
        description: The IP addresses of callers that are allowed to use the key.
      androidKeyRestrictions:
        $ref: '#/definitions/v1AndroidKeyRestrictions'
        description: The Android apps that are allowed to use the key.
      iosKeyRestrictions:
        $ref: '#/definitions/v1IosKeyRestrictions'
        description: The iOS apps that are allowed to use the key.
      apiTargets:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ApiTarget'
        description: |-
          Optional. A restriction for a specific service and optionally one or
          more specific methods. Requests are allowed if they
          match any of these restrictions. If no restrictions are
          specified, all targets are allowed.
    description: Describes the restrictions on the key.
  v1Role:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the role.
          Format: `organizations/{organization}/roles/{role}`
      displayName:
        type: string
        description: Required. A human-readable name for the role.
      description:
        type: string
        description: Optional. A longer description of the role's purpose.
      permissions:
        type: array
        items:
          type: string
        description: |-
          Output only. The permissions granted by this role, resolved from the
          role_permissions join table.
        readOnly: true
      system:
        type: boolean
        description: |-
          Output only. Whether this is a system-defined role (owner, admin, editor,
          viewer). System roles cannot be deleted or have their permissions changed.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the role was created.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the role was last modified.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the role was soft-deleted.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the role will be permanently purged.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Role resource.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Free-form annotations for the role.
    description: |-
      A role within an organization. Roles can be system-defined (owner, admin,
      editor, viewer) or custom. System roles are seeded per-org at creation time.

      Read-only via `Iam.GetRole` / `Iam.ListRoles` in v1; custom-role CRUD is
      deferred until a real customer use case materializes.
    required:
      - displayName
  v1RowAction:
    type: object
    properties:
      key:
        type: string
        description: |-
          Required. Well-known action key. Maps client-side to the actual
          behavior. Examples: "open_detail", "share", "archive", "delete".

          The pattern constraint keeps keys safe to use as renderer
          dispatch-table keys and prevents typos like "Open Detail" leaking
          into wire data.
      label:
        type: string
        description: Optional. The display label shown in menus / buttons.
      icon:
        $ref: '#/definitions/v1Icon'
        description: Optional. Cross-platform semantic icon for this action.
      requiresConfirmation:
        type: boolean
        description: |-
          Optional. If true, the renderer presents a confirmation prompt
          before executing this action.
    description: |-
      RowAction describes an action exposed on each row of a
      CollectionWidget. The `key` is a well-known string the renderer
      maps to a platform UI behavior (e.g. "open_detail" → push detail
      sheet, "share" → present share dialog). The renderer owns the
      dispatch table; the server only declares which actions are
      available.
    required:
      - key
  v1S3AccessKeyCredentials:
    type: object
    properties:
      accessKeyId:
        type: string
        description: Required. The access key ID.
      secretAccessKey:
        type: string
        description: Required. The secret access key.
    description: Static access key credentials for an S3-compatible backend.
    required:
      - accessKeyId
      - secretAccessKey
  v1S3Config:
    type: object
    properties:
      endpointUri:
        type: string
        description: |-
          Required. Immutable. The URI of the S3-compatible endpoint
          (e.g. `http://localhost:9000` or `https://s3.us-east-1.amazonaws.com`).
      bucket:
        type: string
        description: Required. Immutable. The bucket name on the storage backend.
      region:
        type: string
        description: Optional. The cloud region of the storage backend (e.g. `us-east-1`).
      accessKey:
        $ref: '#/definitions/v1S3AccessKeyCredentials'
        description: Static access key credentials.
    description: Configuration for an S3-compatible storage backend.
    required:
      - endpointUri
      - bucket
  v1SamlConfig:
    type: object
    properties:
      idpEntityId:
        type: string
        description: |-
          Required. The IDP entity ID. Found in the IDP's SAML metadata
          under the root `EntityDescriptor[entityID]` attribute.
      ssoUrl:
        type: string
        description: |-
          Required. The IDP's single-sign-on URL. Found in the IDP's SAML
          metadata under `SingleSignOnService[Binding=HTTP-POST].Location`.
      x509Certificates:
        type: array
        items:
          type: string
        description: |-
          Required. PEM-encoded X.509 certificates the IDP uses to sign
          SAML responses. At least one is required; multiple may be
          provided during cert rotation.
      requestSigningEnabled:
        type: boolean
        description: |-
          Optional. Whether the IDP requires the SP (Pivox/Firebase) to
          sign AuthnRequests. Set this to match the IDP's
          `WantAuthnRequestsSigned` metadata flag.
      rpEntityId:
        type: string
        description: |-
          Output only. The relying-party entity ID Pivox uses with this
          IDP. Server-derived from the org's resource name; configure your
          IDP to expect this value.
        readOnly: true
      callbackUrl:
        type: string
        description: |-
          Output only. The Pivox/Firebase callback URL (ACS endpoint) the
          IDP should redirect to after authentication. Server-derived from
          the Firebase Auth project's hosted handler.
        readOnly: true
    description: |-
      SAML provider configuration. Maps onto Firebase Admin SDK's
      `SAMLProviderConfig` shape — server reads these fields and calls
      `CreateSAMLProviderConfig` / `UpdateSAMLProviderConfig` against
      Firebase Auth on Update.

      `rp_entity_id` and `callback_url` are output-only — the server
      derives them from the org's resource name and Firebase Auth's
      hosted callback endpoint, respectively.
    required:
      - idpEntityId
      - ssoUrl
      - x509Certificates
  v1SectionHeader:
    type: object
    properties:
      subtitle:
        type: string
        description: Optional. A subtitle displayed below the widget title.
      dividerBelow:
        type: boolean
        description: Optional. Whether to render a divider line below the header.
    description: SectionHeader is a visual separator for organizing dashboard sections.
  v1ServerEvent:
    type: object
    properties:
      start:
        $ref: '#/definitions/v1Start'
        description: |-
          ─── Lifecycle ──────────────────────────────────────────
          The assistant turn has started. Emitted before any text/
          tool/reasoning events for the turn.
      startStep:
        $ref: '#/definitions/v1StartStep'
        description: A multi-step turn just rolled into a new model call.
      finishStep:
        $ref: '#/definitions/v1FinishStep'
        description: |-
          The step (one model call) is over. Followed by either a
          subsequent `start_step` (tool loop continues) or `finish`.
      finish:
        $ref: '#/definitions/v1Finish'
        description: The assistant turn is complete. Terminal.
      abort:
        $ref: '#/definitions/v1Abort'
        description: The stream was cancelled. Terminal.
      error:
        $ref: '#/definitions/v1Error'
        description: A stream-level error. Terminal.
      messageMetadata:
        $ref: '#/definitions/v1MessageMetadata'
        description: |-
          Free-form metadata about the assistant message. Emitted
          anytime — typically once at end-of-turn carrying final usage.
      textStart:
        $ref: '#/definitions/v1TextStart'
        title: ─── Text ───────────────────────────────────────────────
      textDelta:
        $ref: '#/definitions/v1TextDelta'
      textEnd:
        $ref: '#/definitions/v1TextEnd'
      reasoningStart:
        $ref: '#/definitions/v1ReasoningStart'
        title: ─── Reasoning ──────────────────────────────────────────
      reasoningDelta:
        $ref: '#/definitions/v1ReasoningDelta'
      reasoningEnd:
        $ref: '#/definitions/v1ReasoningEnd'
      toolInputStart:
        $ref: '#/definitions/v1ToolInputStart'
        title: ─── Tool input ─────────────────────────────────────────
      toolInputDelta:
        $ref: '#/definitions/v1ToolInputDelta'
      toolInputAvailable:
        $ref: '#/definitions/v1ToolInputAvailable'
      toolInputError:
        $ref: '#/definitions/v1ToolInputError'
      toolApprovalRequest:
        $ref: '#/definitions/v1ToolApprovalRequest'
      toolOutputAvailable:
        $ref: '#/definitions/v1ToolOutputAvailable'
        title: ─── Tool output ────────────────────────────────────────
      toolOutputError:
        $ref: '#/definitions/v1ToolOutputError'
      toolOutputDenied:
        $ref: '#/definitions/v1ToolOutputDenied'
      sourceUrl:
        $ref: '#/definitions/v1SourceUrl'
        title: ─── Sources & files ────────────────────────────────────
      sourceDocument:
        $ref: '#/definitions/v1SourceDocument'
      file:
        $ref: '#/definitions/v1File'
      data:
        $ref: '#/definitions/v1DataPart'
        description: |-
          ─── Custom data parts ──────────────────────────────────
          Emitted as Vercel chunk type `data-<name>`. Repeated events
          with the same `name` + `id` REPLACE the prior data on the
          client. Used for artifacts (name="artifact"), progress
          (name="progress"), and any future custom UI part.
    description: |-
      One emission on the streaming wire. Each variant maps 1:1 to a
      Vercel AI SDK UIMessageChunk; the SSE translator strips this
      oneof wrapper and injects the `"type"` discriminator.

      Field names on the inner messages are chosen so `protojson` emits
      the exact Vercel JSON without translator field renaming.

      Variants are grouped (lifecycle 1-7, text 10-12, reasoning 13-15,
      tool 20-27, source/file 30-32, data 40) with gaps so additions
      don't churn the field-number namespace.
  v1ServerKeyRestrictions:
    type: object
    properties:
      allowedIps:
        type: array
        items:
          type: string
        description: |-
          Optional. A list of the caller IP addresses that are allowed to make API calls
          with this key.
    description: The IP addresses of callers that are allowed to use the key.
  v1SourceDocument:
    type: object
    properties:
      sourceId:
        type: string
      mediaType:
        type: string
      title:
        type: string
      filename:
        type: string
      providerMetadata:
        type: object
  v1SourceUrl:
    type: object
    properties:
      sourceId:
        type: string
      url:
        type: string
      title:
        type: string
      providerMetadata:
        type: object
  v1Space:
    type: object
    properties:
      name:
        type: string
        description: |-
          Output only. The unique resource name of the space.

          Example: `organizations/123/spaces/my-space`
        readOnly: true
      displayName:
        type: string
        description: |-
          Optional. A user-assigned display name of the space.
          When present it must be between 4 to 30 characters.
          Allowed characters are: lowercase and uppercase letters, numbers,
          hyphen, single-quote, double-quote, space, and exclamation point.

          Example: `My Space`
      state:
        $ref: '#/definitions/v1SpaceState'
        description: Output only. The space lifecycle state.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this space.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Creation time.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this space.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. The most recent time this resource was modified.
        readOnly: true
      deletedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that requested deletion of this space.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: Output only. The time at which this resource was requested for deletion.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: |-
          Output only. The time at which this space will be purged.
          Approximately 30 days after deletion.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Space resource. This may be sent on update and delete requests to
          ensure the client has an up-to-date value before proceeding.
        readOnly: true
      labels:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. The labels associated with this space.

          Label keys must be between 1 and 63 characters long and must conform
          to the following regular expression: \[a-z\](\[-a-z0-9\]*\[a-z0-9\])?.

          Label values must be between 0 and 63 characters long and must conform
          to the regular expression (\[a-z\](\[-a-z0-9\]*\[a-z0-9\])?)?.

          No more than 64 labels can be associated with a given resource.

          Clients should store labels in a representation such as JSON that does not
          depend on specific characters being disallowed.

          Example: `"myBusinessDimension" : "businessValue"`
    description: |-
      A space is a high-level Pivox entity. It is a
      container for ACLs, APIs, and other Pivox resources.
  v1SpaceState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - DELETE_REQUESTED
    default: STATE_UNSPECIFIED
    description: |-
      Space lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state.  This is only used/useful for distinguishing
      unset values.
       - ACTIVE: The normal and active state.
       - DELETE_REQUESTED: The space has been marked for deletion by the user
      (by invoking
      [DeleteSpace][pivox.api.v1.Spaces.DeleteSpace])
      or by the system (Pivox).
      This can generally be reversed by invoking [UndeleteSpace]
      [pivox.api.v1.Spaces.UndeleteSpace].
  v1SpacesTestIamPermissionsBody:
    type: object
    properties:
      permissions:
        type: array
        items:
          type: string
        description: |-
          Required. The permissions to check. Each entry is a permission ID
          (e.g. `spaces.create`, `assets.assets.list`). Wildcards are not
          supported.
    description: |-
      Request message for `Iam.TestIamPermissions`.

      Used by clients (notably UI layers) to ask the server: "out of this
      list of permissions, which ones does the caller actually have on
      this resource?" The server resolves the caller's effective role at
      the resource and returns the subset of requested permissions that
      role grants.
    required:
      - permissions
  v1SsoConfig:
    type: object
    properties:
      name:
        type: string
        description: |-
          The resource name of the SsoConfig. Format:
          `organizations/{organization}/ssoConfig`.
      firebaseProviderId:
        type: string
        description: |-
          Output only. The Firebase Auth provider id. Server-managed; the
          server creates / updates the underlying Firebase provider config
          when this SsoConfig is updated. Format: `oidc.<slug>` for OIDC,
          `saml.<slug>` for SAML.
        readOnly: true
      displayName:
        type: string
        description: |-
          Required. Human-readable display name shown on the sign-in
          screen and in the Firebase console.
      enabled:
        type: boolean
        description: |-
          Optional. Whether SSO is currently active. When `false`, the
          SsoConfig remains stored but `auth:resolveProvider` returns
          NOT_FOUND for the org's domains and no Firebase provider is
          exposed.
      oidc:
        $ref: '#/definitions/v1OidcConfig'
        description: |-
          OIDC provider configuration. Set when the IDP supports OAuth
          2.0 / OpenID Connect.
      saml:
        $ref: '#/definitions/v1SamlConfig'
        description: |-
          SAML 2.0 provider configuration. Set when the IDP only speaks
          SAML.
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this SSO config.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the SsoConfig was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this SSO config.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the SsoConfig was last modified.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the
          current value of the SsoConfig resource.
        readOnly: true
    description: |-
      SsoConfig is the per-organization SSO/IDP configuration. AIP-156
      singleton sub-resource of Organization — there is at most one
      SsoConfig per org, addressable at `organizations/{org}/ssoConfig`.

      Get/Update RPCs live on the Organizations service (this is the
      resource definition and request shapes only). Phase 4 wires server-
      side encryption: client_secret travels cleartext over TLS, the
      server envelope-encrypts it via Cloud KMS before persisting.

      Domain ↔ SsoConfig linkage is implicit: any of the org's `Domain`
      resources in `state=VERIFIED` route to this SsoConfig when
      `enabled=true`. There is at most one SsoConfig per org so the
      mapping is unambiguous.
    required:
      - displayName
  v1Start:
    type: object
    properties:
      messageId:
        type: string
        description: |-
          The server-assigned ID for the assistant message produced by
          this turn. The SSE client (Vercel useChat) keys the assistant
          message off this; subsequent text/reasoning chunks reference
          it via their own `id` field.
      messageMetadata:
        $ref: '#/definitions/v1ChatMessageMetadata'
        description: |-
          Optional. Initial metadata for the assistant message — typically
          carries the persisted conversation handle when the server
          auto-created one for this turn.
  v1StartStep:
    type: object
    description: Marker — emitted before each model call in a multi-step turn.
  v1StaticData:
    type: object
    properties:
      points:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1StaticDataPoint'
        description: Optional. The data points.
    description: StaticData provides hardcoded data points for a widget.
  v1StaticDataPoint:
    type: object
    properties:
      label:
        type: string
        description: Required. The label for this data point.
      value:
        type: number
        format: double
        description: Required. The numeric value of this data point.
    description: StaticDataPoint is a single labeled numeric value.
    required:
      - label
      - value
  v1StatisticWidget:
    type: object
    properties:
      dataSource:
        $ref: '#/definitions/v1DataSource'
        description: Required. The data source for the statistic value.
      unit:
        type: string
        description: Optional. The unit label (e.g. "requests/sec", "%").
      thresholds:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Threshold'
        description: Optional. Thresholds for color-coding the value.
      sparkline:
        type: boolean
        description: Optional. Whether to show a sparkline trend below the value.
    description: StatisticWidget displays a single KPI value with optional sparkline.
    required:
      - dataSource
  v1StorageGateway:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the storage gateway. Format:
          `organizations/{organization}/storageGateways/{storage_gateway}`
        readOnly: true
      displayName:
        type: string
        description: |-
          Required. A human-readable name for the storage gateway. Must be at
          most 60 characters long.
      state:
        $ref: '#/definitions/v1StorageGatewayState'
        description: Output only. The current lifecycle state of the storage gateway.
        readOnly: true
      hostname:
        type: string
        description: |-
          Output only. The hostname assigned to this storage gateway, for example
          `{name}.storage.pivox.app`.
        readOnly: true
      ipAddresses:
        type: array
        items:
          type: string
        description: |-
          Required. The IP addresses that the storage gateway listens on.
          At least one IP address must be provided.
      registrationToken:
        type: string
        description: |-
          Output only. The registration token used to register agents with this
          storage gateway.
        readOnly: true
      targetVersion:
        type: string
        description: Optional. The desired software version for the storage gateway.
      currentVersion:
        type: string
        description: |-
          Output only. The currently running software version of the storage
          gateway.
        readOnly: true
      certificate:
        $ref: '#/definitions/StorageGatewayCertificate'
        description: Output only. The TLS certificate state for this storage gateway.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Annotations associated with this storage gateway.
          Annotations are key-value pairs that can be used to organize and track
          resources.
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the StorageGateway resource. This may be sent on update and delete
          requests to ensure the client has an up-to-date value before proceeding.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created the storage gateway.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the storage gateway was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified the storage gateway.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the storage gateway was last modified.
        readOnly: true
    description: |-
      A storage gateway deployed within an organization. Storage gateways act
      as caching proxies that accelerate access to remote storage backends.
    required:
      - displayName
      - ipAddresses
  v1StorageGatewayState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PROVISIONING
      - ACTIVE
      - DEGRADED
      - OFFLINE
    default: STATE_UNSPECIFIED
    description: |-
      Storage gateway lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state. This is only useful for distinguishing unset values.
       - PROVISIONING: The gateway is being provisioned and is not yet ready to serve traffic.
       - ACTIVE: The gateway is active and serving traffic normally.
       - DEGRADED: The gateway is operating in a degraded state. Some functionality may
      be unavailable.
       - OFFLINE: The gateway is offline and not serving traffic.
  v1TagBinding:
    type: object
    properties:
      name:
        type: string
        description: |-
          Output only. The name of the TagBinding. Format:
          `organizations/{organization}/tagBindings/{tag_binding}` or
          `organizations/{organization}/spaces/{space}/tagBindings/{tag_binding}`.
        readOnly: true
      tagValue:
        type: string
        description: |-
          Immutable. The TagValue of the TagBinding.
          Must be of the form `organizations/{org}/tagKeys/{key}/tagValues/{value}`.
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this tag binding.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Creation time.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Update time.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the tag binding resource. This may be sent on update and delete requests to
          ensure the client has an up-to-date value before proceeding.
        readOnly: true
      origin:
        $ref: '#/definitions/TagBindingOrigin'
        description: Output only. How this tag binding was created.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Labels associated with this tag binding.
          Labels are key-value pairs that can be used to organize and track resources.
    description: |-
      A TagBinding represents a connection between a TagValue and a
      resource. Once a TagBinding is created, the TagValue is applied to all the
      descendants of the Pivox resource.
  v1TagKey:
    type: object
    properties:
      name:
        type: string
        description: |-
          Immutable. The resource name for a TagKey. Must be in the format
          `organizations/{organization}/tagKeys/{tag_key}` or
          `organizations/{organization}/spaces/{space}/tagKeys/{tag_key}`.
      description:
        type: string
        description: |-
          Optional. User-assigned description of the TagKey. Must not exceed 256
          characters.

          Read-write.
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this tag key.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Creation time.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this tag key.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Update time.
        readOnly: true
      etag:
        type: string
        description: |-
          Optional. Entity tag which users can pass to prevent race conditions. This
          field is always set in server responses. See UpdateTagKeyRequest for
          details.
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Labels associated with this tag key.
          Labels are key-value pairs that can be used to organize and track resources.
    description: A TagKey, used to group a set of TagValues.
  v1TagValue:
    type: object
    properties:
      name:
        type: string
        description: |-
          Immutable. Resource name for TagValue in the format
          `organizations/{organization}/tagKeys/{tag_key}/tagValues/{tag_value}`.
      description:
        type: string
        description: |-
          Optional. User-assigned description of the TagValue.
          Must not exceed 256 characters.

          Read-write.
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this tag value.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Creation time.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this tag value.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Update time.
        readOnly: true
      etag:
        type: string
        description: |-
          Optional. Entity tag which users can pass to prevent race conditions. This
          field is always set in server responses. See UpdateTagValueRequest for
          details.
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Labels associated with this tag value.
          Labels are key-value pairs that can be used to organize and track resources.
    description: |-
      A TagValue is a child of a particular TagKey. This is used to group
      resources for the purpose of controlling them using policies.
  v1TestIamPermissionsResponse:
    type: object
    properties:
      permissions:
        type: array
        items:
          type: string
        description: |-
          The subset of `TestIamPermissionsRequest.permissions` that the
          caller is allowed on the resource. Permissions not in this list
          are denied (or unknown).
    description: Response message for `Iam.TestIamPermissions`.
  v1TextDelta:
    type: object
    properties:
      id:
        type: string
        description: Block ID matching the corresponding TextStart.
      delta:
        type: string
        description: The incremental text content for this delta.
      providerMetadata:
        type: object
        description: Optional. Provider-specific metadata.
  v1TextEnd:
    type: object
    properties:
      id:
        type: string
        description: Block ID matching the corresponding TextStart.
      providerMetadata:
        type: object
        description: Optional. Provider-specific metadata.
  v1TextStart:
    type: object
    properties:
      id:
        type: string
        description: |-
          Block ID. Wire chunk's `id` field; pairs the start/delta/end
          events of the same text block.
      providerMetadata:
        type: object
        description: |-
          Optional. Provider-specific metadata (e.g. Anthropic prompt
          caching counts, OpenAI reasoning summaries).
  v1TextWidget:
    type: object
    properties:
      content:
        type: string
        description: Required. The text content.
      format:
        $ref: '#/definitions/v1TextWidgetFormat'
        description: Optional. The text format.
    description: TextWidget displays rich text or markdown content.
    required:
      - content
  v1TextWidgetFormat:
    type: string
    enum:
      - FORMAT_UNSPECIFIED
      - MARKDOWN
      - PLAIN_TEXT
    default: FORMAT_UNSPECIFIED
    description: |-
      Text format types.

       - FORMAT_UNSPECIFIED: Unspecified; defaults to MARKDOWN.
       - MARKDOWN: Markdown-formatted text.
       - PLAIN_TEXT: Plain text.
  v1Threshold:
    type: object
    properties:
      value:
        type: number
        format: double
        description: Required. The threshold value.
      color:
        $ref: '#/definitions/typeColor'
        description: Optional. The color to use when the threshold is triggered.
      direction:
        $ref: '#/definitions/ThresholdDirection'
        description: Optional. The direction relative to the threshold value.
      label:
        type: string
        description: Optional. A human-readable label for the threshold.
    description: Threshold defines a value boundary for color-coding or reference lines.
    required:
      - value
  v1Tile:
    type: object
    properties:
      xPos:
        type: integer
        format: int32
        description: Required. The zero-indexed column position of the tile.
      yPos:
        type: integer
        format: int32
        description: Required. The zero-indexed row position of the tile.
      width:
        type: integer
        format: int32
        description: Required. The width of the tile in columns. Must be at least 1.
      height:
        type: integer
        format: int32
        description: Required. The height of the tile in rows. Must be at least 1.
      widget:
        $ref: '#/definitions/v1Widget'
        description: Required. The widget displayed in this tile.
    description: Tile represents a positioned widget within a GridLayout.
    required:
      - xPos
      - yPos
      - width
      - height
      - widget
  v1TimeRange:
    type: object
    properties:
      relative:
        $ref: '#/definitions/v1RelativeTimeRange'
        description: A relative time range (e.g. "last 24 hours").
      absolute:
        $ref: '#/definitions/v1AbsoluteTimeRange'
        description: An absolute time range with explicit start and end.
    description: TimeRange specifies the time window for a query.
  v1TokenUsage:
    type: object
    properties:
      inputTokens:
        type: integer
        format: int32
        description: Approximate input token count (prompt + history + system).
      outputTokens:
        type: integer
        format: int32
        description: Approximate output token count (the generated response).
    description: Token usage accounting for a generation.
  v1ToolApprovalRequest:
    type: object
    properties:
      approvalId:
        type: string
        description: |-
          Approval session ID; the client returns this on
          approve/deny to disambiguate concurrent approvals.
      toolCallId:
        type: string
        description: The tool call awaiting approval.
  v1ToolDefinition:
    type: object
    properties:
      tool:
        type: string
        description: Required. The tool's identifier, as the model will reference it.
      description:
        type: string
        description: Optional. A natural-language description shown to the model.
      inputSchemaJson:
        type: string
        description: |-
          Required. JSON Schema describing the tool's input arguments,
          encoded as a JSON string.
    description: |-
      A tool the model may invoke during generation. Schemas are
      expressed as JSON Schema (encoded as a JSON string) so this proto
      doesn't need to model the schema language directly.

      The identifier field is named `tool` (not `name`) to match the
      existing convention in `ToolCallPart` / `ToolResultPart` and to
      avoid AIP-122's resource-annotation expectation triggered by
      messages containing a `name` field.
    required:
      - tool
      - inputSchemaJson
  v1ToolInputAvailable:
    type: object
    properties:
      toolCallId:
        type: string
      toolName:
        type: string
      input:
        type: object
        description: |-
          The fully-parsed tool input. Carries the input as structured
          data (not a JSON-encoded string), so consumers don't double-
          parse and `protojson` emits a native JSON object on the wire.
      providerExecuted:
        type: boolean
      dynamic:
        type: boolean
      title:
        type: string
      providerMetadata:
        type: object
      toolMetadata:
        type: object
  v1ToolInputDelta:
    type: object
    properties:
      toolCallId:
        type: string
      inputTextDelta:
        type: string
        description: |-
          The raw provider-emitted input text being streamed (typically
          JSON characters that will eventually parse into the full
          `input` carried by `ToolInputAvailable`).
  v1ToolInputError:
    type: object
    properties:
      toolCallId:
        type: string
      toolName:
        type: string
      input:
        type: object
      errorText:
        type: string
        description: Human-readable description of the validation failure.
      providerExecuted:
        type: boolean
      dynamic:
        type: boolean
      title:
        type: string
      providerMetadata:
        type: object
      toolMetadata:
        type: object
    description: |-
      Tool input that failed validation (schema mismatch, missing
      required field, etc.). Distinct from `ToolOutputError`, which
      is for execution failures after the input was accepted.
  v1ToolInputStart:
    type: object
    properties:
      toolCallId:
        type: string
      toolName:
        type: string
      providerExecuted:
        type: boolean
        description: |-
          True when the upstream provider executes this tool itself
          (e.g. Anthropic web search). When true, the client should not
          attempt to run the tool locally.
      dynamic:
        type: boolean
        description: |-
          True when the tool was not statically declared in the
          request's `tools` — i.e. provider-suggested at runtime.
      title:
        type: string
        description: |-
          Optional. Display title shown to the user while the tool
          input is being streamed.
      providerMetadata:
        type: object
      toolMetadata:
        type: object
  v1ToolOutputAvailable:
    type: object
    properties:
      toolCallId:
        type: string
      output:
        type: object
        description: |-
          The tool's result, as structured data. Mirrors
          ToolInputAvailable.input on the output side.
      providerExecuted:
        type: boolean
      dynamic:
        type: boolean
      preliminary:
        type: boolean
        description: |-
          True for a partial/in-progress output (the tool will emit a
          subsequent non-preliminary output before the call closes).
      providerMetadata:
        type: object
      toolMetadata:
        type: object
  v1ToolOutputDenied:
    type: object
    properties:
      toolCallId:
        type: string
    description: |-
      The user denied the pending approval request for this tool
      call. Terminal for the call.
  v1ToolOutputError:
    type: object
    properties:
      toolCallId:
        type: string
      errorText:
        type: string
      providerExecuted:
        type: boolean
      dynamic:
        type: boolean
      providerMetadata:
        type: object
      toolMetadata:
        type: object
  v1TransferOwnershipResponse:
    type: object
    properties:
      newOwner:
        type: string
        description: |-
          The user resource that now holds the `owner` role on the
          organization. Format: `organizations/{organization}/users/{user}`.
        readOnly: true
      previousOwner:
        type: string
        description: |-
          The user resource that previously held the `owner` role and was
          demoted to `admin` as part of the transfer. Same format as
          `new_owner`.
        readOnly: true
    description: |-
      Response message for `Organizations.TransferOwnership`. Returns the
      before/after owner refs so clients can confirm the swap and
      optimistically update their UI without a follow-up read of the
      affected Member rows.
  v1User:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the user.
          Format: `organizations/{organization}/users/{user}`
      email:
        type: string
        description: Output only. The user's email address.
        readOnly: true
      emailVerified:
        type: boolean
        description: Output only. Whether the user's email address has been verified.
        readOnly: true
      displayName:
        type: string
        description: Output only. The user's display name.
        readOnly: true
      photoUrl:
        type: string
        description: Output only. The URL of the user's profile photo.
        readOnly: true
      disabled:
        type: boolean
        description: Output only. Whether the user account is disabled.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the user was created.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the user was last modified.
        readOnly: true
      lastLoginTime:
        type: string
        format: date-time
        description: Output only. Timestamp of the user's last login.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the User resource.
        readOnly: true
    description: |-
      A user within an organization. Users are synced from Firebase Auth and
      are read-only via `Iam.GetUser` / `Iam.ListUsers`.
  v1Widget:
    type: object
    properties:
      id:
        type: string
        description: Optional. Client-assigned identifier for the widget.
      title:
        type: string
        description: Optional. The display title of the widget.
      statistic:
        $ref: '#/definitions/v1StatisticWidget'
        description: A single KPI / statistic value.
      chart:
        $ref: '#/definitions/v1ChartWidget'
        description: An XY chart (line, bar, area, etc.).
      collection:
        $ref: '#/definitions/v1CollectionWidget'
        description: |-
          A collection of resources rendered in one of several display
          modes (table, card grid, …).
      pieChart:
        $ref: '#/definitions/v1PieChartWidget'
        description: A pie or donut chart.
      text:
        $ref: '#/definitions/v1TextWidget'
        description: Rich text or markdown content.
      sectionHeader:
        $ref: '#/definitions/v1SectionHeader'
        description: A visual section separator.
    description: Widget contains a single dashboard component.
