          description: Optional. Maximum number of permissions to return.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Optional. Page token from a previous ListPermissions call.
          in: query
          required: false
          type: string
      tags:
        - Iam
  /v1/watch:
    get:
      summary: Start a streaming RPC to get watch information from the server.
      operationId: Watcher_Watch
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/v1ChangeBatch'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of v1ChangeBatch
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: targets
          description: |-
            Each target value **must** be a valid URL path pointing to an entity
            to watch. At least one target is required. Note that the service name
            **must** be removed from each target (e.g., the target must say
            "/foo/bar", not "myservice.googleapis.com/foo/bar"). A client is
            also allowed to pass system-specific parameters in the URL that
            are only obeyed by some implementations. Some parameters will be
            implementation-specific. However, some have predefined meaning
            and are listed here:

            * recursive = true|false [default=false]
               If set to true, indicates that the client wants to watch all elements
               of entities in the subtree rooted at the entity's name in the target.
               For descendants that are not the immediate children of the target, the
               `Change.element` will contain slashes.

               Note that some namespaces and entities will not support recursive
               watching. When watching such an entity, a client must not set recursive
               to true. Otherwise, it will receive an `UNIMPLEMENTED` error.

            Normal URL encoding must be used inside each target. For example, if a
            query parameter name or value, or the non-query parameter portion of the
            target contains a special character, it must be %-encoded. We recommend
            that clients and servers use their runtime's URL library to produce and
            consume target values.

            At least one target is required.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: resumeMarker
          description: |-
            The `resume_marker` specifies how much of the existing underlying state is
            delivered to the client when the watch request is received by the
            system. The client can set this marker in one of the following ways to get
            different semantics:

            *   Parameter is not specified or has the value "".
                Semantics: Fetch initial state.
                The client wants the entity's initial state to be delivered. See the
                description in "Initial State".

            *   Parameter is set to the string "now" (UTF-8 encoding).
                Semantics: Fetch new changes only.
                The client just wants to get the changes received by the system after
                the watch point. The system may deliver changes from before the watch
                point as well.

            *   Parameter is set to a value received in an earlier
                `Change.resume_marker` field while watching the same entity.
                Semantics: Resume from a specific point.
                The client wants to receive the changes from a specific point; this
                value must correspond to a value received in the `Change.resume_marker`
                field. The system may deliver changes from before the `resume_marker`
                as well. If the system cannot resume the stream from this point (e.g.,
                if it is too far behind in the stream), it can raise the
                `FAILED_PRECONDITION` error.

            An implementation MUST support an unspecified parameter and the
            empty string "" marker (initial state fetching) and the "now" marker.
            It need not support resuming from a specific point.
          in: query
          required: false
          type: string
          format: byte
      tags:
        - Watcher
definitions:
  AgentsDrainAgentBody:
    type: object
    properties:
      reason:
        type: string
        description: Optional. A human-readable reason for draining the agent.
    description: |-
      The request sent to the
      [DrainAgent][pivox.storage.v1.Agents.DrainAgent] method.
  AgentsRemoveAgentBody:
    type: object
    description: |-
      The request sent to the
      [RemoveAgent][pivox.storage.v1.Agents.RemoveAgent] method.
  AiChatGenerateContentBody:
    type: object
    properties:
      conversation:
        type: string
        title: |-
          Optional. The conversation to attach this turn to. When set, the
          server hydrates history from the conversation and persists the
          new turn(s) on success. When unset, the call is stateless.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
      messages:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InputMessage'
        description: |-
          Required. The new turn(s) the caller wants the model to act on.
          For stateful calls (`conversation` set), this is typically a
          single user message. For stateless calls, this is the full
          conversation history with the final user turn at the end.
      systemInstruction:
        type: string
        description: |-
          Optional. System instruction applied to this generation. For
          stateful calls, overrides the conversation's stored system
          instruction for THIS call only. For stateless calls, this is the
          only system prompt the model sees.
      tools:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ToolDefinition'
        description: Optional. Tools the model may call during this generation.
      temperature:
        type: number
        format: float
        description: |-
          Optional. Sampling temperature. Server picks a sensible default
          when unset.
    description: |-
      Input to `GenerateContent` and `StreamGenerateContent`. Mirrors the
      shape of the Vercel AI SDK's `streamText` / `generateText` params
      and Google's `GenerateContentRequest`: a list of role-tagged
      messages (the conversation turns), an optional system instruction,
      optional tool definitions, and standard generation parameters.

      Pivox-specific: `parent` carries the org for routing, and
      `conversation` (optional) opts the call into stateful behavior —
      when set, the server prepends the conversation's stored history
      (and stored system instruction, if any) before the inline
      `messages`, and persists the resulting turn(s) on success. When
      unset, the call is fully stateless: the caller provides whatever
      history is needed inline.
    required:
      - messages
  AiChatStreamGenerateContentBody:
    type: object
    properties:
      conversation:
        type: string
        title: |-
          Optional. The conversation to attach this turn to. When set, the
          server hydrates history from the conversation and persists the
          new turn(s) on success. When unset, the call is stateless.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
      messages:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1InputMessage'
        description: |-
          Required. The new turn(s) the caller wants the model to act on.
          For stateful calls (`conversation` set), this is typically a
          single user message. For stateless calls, this is the full
          conversation history with the final user turn at the end.
      systemInstruction:
        type: string
        description: |-
          Optional. System instruction applied to this generation. For
          stateful calls, overrides the conversation's stored system
          instruction for THIS call only. For stateless calls, this is the
          only system prompt the model sees.
      tools:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ToolDefinition'
        description: Optional. Tools the model may call during this generation.
      temperature:
        type: number
        format: float
        description: |-
          Optional. Sampling temperature. Server picks a sensible default
          when unset.
    description: |-
      Input to `GenerateContent` and `StreamGenerateContent`. Mirrors the
      shape of the Vercel AI SDK's `streamText` / `generateText` params
      and Google's `GenerateContentRequest`: a list of role-tagged
      messages (the conversation turns), an optional system instruction,
      optional tool definitions, and standard generation parameters.

      Pivox-specific: `parent` carries the org for routing, and
      `conversation` (optional) opts the call into stateful behavior —
      when set, the server prepends the conversation's stored history
      (and stored system instruction, if any) before the inline
      `messages`, and persists the resulting turn(s) on success. When
      unset, the call is fully stateless: the caller provides whatever
      history is needed inline.
    required:
      - messages
  AiChatSummarizeConversationBody:
    type: object
    description: Request message for `SummarizeConversation`.
  ApiKeysUndeleteKeyBody:
    type: object
    description: Request message for `UndeleteKey` method.
  AssetMediaType:
    type: string
    enum:
      - MEDIA_TYPE_UNSPECIFIED
      - IMAGE
      - VIDEO
      - AUDIO
      - DOCUMENT
    default: MEDIA_TYPE_UNSPECIFIED
    description: |-
      The broad media category of the asset. Derived from content type
      during ingestion. Used for UI grouping, icons, and pipeline routing.

       - MEDIA_TYPE_UNSPECIFIED: Unspecified media type.
       - IMAGE: Still image (JPEG, PNG, TIFF, WebP, SVG, etc.).
       - VIDEO: Video file (MP4, MOV, MXF, ProRes, etc.).
       - AUDIO: Audio file (WAV, MP3, AAC, FLAC, etc.).
       - DOCUMENT: Document (PDF, etc.).
  AssetsImportAssetsBody:
    type: object
    properties:
      endpoint:
        type: string
        title: |-
          Required. The storage endpoint to scan. Format:
          `organizations/{organization}/storageGateways/{gateway}/endpoints/{endpoint}`
      pathPrefix:
        type: string
        description: |-
          Optional. The path prefix to scan within the endpoint. If empty,
          scans the entire endpoint.
      preservePaths:
        type: boolean
        description: |-
          Optional. If true, preserve the filesystem directory structure
          as the asset path field.
      autoTag:
        type: boolean
        description: |-
          Optional. If true, run AI auto-tagging on imported assets.
          Defaults to true.
    description: The request sent to the ImportAssets method.
    required:
      - endpoint
  AssetsUndeleteAssetBody:
    type: object
    properties:
      etag:
        type: string
        description: Optional. The etag for optimistic concurrency.
    description: The request sent to the UndeleteAsset method.
  AxisConfigScale:
    type: string
    enum:
      - SCALE_UNSPECIFIED
      - LINEAR
      - LOG10
    default: SCALE_UNSPECIFIED
    description: |-
      Axis scale types.

       - SCALE_UNSPECIFIED: Unspecified; defaults to LINEAR.
       - LINEAR: Linear scale.
       - LOG10: Logarithmic (base 10) scale.
  CacheConfigEvictionPolicy:
    type: string
    enum:
      - EVICTION_POLICY_UNSPECIFIED
      - LRU
      - LFU
    default: EVICTION_POLICY_UNSPECIFIED
    description: |-
      The eviction policy used when the cache reaches its maximum size.

       - EVICTION_POLICY_UNSPECIFIED: Unspecified eviction policy.
       - LRU: Least Recently Used: evicts the least recently accessed items first.
       - LFU: Least Frequently Used: evicts the least frequently accessed items first.
  ChartWidgetChartType:
    type: string
    enum:
      - CHART_TYPE_UNSPECIFIED
      - LINE
      - BAR
      - AREA
      - STACKED_BAR
      - STACKED_AREA
      - SCATTER
    default: CHART_TYPE_UNSPECIFIED
    description: |-
      Chart visualization types.

       - CHART_TYPE_UNSPECIFIED: Unspecified chart type; defaults to LINE.
       - LINE: Line chart.
       - BAR: Bar chart.
       - AREA: Area chart.
       - STACKED_BAR: Stacked bar chart.
       - STACKED_AREA: Stacked area chart.
       - SCATTER: Scatter plot.
  CollectionWidgetDisplayMode:
    type: string
    enum:
      - DISPLAY_MODE_UNSPECIFIED
      - TABLE
      - CARD
    default: DISPLAY_MODE_UNSPECIFIED
    description: |-
      How the rows are visually arranged. The renderer picks layout
      primitives per mode (e.g. `Table` for TABLE, a card grid for CARD).

       - DISPLAY_MODE_UNSPECIFIED: Default; the renderer picks based on `supported_modes` (first
      entry) or falls back to TABLE.
       - TABLE: Classic tabular rendering with sortable columns.
       - CARD: Card-grid rendering — each row becomes a card with thumbnail.
  DashboardManagementMode:
    type: string
    enum:
      - MANAGEMENT_MODE_UNSPECIFIED
      - USER_MANAGED
      - SYSTEM_MANAGED
    default: MANAGEMENT_MODE_UNSPECIFIED
    description: |-
      Identifies who owns the lifecycle of a dashboard. SYSTEM_MANAGED
      dashboards are server-curated and reject all mutations; USER_MANAGED
      dashboards are owned by the customer and support full CRUD.

       - MANAGEMENT_MODE_UNSPECIFIED: Default. Server handlers always populate this field on read,
      so UNSPECIFIED on the wire indicates a server bug, not a
      legitimate state.
       - USER_MANAGED: Customer-owned. Full CRUD applies.
       - SYSTEM_MANAGED: Server-curated. Mutations are rejected with FAILED_PRECONDITION.
  DashboardsQueryDashboardDataBody:
    type: object
    properties:
      query:
        $ref: '#/definitions/v1ResourceQuery'
        description: |-
          Required. The query to resolve. v1 supports
          `query.resource_type = "pivox.assets/Asset"` only; other resource
          types return Unimplemented until per-type handlers land.
      pageSize:
        type: integer
        format: int32
        description: Optional. Maximum number of rows to return per page.
      pageToken:
        type: string
        description: Optional. Page token from a previous QueryDashboardData call.
    description: Request message for QueryDashboardData.
    required:
      - query
  IamAddGroupMembersBody:
    type: object
    properties:
      members:
        type: array
        items:
          type: string
        title: |-
          Required. The user resource names to add as members.
          Format: `organizations/{organization}/users/{user}`
    description: Request message for `Iam.AddGroupMembers`.
    required:
      - members
  IamRemoveGroupMembersBody:
    type: object
    properties:
      members:
        type: array
        items:
          type: string
        title: |-
          Required. The user resource names to remove from the group.
          Format: `organizations/{organization}/users/{user}`
    description: Request message for `Iam.RemoveGroupMembers`.
    required:
      - members
  IconConfigIconSize:
    type: string
    enum:
      - ICON_SIZE_UNSPECIFIED
      - SMALL
      - MEDIUM
      - LARGE
      - EXTRA_LARGE
    default: ICON_SIZE_UNSPECIFIED
    description: |-
      Display size hint for the leading icon. The renderer maps each
      bucket to a platform-appropriate point size.

       - ICON_SIZE_UNSPECIFIED: Default; renderer picks a context-appropriate size.
       - SMALL: Compact size — typical for inline list rows.
       - MEDIUM: Default mid-size — typical for card thumbnails.
       - LARGE: Larger thumbnail emphasis.
       - EXTRA_LARGE: Hero-size thumbnail; used for empty-state and primary tiles.
  OidcConfigResponseType:
    type: object
    properties:
      code:
        type: boolean
        description: Optional. Authorization-code flow. Requires `client_secret`.
      idToken:
        type: boolean
        description: |-
          Optional. Implicit flow with id_token only. No `client_secret`
          needed.
    description: |-
      OIDC response_type bitfield. Maps directly onto Firebase Admin
      SDK's `OIDCProviderConfig.ResponseType` struct.
  OrganizationsAcceptInvitationBody:
    type: object
    description: Request message for `AcceptInvitation`.
  OrganizationsDeclineInvitationBody:
    type: object
    description: Request message for `DeclineInvitation`.
  OrganizationsTransferOwnershipBody:
    type: object
    properties:
      newOwner:
        type: string
        description: |-
          Required. The user receiving owner role.
          Format: `organizations/{organization}/users/{user}`. Must be an
          existing member of the org and not already an owner.
      etag:
        type: string
        description: Optional. Etag of the organization for optimistic concurrency.
    description: Request message for `Organizations.TransferOwnership`.
    required:
      - newOwner
  OrganizationsUndeleteOrganizationBody:
    type: object
    properties:
      etag:
        type: string
        description: |-
          Optional. The etag known to the client for the expected state of
          the organization.
    description: Request message for `Organizations.UndeleteOrganization`.
  PieChartWidgetPieChartType:
    type: string
    enum:
      - PIE_CHART_TYPE_UNSPECIFIED
      - PIE
      - DONUT
    default: PIE_CHART_TYPE_UNSPECIFIED
    description: |-
      Pie chart visualization types.

       - PIE_CHART_TYPE_UNSPECIFIED: Unspecified; defaults to PIE.
       - PIE: Standard pie chart.
       - DONUT: Donut chart.
  RequestPriority:
    type: string
    enum:
      - PRIORITY_UNSPECIFIED
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    default: PRIORITY_UNSPECIFIED
    description: |-
      Request priority levels.

       - PRIORITY_UNSPECIFIED: Unspecified priority. Treated as NORMAL.
       - LOW: Low priority.
       - NORMAL: Normal priority (default).
       - HIGH: High priority.
       - URGENT: Urgent priority.
  RequestsApproveRequestBody:
    type: object
    description: The request sent to the ApproveRequest method.
  RequestsAssignRequestBody:
    type: object
    properties:
      assignee:
        type: string
        title: 'Required. The user to assign. Format: `users/{user}`'
    description: The request sent to the AssignRequest method.
    required:
      - assignee
  RequestsCancelRequestBody:
    type: object
    description: The request sent to the CancelRequest method.
  RequestsClaimRequestBody:
    type: object
    description: The request sent to the ClaimRequest method.
  RequestsDeliverRequestBody:
    type: object
    description: The request sent to the DeliverRequest method.
  RequestsFulfillLineItemBody:
    type: object
    properties:
      endpoint:
        type: string
        description: Required. The storage endpoint to store the deliverable on.
      filename:
        type: string
        description: Optional. The original filename from the client.
      sizeBytes:
        type: string
        format: int64
        description: Optional. The file size in bytes. Required for multipart uploads.
    description: The request sent to the FulfillLineItem method.
    required:
      - endpoint
  RequestsRejectRequestBody:
    type: object
    properties:
      rejectionReason:
        type: string
        description: Optional. A note explaining why the request was rejected.
    description: The request sent to the RejectRequest method.
  RequestsRequestRevisionBody:
    type: object
    properties:
      revisionNote:
        type: string
        description: Optional. A note explaining what revisions are needed.
    description: The request sent to the RequestRevision method.
  RequestsSubmitRequestBody:
    type: object
    description: The request sent to the SubmitRequest method.
  SpacesUndeleteSpaceBody:
    type: object
    properties:
      etag:
        type: string
        description: |-
          Optional. The etag known to the client for the expected state of the space.
          This is to be used for optimistic concurrency.
      validateOnly:
        type: boolean
        description: |-
          Optional. If set to true, the request will only validate the request
          without persisting it.
    description: |-
      The request sent to the [UndeleteSpace]
      [pivox.api.v1.Spaces.UndeleteSpace]
      method.
  StorageGatewayCertificate:
    type: object
    properties:
      state:
        $ref: '#/definitions/StorageGatewayCertificateState'
        description: Output only. The current state of the TLS certificate.
        readOnly: true
      expireTime:
        type: string
        format: date-time
        description: Output only. The expiration time of the TLS certificate.
        readOnly: true
    description: |-
      The TLS certificate for a storage gateway. Groups the cert
      lifecycle state and expiry so they aren't loose `cert_*` fields
      on the gateway resource.
  StorageGatewayCertificateState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PENDING
      - ACTIVE
      - EXPIRING
      - EXPIRED
    default: STATE_UNSPECIFIED
    description: |-
      TLS certificate lifecycle states.

       - STATE_UNSPECIFIED: Unspecified certificate state.
       - PENDING: The certificate is being provisioned.
       - ACTIVE: The certificate is active and valid.
       - EXPIRING: The certificate is approaching its expiration date.
       - EXPIRED: The certificate has expired.
  StorageGatewaysCreateStorageSessionBody:
    type: object
    properties:
      ttl:
        type: string
        description: |-
          Optional. Override session duration. Default: 1 hour. Capped at
          the server-configured maximum (`StorageGatewaysConfig.MaxSessionTTL`,
          typically 8h); requests exceeding the cap are clamped, not
          rejected.
    description: |
      The request sent to the
      [CreateStorageSession][pivox.storage.v1.StorageGateways.CreateStorageSession]
      method.
  StorageGatewaysRotateRegistrationTokenBody:
    type: object
    description: |-
      The request sent to the
      [RotateRegistrationToken][pivox.storage.v1.StorageGateways.RotateRegistrationToken]
      method.
  StorageGatewaysUpgradeGatewayBody:
    type: object
    properties:
      targetVersion:
        type: string
        description: Required. The target version to upgrade to.
    description: |-
      The request sent to the
      [UpgradeGateway][pivox.storage.v1.StorageGateways.UpgradeGateway]
      method.
    required:
      - targetVersion
  TagBindingOrigin:
    type: string
    enum:
      - ORIGIN_UNSPECIFIED
      - USER
      - SYSTEM
      - AI
    default: ORIGIN_UNSPECIFIED
    description: |-
      How a tag binding was created.

       - ORIGIN_UNSPECIFIED: Unspecified origin.
       - USER: Manually applied by a user.
       - SYSTEM: Generated from file metadata extraction (EXIF, XMP).
       - AI: Generated by AI auto-tagging.
  ThresholdDirection:
    type: string
    enum:
      - DIRECTION_UNSPECIFIED
      - ABOVE
      - BELOW
    default: DIRECTION_UNSPECIFIED
    description: |-
      Direction relative to the threshold value.

       - DIRECTION_UNSPECIFIED: Unspecified direction.
       - ABOVE: Values above the threshold.
       - BELOW: Values below the threshold.
  longrunningOperation:
    type: object
    properties:
      name:
        type: string
        description: |-
          The server-assigned name, which is only unique within the same service that
          originally returns it. If you use the default HTTP mapping, the
          `name` should be a resource name ending with `operations/{unique_id}`.
      metadata:
        $ref: '#/definitions/protobufAny'
        description: |-
          Service-specific metadata associated with the operation.  It typically
          contains progress information and common metadata such as create time.
          Some services might not provide such metadata.  Any method that returns a
          long-running operation should document the metadata type, if any.
      done:
        type: boolean
        description: |-
          If the value is `false`, it means the operation is still in progress.
          If `true`, the operation is completed, and either `error` or `response` is
          available.
      error:
        $ref: '#/definitions/rpcStatus'
        description: The error result of the operation in case of failure or cancellation.
      response:
        $ref: '#/definitions/protobufAny'
        description: |-
          The normal, successful response of the operation.  If the original
          method returns no data on success, such as `Delete`, the response is
          `google.protobuf.Empty`.  If the original method is standard
          `Get`/`Create`/`Update`, the response should be the resource.  For other
          methods, the response should have the type `XxxResponse`, where `Xxx`
          is the original method name.  For example, if the original method name
          is `TakeSnapshot()`, the inferred response type is
          `TakeSnapshotResponse`.
    description: |-
      This resource represents a long-running operation that is the result of a
      network API call.
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: |-
          A URL/resource name that uniquely identifies the type of the serialized
          protocol buffer message. This string must contain at least
          one "/" character. The last segment of the URL's path must represent
          the fully qualified name of the type (as in
          `path/google.protobuf.Duration`). The name should be in a canonical form
          (e.g., leading "." is not accepted).

          In practice, teams usually precompile into the binary all types that they
          expect it to use in the context of Any. However, for URLs which use the
          scheme `http`, `https`, or no scheme, one can optionally set up a type
          server that maps type URLs to message definitions as follows:

          * If no scheme is provided, `https` is assumed.
          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official
          protobuf release, and it is not used for type URLs beginning with
          type.googleapis.com. As of May 2023, there are no widely used type server
          implementations and no plans to implement one.

          Schemes other than `http`, `https` (or the empty scheme) might be
          used with implementation specific semantics.
    additionalProperties: {}
    description: |-
      `Any` contains an arbitrary serialized protocol buffer message along with a
      URL that describes the type of the serialized message.

      Protobuf library provides support to pack/unpack Any values in the form
      of utility functions or additional generated methods of the Any type.

      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use
      'type.googleapis.com/full.type.name' as the type URL and the unpack
      methods only use the fully qualified type name after the last '/'
      in the type URL, for example "foo.bar.com/x/y.z" will yield type
      name "y.z".

      JSON
      ====
      The JSON representation of an `Any` value uses the regular
      representation of the deserialized, embedded message, with an
      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON
      representation, that representation will be embedded adding a field
      `value` which holds the custom JSON in addition to the `@type`
      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      `NullValue` is a singleton enumeration to represent the null value for the
      `Value` type union.

      The JSON representation for `NullValue` is JSON `null`.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: |-
          A developer-facing error message, which should be in English. Any
          user-facing error message should be localized and sent in the
          [google.rpc.Status.details][google.rpc.Status.details] field, or localized
          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: |-
          A list of messages that carry the error details.  There is a common set of
          message types for APIs to use.
    description: |-
      The `Status` type defines a logical error model that is suitable for
      different programming environments, including REST APIs and RPC APIs. It is
      used by [gRPC](https://github.com/grpc). Each `Status` message contains
      three pieces of data: error code, error message, and error details.

      You can find out more about this error model and how to work with it in the
      [API Design Guide](https://cloud.google.com/apis/design/errors).
  typeColor:
    type: object
    properties:
      red:
        type: number
        format: float
        description: The amount of red in the color as a value in the interval [0, 1].
      green:
        type: number
        format: float
        description: The amount of green in the color as a value in the interval [0, 1].
      blue:
        type: number
        format: float
        description: The amount of blue in the color as a value in the interval [0, 1].
      alpha:
        type: number
        format: float
        description: |-
          `pixel color = alpha * (this color) + (1.0 - alpha) * (background color)`

          This means that a value of 1.0 corresponds to a solid color, whereas
          a value of 0.0 corresponds to a completely transparent color. This
          uses a wrapper message rather than a simple float scalar so that it is
          possible to distinguish between a default value and the value being unset.
          If omitted, this color object is rendered as a solid color
          (as if the alpha value had been explicitly given a value of 1.0).
        title: |-
          The fraction of this color that should be applied to the pixel. That is,
          the final pixel color is defined by the equation:
    description: |-
      Represents a color in the RGBA color space. This representation is designed
      for simplicity of conversion to/from color representations in various
      languages over compactness. For example, the fields of this representation
      can be trivially provided to the constructor of `java.awt.Color` in Java; it
      can also be trivially provided to UIColor's `+colorWithRed:green:blue:alpha`
      method in iOS; and, with just a little work, it can be easily formatted into
      a CSS `rgba()` string in JavaScript.

      This reference page doesn't carry information about the absolute color
      space
      that should be used to interpret the RGB value (e.g. sRGB, Adobe RGB,
      DCI-P3, BT.2020, etc.). By default, applications should assume the sRGB color
      space.

      When color equality needs to be decided, implementations, unless
      documented otherwise, treat two colors as equal if all their red,
      green, blue, and alpha values each differ by at most 1e-5.

      Example (Java):

           import com.google.type.Color;

           // ...
           public static java.awt.Color fromProto(Color protocolor) {
             float alpha = protocolor.hasAlpha()
                 ? protocolor.getAlpha().getValue()
                 : 1.0;

             return new java.awt.Color(
                 protocolor.getRed(),
                 protocolor.getGreen(),
                 protocolor.getBlue(),
                 alpha);
           }

           public static Color toProto(java.awt.Color color) {
             float red = (float) color.getRed();
             float green = (float) color.getGreen();
             float blue = (float) color.getBlue();
             float denominator = 255.0;
             Color.Builder resultBuilder =
                 Color
                     .newBuilder()
                     .setRed(red / denominator)
                     .setGreen(green / denominator)
                     .setBlue(blue / denominator);
             int alpha = color.getAlpha();
             if (alpha != 255) {
               result.setAlpha(
                   FloatValue
                       .newBuilder()
                       .setValue(((float) alpha) / denominator)
                       .build());
             }
             return resultBuilder.build();
           }
           // ...

      Example (iOS / Obj-C):

           // ...
           static UIColor* fromProto(Color* protocolor) {
              float red = [protocolor red];
              float green = [protocolor green];
              float blue = [protocolor blue];
              FloatValue* alpha_wrapper = [protocolor alpha];
              float alpha = 1.0;
              if (alpha_wrapper != nil) {
                alpha = [alpha_wrapper value];
              }
              return [UIColor colorWithRed:red green:green blue:blue alpha:alpha];
           }

           static Color* toProto(UIColor* color) {
               CGFloat red, green, blue, alpha;
               if (![color getRed:&red green:&green blue:&blue alpha:&alpha]) {
                 return nil;
               }
               Color* result = [[Color alloc] init];
               [result setRed:red];
               [result setGreen:green];
               [result setBlue:blue];
               if (alpha <= 0.9999) {
                 [result setAlpha:floatWrapperWithValue(alpha)];
               }
               [result autorelease];
               return result;
          }
          // ...

       Example (JavaScript):

          // ...

          var protoToCssColor = function(rgb_color) {
             var redFrac = rgb_color.red || 0.0;
             var greenFrac = rgb_color.green || 0.0;
             var blueFrac = rgb_color.blue || 0.0;
             var red = Math.floor(redFrac * 255);
             var green = Math.floor(greenFrac * 255);
             var blue = Math.floor(blueFrac * 255);

             if (!('alpha' in rgb_color)) {
                return rgbToCssColor(red, green, blue);
             }

             var alphaFrac = rgb_color.alpha.value || 0.0;
             var rgbParams = [red, green, blue].join(',');
             return ['rgba(', rgbParams, ',', alphaFrac, ')'].join('');
          };

          var rgbToCssColor = function(red, green, blue) {
            var rgbNumber = new Number((red << 16) | (green << 8) | blue);
            var hexString = rgbNumber.toString(16);
            var missingZeros = 6 - hexString.length;
            var resultBuilder = ['#'];
            for (var i = 0; i < missingZeros; i++) {
               resultBuilder.push('0');
            }
            resultBuilder.push(hexString);
            return resultBuilder.join('');
          };

          // ...
  typesActor:
    type: object
    properties:
      id:
        type: string
        description: |-
          The identity's stable UUID (firebase_identities.id). Always
          populated when the column is non-null in the database, even for
          soft-deleted identities.
        readOnly: true
      displayName:
        type: string
        description: Resolved display name. Empty for soft-deleted identities.
        readOnly: true
      email:
        type: string
        description: Resolved email address. Empty for soft-deleted identities.
        readOnly: true
      isDeleted:
        type: boolean
        description: |-
          True when the identity has been soft-deleted. PII fields are
          blanked out in that case while id is preserved.
        readOnly: true
    description: |-
      Actor is a resolved reference to an identity. It is used flat on
      resources to expose audit fields (created_by, updated_by, deleted_by)
      per AIP-148, and can be reused at non-audit positions like assignee
      or approver.

      Actor lives in `pivox.types` (unversioned — type definitions are
      shared infrastructure, not an API surface) so every domain package
      (pivox.api.v1, pivox.ai.v1, pivox.assets.v1, pivox.iam.v1,
      pivox.storage.v1) can reference it without crossing into a peer
      domain — the api-linter's foreign-type-reference rule (AIP-215)
      considers `pivox.types` a shared types namespace.

      Resolution is performed server-side via the audit.Resolver, which
      batches lookups against firebase_identities and caches recent
      results. When the underlying identity is soft-deleted the resolver
      blanks out PII (display_name, email) and sets is_deleted=true while
      preserving the id so that historical references remain stable.
  v1Abort:
    type: object
    properties:
      reason:
        type: string
        description: Optional. Human-readable cancellation reason.
  v1AbsoluteTimeRange:
    type: object
    properties:
      startTime:
        type: string
        format: date-time
        description: Required. The start of the time range.
      endTime:
        type: string
        format: date-time
        description: Required. The end of the time range.
    description: AbsoluteTimeRange defines an explicit start and end time.
    required:
      - startTime
      - endTime
  v1AcceptInvitationResponse:
    type: object
    properties:
      invitation:
        $ref: '#/definitions/v1Invitation'
        description: The accepted invitation.
    description: Response message for `AcceptInvitation`.
  v1AccountOrganization:
    type: object
    properties:
      organization:
        type: string
        description: |-
          The canonical Organization this view derives from.
          Format: `organizations/{organization}`.
        readOnly: true
      displayName:
        type: string
        description: Human-readable organization name shown in pickers.
        readOnly: true
      role:
        type: string
        description: |-
          Caller's effective role on this org. One of `owner`, `admin`,
          `editor`, `viewer` — the v1 system roles. When the caller has
          both a direct binding and group-mediated bindings on the same
          org, the highest-precedence role wins
          (owner > admin > editor > viewer). Bindings to non-system roles
          are excluded from this view in v1.
        readOnly: true
    description: |-
      AccountOrganization is the slim, caller-scoped projection of an
      org the authenticated caller has membership in. Intentionally NOT
      a `google.api.resource` — it's a derived view (Organization joined
      with the caller's role binding), not a durable, independently
      addressable entity. Get/Update/Delete don't apply; only the
      `ListAccountOrganizations` projection.

      Distinct from `pivox.api/Organization` (the full resource on
      `/v1/organizations/{org}`): the post-sign-in bootstrap and
      org-picker UIs need (slug, display_name, role) without the full
      Organization's Actor fields, etag, annotations, timestamps, and
      lifecycle state. Soft-deleted orgs are excluded from this view —
      those surface only through `Organizations.ListOrganizations` for
      the undelete UX.
  v1AddGroupMembersResponse:
    type: object
    description: Response message for `Iam.AddGroupMembers`.
  v1Agent:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the agent. Format:
          `organizations/{organization}/storageGateways/{storage_gateway}/agents/{agent}`
        readOnly: true
      ipAddress:
        type: string
        description: Output only. The IP address of the agent.
        readOnly: true
      hostname:
        type: string
        description: Output only. The hostname of the machine running the agent.
        readOnly: true
      state:
        $ref: '#/definitions/v1AgentState'
        description: Output only. The current lifecycle state of the agent.
        readOnly: true
      version:
        type: string
        description: Output only. The version of the agent software.
        readOnly: true
      certExpiryTime:
        type: string
        format: date-time
        description: Output only. The expiry time of the agent's TLS certificate.
        readOnly: true
      cacheUsedGb:
        type: integer
        format: int32
        description: |-
          Output only. The amount of cache storage used by the agent, in
          gigabytes.
        readOnly: true
      joinTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the agent first joined the storage gateway.
        readOnly: true
      lastSeenTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the agent last reported its status.
        readOnly: true
    description: |-
      An agent represents a process that has connected to a storage gateway
      and is available to serve storage operations. Agents self-register via
      bidirectional streaming and cannot be created through the API.
  v1AgentState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - CONNECTING
      - CONNECTED
      - DRAINING
      - UPGRADING
      - DISCONNECTED
    default: STATE_UNSPECIFIED
    description: |-
      Agent lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state. This is only useful for distinguishing unset values.
       - CONNECTING: The agent is in the process of establishing a connection.
       - CONNECTED: The agent is connected and actively serving requests.
       - DRAINING: The agent is draining: it stops accepting new work and finishes
      in-flight operations.
       - UPGRADING: The agent is upgrading to a newer version.
       - DISCONNECTED: The agent has disconnected from the storage gateway.
  v1Aggregation:
    type: string
    enum:
      - AGGREGATION_UNSPECIFIED
      - AGGREGATION_COUNT
      - AGGREGATION_SUM
      - AGGREGATION_AVG
      - AGGREGATION_MIN
      - AGGREGATION_MAX
    default: AGGREGATION_UNSPECIFIED
    description: |-
      Aggregation functions that can be applied to resource queries.

       - AGGREGATION_UNSPECIFIED: No aggregation specified.
       - AGGREGATION_COUNT: Count of matching resources.
       - AGGREGATION_SUM: Sum of the aggregation field.
       - AGGREGATION_AVG: Average of the aggregation field.
       - AGGREGATION_MIN: Minimum value of the aggregation field.
       - AGGREGATION_MAX: Maximum value of the aggregation field.
  v1AndroidApplication:
    type: object
    properties:
      sha1Fingerprint:
        type: string
        description: |-
          Optional. The SHA1 fingerprint of the application. For example, both sha1 formats are
          acceptable : DA:39:A3:EE:5E:6B:4B:0D:32:55:BF:EF:95:60:18:90:AF:D8:07:09 or
          DA39A3EE5E6B4B0D3255BFEF95601890AFD80709.
          Output format is the latter.
      package:
        type: string
        description: Optional. The package of the application.
    description: Identifier of an Android application for key use.
  v1AndroidKeyRestrictions:
    type: object
    properties:
      allowedApplications:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1AndroidApplication'
        description: |-
          Optional. A list of Android applications that are allowed to make API calls with
          this key.
    description: The Android apps that are allowed to use the key.
  v1ApiTarget:
    type: object
    properties:
      service:
        type: string
        description: |-
          Optional. The service for this restriction. It should be the canonical
          service name, for example: `translate.pivox.api`.
      methods:
        type: array
        items:
          type: string
        title: |-
          Optional. List of one or more methods that can be called.
          If empty, all methods for the service are allowed. A wildcard
          (*) can be used as the last symbol.
          Valid examples:
            `pivox.translate.v2.TranslateService.GetSupportedLanguage`
            `TranslateText`
            `Get*`
            `translate.pivox.api.Get*`
    description: |-
      A restriction for a specific service and optionally one or multiple
      specific methods. Both fields are case insensitive.
  v1Artifact:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the artifact.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}`
      type:
        type: string
        description: Output only. The type of artifact content (e.g. "code", "markdown", "svg", "image").
        readOnly: true
      title:
        type: string
        description: Output only. A human-readable title for the artifact.
        readOnly: true
      description:
        type: string
        description: Output only. An optional description of the artifact.
        readOnly: true
      latestVersion:
        type: string
        title: |-
          Output only. The resource name of the latest version.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this artifact.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. When the artifact was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this artifact.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. When the artifact was last updated.
        readOnly: true
    description: |-
      An artifact is a structured output produced during a conversation, such
      as a code snippet, markdown document, or SVG graphic. Artifacts are
      versioned — each edit produces a new ArtifactVersion.
  v1ArtifactVersion:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the artifact version.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}/artifacts/{artifact}/versions/{version}`
      inline:
        $ref: '#/definitions/v1InlineContent'
        description: Inline content for small text artifacts (code, markdown, svg).
      assetVersion:
        type: string
        title: |-
          Resource name of the asset version for binary artifacts.
          Format: `organizations/{organization}/spaces/{space}/assets/{asset}/versions/{version}`
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this version.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. When this version was created.
        readOnly: true
    description: |-
      A single version of an artifact. Content is stored either inline (small
      text: code, markdown, svg) or as a pointer to the Pivox asset system
      (binary: image, pdf, video).
  v1Asset:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the asset. Format:
          `organizations/{organization}/spaces/{space}/assets/{asset}`
        readOnly: true
      displayName:
        type: string
        description: Required. A human-readable name for the asset.
      state:
        $ref: '#/definitions/v1AssetState'
        description: Output only. The current lifecycle state.
        readOnly: true
      mediaType:
        $ref: '#/definitions/AssetMediaType'
        description: |-
          Output only. The broad media category, derived from the content
          type during ingestion.
        readOnly: true
      contentType:
        type: string
        description: |-
          Output only. The content type of the original file (e.g.
          `image/jpeg`, `video/mp4`). Determined from magic bytes during
          ingestion, not from the file extension.
        readOnly: true
      filename:
        type: string
        description: |-
          Output only. The original filename as provided by the client at
          upload time.
        readOnly: true
      importPath:
        type: string
        description: |-
          Output only. The original filesystem path when this asset was created
          via ImportAssets. Read-only historical label — not a folder, not
          editable. Empty for directly uploaded assets.
        readOnly: true
      endpoint:
        type: string
        title: |-
          Output only. The storage endpoint where the asset's files are stored.
          Format: `organizations/{organization}/storageGateways/{gateway}/endpoints/{endpoint}`
        readOnly: true
      checksumSha256:
        type: string
        description: |-
          Output only. SHA-256 checksum of the original file. Used for
          deduplication — if a file with the same checksum already exists
          in the space, the existing asset is returned instead of creating
          a duplicate.
        readOnly: true
      sizeBytes:
        type: string
        format: int64
        description: Output only. Size of the original file in bytes.
        readOnly: true
      latestVersion:
        $ref: '#/definitions/v1AssetVersion'
        description: Output only. The latest version of the asset.
        readOnly: true
      versionCount:
        type: integer
        format: int32
        description: Output only. Total number of versions.
        readOnly: true
      ttl:
        type: string
        description: |-
          Input only. The time-to-live for the asset, as an alternative to
          setting expire_time directly. The server computes expire_time from
          create_time + ttl.
      duration:
        type: string
        description: Output only. Duration of the media, for video and audio assets.
        readOnly: true
      width:
        type: integer
        format: int32
        description: Output only. Width in pixels, for image and video assets.
        readOnly: true
      height:
        type: integer
        format: int32
        description: Output only. Height in pixels, for image and video assets.
        readOnly: true
      expireTime:
        type: string
        format: date-time
        description: |-
          Optional. The time at which this asset should expire. When set,
          a background reaper will soft-delete the asset after this time.
          Can be set directly or via a retention policy (tag-based rules).
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Annotations associated with this asset.
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current
          value of the Asset resource.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this asset.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the asset was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this asset.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the asset was last modified.
        readOnly: true
      deletedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that requested deletion of this asset.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: Output only. The time at which the asset was soft-deleted.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: Output only. The time at which the asset will be permanently purged.
        readOnly: true
    description: |-
      A media asset. Assets are immutable — file content cannot be changed
      after creation. Use versions for new iterations of the same logical
      asset. Assets are flat (no folder hierarchy); use tags for organization
      and the optional path field for display grouping.
    required:
      - displayName
  v1AssetMetadata:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name. Format:
          `organizations/{organization}/spaces/{space}/assets/{asset}/metadata`
        readOnly: true
      metadata:
        type: object
        description: |-
          Output only. The extracted metadata as a structured JSON object.
          Fields vary by media type and file format.
        readOnly: true
    description: |-
      AssetMetadata contains the full extracted metadata for an asset
      (EXIF, XMP, etc.). This is a singleton sub-resource of Asset,
      accessed via GetAssetMetadata. Junk metadata (Adobe comments,
      software tags) is stripped during ingestion.
  v1AssetState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PLACEHOLDER
      - PROCESSING
      - ACTIVE
      - FAILED
      - DELETE_REQUESTED
    default: STATE_UNSPECIFIED
    description: |-
      Asset lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state.
       - PLACEHOLDER: The asset is a placeholder with no file content. Created by
      the Request workflow — the file will be provided when an
      artist fulfills the associated line item.
       - PROCESSING: The asset is being ingested (upload, metadata extraction,
      thumbnail generation, AI processing).
       - ACTIVE: The asset is fully ingested and available.
       - FAILED: An ingestion step failed. Check the latest version's
      ingestion_error for details.
       - DELETE_REQUESTED: The asset has been marked for deletion. Can be restored
      with UndeleteAsset before purge_time.
  v1AssetVersion:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the version. Format:
          `organizations/{organization}/spaces/{space}/assets/{asset}/versions/{version}`
        readOnly: true
      versionNumber:
        type: integer
        format: int32
        description: Output only. The sequential version number (1, 2, 3...).
        readOnly: true
      checksumSha256:
        type: string
        description: |-
          Output only. SHA-256 checksum of this version's file. Only set
          for upload versions (not edit versions).
        readOnly: true
      sizeBytes:
        type: string
        format: int64
        description: |-
          Output only. Size of this version's file in bytes. Only set
          for upload versions.
        readOnly: true
      mimeType:
        type: string
        description: Output only. MIME type of this version's file.
        readOnly: true
      storageKey:
        type: string
        description: |-
          Output only. The storage object key for the file. Only set for
          upload versions. Edit versions derive their output from the
          source version's blob + the crop operations.
        readOnly: true
      renditions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Rendition'
        description: Output only. Generated renditions (thumbnails, proxies, previews).
        readOnly: true
      changeNote:
        type: string
        description: Optional. A note describing what changed in this version.
      ingestionError:
        type: string
        description: Output only. If the ingestion pipeline failed, the error details.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this version.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when this version was created.
        readOnly: true
      sourceVersion:
        type: string
        description: |-
          Output only. The version this was derived from. Empty for upload
          versions. Set for edit versions (crop) and reverts.
        readOnly: true
      crop:
        $ref: '#/definitions/v1Crop'
        description: |-
          Output only. The crop/edit applied to the source version.
          Empty for upload versions.
        readOnly: true
    description: |-
      A specific version of an asset. A version is either an upload
      (has a blob) or an edit (has a crop + pointer to the source version).
      Versions are immutable once created. The asset's latest_version
      field always points to the most recent version.
  v1AxisConfig:
    type: object
    properties:
      label:
        type: string
        description: Optional. The axis label.
      scale:
        $ref: '#/definitions/AxisConfigScale'
        description: Optional. The axis scale.
      min:
        type: number
        format: double
        description: Optional. The minimum axis value.
      max:
        type: number
        format: double
        description: Optional. The maximum axis value.
    description: AxisConfig defines display properties for a chart axis.
  v1BrowserKeyRestrictions:
    type: object
    properties:
      allowedReferrers:
        type: array
        items:
          type: string
        description: |-
          Optional. A list of regular expressions for the referrer URLs that are allowed
          to make API calls with this key.
    description: The HTTP referrers (websites) that are allowed to use the key.
  v1CacheConfig:
    type: object
    properties:
      enabled:
        type: boolean
        description: |-
          Optional. Whether caching is enabled for this endpoint. Defaults to
          true for S3 endpoints, false for filesystem endpoints.
      maxSizeGb:
        type: integer
        format: int32
        description: Optional. The maximum cache size in gigabytes per agent.
      evictionPolicy:
        $ref: '#/definitions/CacheConfigEvictionPolicy'
        description: Optional. The eviction policy to use when the cache is full.
      ttlHours:
        type: integer
        format: int32
        description: Optional. The time-to-live for cached items, in hours.
    description: |-
      Cache configuration for an endpoint. Controls how agents cache assets
      fetched from this storage backend on their local SSD.
  v1Change:
    type: object
    properties:
      element:
        type: string
        description: |-
          Name of the element, interpreted relative to the entity's actual
          name. "" refers to the entity itself. The element name is a valid
          UTF-8 string.
      state:
        $ref: '#/definitions/v1ChangeState'
        description: The state of the `element`.
      data:
        $ref: '#/definitions/protobufAny'
        description: |-
          The actual change data. This field is present only when `state() == EXISTS`
          or `state() == ERROR`. Please see
          [google.protobuf.Any][google.protobuf.Any] about how to use the Any type.
      resumeMarker:
        type: string
        format: byte
        description: |-
          If present, provides a compact representation of all the messages that have
          been received by the caller for the given entity, e.g., it could be a
          sequence number or a multi-part timestamp/version vector. This marker can
          be provided in the Request message, allowing the caller to resume the
          stream watching at a specific point without fetching the initial state.
      continued:
        type: boolean
        description: |-
          If true, this Change is followed by more Changes that are in the same group
          as this Change.
    description: A Change indicates the most recent state of an element.
  v1ChangeBatch:
    type: object
    properties:
      changes:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Change'
        description: A list of Change messages.
    description: A batch of Change messages.
  v1ChangeState:
    type: string
    enum:
      - EXISTS
      - DOES_NOT_EXIST
      - INITIAL_STATE_SKIPPED
      - ERROR
    default: EXISTS
    description: |-
      - EXISTS: The element exists and its full value is included in data.
      buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
       - DOES_NOT_EXIST: The element does not exist.
       - INITIAL_STATE_SKIPPED: Element may or may not exist. Used only for initial state delivery when
      the client is not interested in fetching the initial state. See the
      "Initial State" section above.
       - ERROR: The element may exist, but some error has occurred. More information is
      available in the data field - the value is a serialized Status
      proto (from [google.rpc.Status][])
    title: 'A reported value can be in one of the following states:'
  v1ChartDataSet:
    type: object
    properties:
      dataSource:
        $ref: '#/definitions/v1DataSource'
        description: Required. The data source for this series.
      label:
        type: string
        description: Optional. The display label for this series.
      color:
        $ref: '#/definitions/typeColor'
        description: Optional. The color for this series.
    description: ChartDataSet is a single data series within a ChartWidget.
    required:
      - dataSource
  v1ChartWidget:
    type: object
    properties:
      dataSets:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1ChartDataSet'
        description: Required. The data sets to plot. Each data set becomes a series.
      chartType:
        $ref: '#/definitions/ChartWidgetChartType'
        description: Optional. The chart visualization type.
      xAxis:
        $ref: '#/definitions/v1AxisConfig'
        description: Optional. X-axis configuration.
      yAxis:
        $ref: '#/definitions/v1AxisConfig'
        description: Optional. Y-axis configuration.
      thresholds:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Threshold'
        description: Optional. Threshold lines drawn on the chart.
    description: ChartWidget displays time series or categorical data as an XY chart.
    required:
      - dataSets
  v1ChatMessageMetadata:
    type: object
    properties:
      conversation:
        type: string
        description: |-
          Resource name of the persisted conversation:
            `organizations/{organization}/users/{user}/conversations/{conversation}`
          Populated on the first `start` chunk of an auto-created stream so
          the client can thread it through on subsequent turns.
      model:
        type: string
        description: |-
          The model identifier that produced the response (e.g.
          "claude-sonnet-4-5", "gpt-5-turbo"). Populated on `finish`.
      usage:
        $ref: '#/definitions/v1TokenUsage'
        description: |-
          Token accounting for billing/observability. Populated on
          `finish` and on any mid-stream `message-metadata` chunks the
          model layer surfaces.
    description: |-
      ChatMessageMetadata is the Pivox-owned, typed payload that rides
      inside `start.messageMetadata`, `finish.messageMetadata`, and the
      standalone `message-metadata` chunk's `messageMetadata` field.

      Why typed (not google.protobuf.Struct): these fields are entirely
      Pivox-defined — the conversation resource name, the model, token
      counts. Carrying them as Struct made the OpenAPI-generated
      TypeScript map to `Record<string, never>` (the keys are invisible
      to openapi-typescript when the carrier is Struct), forcing a
      parallel hand-written TS interface. Typing them in proto lets
      `types.gen.ts` surface the real schema and the chat UI consume it
      without a duplicate declaration.

      Freeform provider/tool/data metadata stays Struct — the schema is
      upstream-defined (Anthropic, OpenAI, user-supplied `data-<name>`)
      and we genuinely don't know its shape at proto-design time.
  v1CollectionWidget:
    type: object
    properties:
      dataSource:
        $ref: '#/definitions/v1DataSource'
        description: Required. The data source for collection rows.
      columns:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Column'
        description: Optional. Column definitions. If empty, columns are auto-detected.
      rowsPerPage:
        type: integer
        format: int32
        description: Optional. Number of rows per page. Defaults to server-chosen value.
      displayMode:
        $ref: '#/definitions/CollectionWidgetDisplayMode'
        description: |-
          Optional. The current display mode for the widget. If unset, the
          renderer treats this as DISPLAY_MODE_UNSPECIFIED and picks based
          on `supported_modes`.
      supportedModes:
        type: array
        items:
          $ref: '#/definitions/CollectionWidgetDisplayMode'
        description: |-
          Optional. Modes the customer can switch between via the safe-edit
          UI. If empty, the widget is locked to `display_mode`. Modes not
          listed are not user-selectable even if the renderer can render
          them.

          Mode-selection matrix (worked examples):

            display_mode=UNSPECIFIED, supported_modes=[]
              → renderer picks TABLE (single mode, no toggle UI).

            display_mode=UNSPECIFIED, supported_modes=[CARD, TABLE]
              → renderer picks CARD (first listed); user can toggle to TABLE.

            display_mode=CARD, supported_modes=[]
              → locked to CARD; user cannot toggle.

            display_mode=TABLE, supported_modes=[CARD, TABLE]
              → starts at TABLE; user can toggle between TABLE and CARD.
      rowActions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1RowAction'
        description: |-
          Optional. Per-row actions exposed by the renderer (e.g. "open",
          "share", "archive"). Populated by the server template per resource
          type.
      iconConfig:
        $ref: '#/definitions/v1IconConfig'
        description: Optional. How to derive each row's leading icon / thumbnail.
      emptyState:
        $ref: '#/definitions/v1EmptyState'
        description: Optional. Content displayed when the data source returns no rows.
    description: |-
      CollectionWidget displays a collection of rows in one of several
      display modes (table, card grid). The same data source feeds every
      mode; switching modes is a presentation concern handled by the
      client renderer.

      Naming note: the widget is mode-agnostic by design. New display
      modes (e.g. a vertical list with leading icon and trailing detail)
      get added to `DisplayMode` only when a concrete consumer plus a
      renderer implementation land in the same change. Shipping an enum
      value the renderer can't handle creates a silent downgrade; don't.
    required:
      - dataSource
  v1Column:
    type: object
    properties:
      field:
        type: string
        description: Required. The field name from the data source.
      displayName:
        type: string
        description: Optional. The display name for the column header.
      visible:
        type: boolean
        description: Optional. Whether this column is visible. Defaults to true.
      sortable:
        type: boolean
        description: Optional. Whether the customer can sort by this column.
      filterable:
        type: boolean
        description: |-
          Optional. Whether the customer can filter on this column. May be
          combined with `visible = false` to expose a filterable-but-hidden
          field.
    description: |-
      Column defines a column in a CollectionWidget. The same column set
      describes the data shape across every display mode (TABLE, CARD,
      …) — TABLE renders columns as headers, CARD picks the marked
      columns to surface on the card face, and so on.

      A column may participate in user-driven sorting and filtering even
      if it is not visually rendered: a column with `visible = false,
      filterable = true` exposes a filterable field that the customer can
      query without the column ever appearing in TABLE mode.
    required:
      - field
  v1Conversation:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the conversation.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}`
      creator:
        type: string
        title: |-
          Output only. Path-style creator reference, denormalized from the
          resource path. Kept alongside `created_by` for clients that
          resolve the user via routing rather than the structured Actor.
          Format: `organizations/{organization}/users/{user}`
        readOnly: true
      title:
        type: string
        description: |-
          The conversation title. May be set by the user or auto-generated.

          A title supplied at `CreateConversation` time does NOT mark the
          conversation as user-titled (`title_user_set` stays false), so
          the auto-summarization path is free to overwrite it once the
          first turn lands. Only an explicit `UpdateConversation` whose
          update mask covers `title` flips `title_user_set` to true and
          makes the title sticky against future `:summarize` calls.
      titleUserSet:
        type: boolean
        description: |-
          Output only. Whether the user has set the title via an explicit
          `UpdateConversation` call (mask covering `title`) — as opposed
          to a heuristic stub from `CreateConversation` or a server-side
          summary from `:summarize`. Used to suppress regeneration:
          re-running `:summarize` on a conversation whose title the user
          has already curated would overwrite their work.
        readOnly: true
      description:
        type: string
        description: An optional description of the conversation.
      archived:
        type: boolean
        description: Whether the conversation is archived.
      pinned:
        type: boolean
        description: Whether the conversation is pinned.
      messageCount:
        type: integer
        format: int32
        description: Output only. The number of messages in the conversation.
        readOnly: true
      lastMessageTime:
        type: string
        format: date-time
        description: Output only. The time of the last message in the conversation.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this conversation.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. When the conversation was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this conversation.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. When the conversation was last updated.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Conversation resource.
        readOnly: true
    description: A conversation represents a single chat thread between a user and the AI.
  v1CreateStorageSessionResponse:
    type: object
    properties:
      expireTime:
        type: string
        format: date-time
        description: The session expiration time.
      token:
        type: string
        description: |-
          The session JWT, also delivered as a Set-Cookie response header
          for browser flows. Native clients (macOS, Windows) read this
          value from the response body and attach it as
          `Authorization: Bearer <token>` on subsequent storage requests.

          The JWT is HS256-signed and carries the following claims:
            - `token`: opaque session id (UUID); the storage agent looks
              up the session's pattern grants by this value.
            - `sub`: the caller's Pivox identity UUID. Lets gateway-side
              audit logs attribute requests without a directory lookup.
            - `org`: the target organization's slug; matches the SessionGrant
              routing scope.
            - `exp`: Unix-second expiry timestamp.
    description: |-
      The response returned from the
      [CreateStorageSession][pivox.storage.v1.StorageGateways.CreateStorageSession]
      method.
  v1Crop:
    type: object
    properties:
      area:
        $ref: '#/definitions/v1CropArea'
        description: |-
          Optional. The crop area to apply. If set, width and height must
          be positive.
      straighten:
        type: number
        format: float
        description: Optional. Straighten angle in degrees (-45 to 45).
      flipHorizontal:
        type: boolean
        description: Optional. Flip horizontally.
      flipVertical:
        type: boolean
        description: Optional. Flip vertically.
      rotation:
        type: integer
        format: int32
        description: |-
          Optional. Rotation in 90-degree increments (0, 90, 180, 270).
          Applied after crop, before straighten.
    description: |-
      Crop operation combining crop area, rotation, straighten, and flip.
      Applied order: crop → rotation → straighten → flip.
  v1CropArea:
    type: object
    properties:
      x:
        type: integer
        format: int32
        description: Required. Origin X in pixels.
      "y":
        type: integer
        format: int32
        description: Required. Origin Y in pixels.
      width:
        type: integer
        format: int32
        description: Required. Width in pixels. Must be positive.
      height:
        type: integer
        format: int32
        description: Required. Height in pixels. Must be positive.
    description: The crop area within an image.
    required:
      - x
      - "y"
      - width
      - height
  v1Dashboard:
    type: object
    properties:
      name:
        type: string
        description: |-
          Immutable. The resource name of the dashboard.
          Format: `organizations/{organization}/dashboards/{dashboard}` or
                  `organizations/{organization}/spaces/{space}/dashboards/{dashboard}`.
      displayName:
        type: string
        description: Required. A human-readable name for the dashboard.
      description:
        type: string
        description: Optional. A longer description of the dashboard's purpose.
      gridLayout:
        $ref: '#/definitions/v1GridLayout'
        description: A grid-based layout with positioned tiles.
      variables:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1DashboardVariable'
        description: Optional. Template variables for parameterizing widget queries.
      createTime:
        type: string
        format: date-time
        description: Output only. Creation time.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Last update time.
        readOnly: true
      etag:
        type: string
        description: Output only. Entity tag for optimistic concurrency control.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Free-form annotations for the dashboard.
      managementMode:
        $ref: '#/definitions/DashboardManagementMode'
        description: |-
          Output only. Identifies whether this dashboard is server-curated
          (SYSTEM_MANAGED) or customer-owned (USER_MANAGED). Mutations of
          SYSTEM_MANAGED dashboards are rejected with FAILED_PRECONDITION
          regardless of URL path.

          MAINTAINER: `OUTPUT_ONLY` is documentation, not enforcement. The
          UpdateDashboard handler MUST reject any FieldMask path that names
          this field with `INVALID_ARGUMENT`, otherwise a customer can flip
          the management_mode and escape the SYSTEM_MANAGED mutation guard.
        readOnly: true
    description: A dashboard at the organization or space scope.
    required:
      - displayName
  v1DashboardVariable:
    type: object
    properties:
      key:
        type: string
        description: Required. The variable key (used as a template parameter in queries).
      displayName:
        type: string
        description: Optional. A human-readable label for the variable.
      defaultValue:
        type: string
        description: Optional. The default value when no selection is made.
      allowedValues:
        type: array
        items:
          type: string
        description: Optional. A fixed set of allowed values. If empty, any value is accepted.
    description: A template variable that can be referenced in widget queries.
    required:
      - key
  v1DataPart:
    type: object
    properties:
      name:
        type: string
        description: |-
          The Vercel data type suffix; the SSE translator emits the
          wire `type` as `"data-" + name`. Must be non-empty.
      id:
        type: string
        description: Optional. Stable replace-on-update key.
      data:
        type: object
        description: |-
          The payload. Carried as structured data so `protojson` emits
          a native JSON object on the wire.
      transient:
        type: boolean
        description: True to skip persistence on the client (fire `onData` only).
    description: |-
      A custom UI part. Emitted on the wire as `data-<name>`. When
      `id` is set, repeated events with the same `name` + `id`
      REPLACE the data part on the client — used for streaming
      artifacts and other in-place updates. When `transient` is true,
      the client fires its `onData` callback but does NOT persist the
      chunk to message state.

      Artifacts use this with `name = "artifact"` and stable per-
      artifact `id`; the server-side accumulator builds growing
      snapshots inside `data`.
  v1DataSource:
    type: object
    properties:
      resourceQuery:
        $ref: '#/definitions/v1ResourceQuery'
        description: Query against Pivox resources.
      staticData:
        $ref: '#/definitions/v1StaticData'
        description: Hardcoded static data points.
    description: |-
      DataSource defines where a widget gets its data. Extensible via the `source`
      oneof — new source types (SQL, external APIs) can be added later.
  v1DeclineInvitationResponse:
    type: object
    properties:
      invitation:
        $ref: '#/definitions/v1Invitation'
        description: The declined invitation.
    description: Response message for `DeclineInvitation`.
  v1Domain:
    type: object
    properties:
      name:
        type: string
        description: |-
          Output only. The resource name of the Domain. Format:
          `organizations/{organization}/domains/{domain}`. The trailing
          segment is the domain name itself (lowercase canonical form).
        readOnly: true
      domain:
        type: string
        description: |-
          Required on Create. The fully qualified domain name. Stored
          lowercase; case-insensitive on read.
      state:
        $ref: '#/definitions/v1DomainState'
        description: Output only. Last known verification state.
        readOnly: true
      verifiedTime:
        type: string
        format: date-time
        description: |-
          Output only. Timestamp when the domain transitioned to
          `VERIFIED`, or unset if it has never verified successfully.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that registered this domain.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the Domain row was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this domain.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the Domain was last modified.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the
          current value of the Domain resource.
        readOnly: true
    description: |-
      Domain is an organization-scoped resource representing a DNS domain
      the organization claims to own. Ownership is proved by publishing a
      TXT record matching the server-issued `verification_token`; the
      `CreateDomain` LRO drives that proof end-to-end.

      Domain is decoupled from any single consumer — SSO is the first
      caller (a verified domain routes to the org's enabled SsoConfig),
      but future features (email allowlist, custom invitation domains,
      branding) consume the same resource.
    required:
      - domain
  v1DomainState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PENDING
      - VERIFIED
      - FAILED
    default: STATE_UNSPECIFIED
    description: |-
      Verification lifecycle states. A Domain reflects the *last known*
      verification result; the active LRO progress lives in
      `CreateDomainMetadata.Phase` until it completes.

       - STATE_UNSPECIFIED: Default; not used.
       - PENDING: Domain row exists; verification has not yet succeeded. The
      associated `CreateDomain` LRO is either in flight or expired.
       - VERIFIED: The DNS TXT record was observed and matches the issued
      `verification_token`. The domain participates in
      `auth:resolveProvider` lookups (and any other consumers).
       - FAILED: Verification failed unrecoverably (e.g. token mismatch
      detected after a previous VERIFIED state, or the LRO expired
      without a successful check). Caller can retry via a fresh
      `CreateDomain` cycle (delete + recreate).
  v1EffectiveTag:
    type: object
    properties:
      tagValue:
        type: string
        description: |-
          Resource name for TagValue in the format
          `organizations/{organization}/tagKeys/{tag_key}/tagValues/{tag_value}`.
      tagKey:
        type: string
        description: |-
          The name of the TagKey, in the format
          `organizations/{organization}/tagKeys/{tag_key}`.
      inherited:
        type: boolean
        description: |-
          Indicates the inheritance status of a tag value
          attached to the given resource. If the tag value is inherited from one of
          the resource's ancestors, inherited will be true. If false, then the tag
          value is directly attached to the resource, inherited will be false.
    description: |-
      An EffectiveTag represents a tag that applies to a resource during policy
      evaluation. Tags can be either directly bound to a resource or inherited from
      its ancestor. EffectiveTag contains the name of the tag value and tag key,
      with an additional field of `inherited` to indicate the inheritance status
      of the effective tag.
  v1EmptyState:
    type: object
    properties:
      title:
        type: string
        description: Optional. Headline shown above the subtitle.
      subtitle:
        type: string
        description: Optional. Secondary line of explanatory copy.
      icon:
        $ref: '#/definitions/v1Icon'
        description: Optional. Cross-platform semantic icon shown above the title.
      primaryAction:
        $ref: '#/definitions/v1RowAction'
        description: |-
          Optional. The primary call-to-action presented in the empty state
          (e.g. an "Upload" or "Invite" button).
    description: |-
      EmptyState is shown when a CollectionWidget's data source returns
      zero rows. It is purely presentational — the renderer composes the
      title, subtitle, icon, and primary action.
  v1Endpoint:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the endpoint. Format:
          `organizations/{organization}/storageGateways/{storage_gateway}/endpoints/{endpoint}`
        readOnly: true
      displayName:
        type: string
        description: Required. A human-readable name for the endpoint.
      state:
        $ref: '#/definitions/v1EndpointState'
        description: Output only. The current lifecycle state of the endpoint.
        readOnly: true
      s3:
        $ref: '#/definitions/v1S3Config'
        description: S3-compatible storage backend (rustfs, AWS S3, etc.).
      filesystem:
        $ref: '#/definitions/v1FileSystemConfig'
        description: Local or network-mounted filesystem (NFS, CIFS, etc.).
      cacheConfig:
        $ref: '#/definitions/v1CacheConfig'
        description: |-
          Optional. Cache configuration for this endpoint. Controls how agents
          cache assets fetched from this backend. Typically enabled for S3
          endpoints (especially remote/cloud), disabled for local filesystem mounts.
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Annotations associated with this endpoint.
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current
          value of the Endpoint resource.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created the endpoint.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the endpoint was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified the endpoint.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the endpoint was last modified.
        readOnly: true
    description: |-
      An endpoint represents a storage backend attached to a storage gateway.
      Agents use endpoint configuration to serve storage operations. The
      configuration is type-specific — currently only S3-compatible backends
      are supported.
    required:
      - displayName
  v1EndpointState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - INACTIVE
      - UNREACHABLE
    default: STATE_UNSPECIFIED
    description: |-
      Endpoint lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state. This is only useful for distinguishing unset values.
       - ACTIVE: The endpoint is active and serving requests.
       - INACTIVE: The endpoint has been deactivated and is not serving requests.
       - UNREACHABLE: The endpoint's storage backend is unreachable.
