      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMembersResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. Maximum number of members to return.
          in: query
