        SDK and `models.generateContent` in Google's AI APIs.
      operationId: AiChat_GenerateContent
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GenerateContentResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: user
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AiChatGenerateContentBody'
      tags:
        - AiChat
  /v1/organizations/{organization}/users/{user}:streamGenerateContent:
    post:
      summary: |-
        Server-streaming counterpart to `GenerateContent`. Same request
        shape; emits the response as a sequence of `ServerEvent`s
        (lifecycle markers, text/reasoning/tool deltas, source/file
        chunks, data parts, and a terminal `finish`).
      description: |-
        Each ServerEvent variant maps 1:1 to a Vercel AI SDK
        UIMessageChunk on the wire — the SSE adapter
        (POST /v1/{parent}:streamGenerateContent) is a thin translator
        that strips the proto oneof wrapper and injects the `"type"`
        discriminator. The proto IS the canonical wire format.

        The request name, response name, and HTTP suffix are
        intentionally non-AIP — server-streaming custom methods aren't
        covered by AIP-136. The streaming variant deliberately reuses
        `GenerateContentRequest` so callers can construct the request
        once and pick streaming vs unary at call time. The unary
        `GenerateContent` above is AIP-clean.
      operationId: AiChat_StreamGenerateContent
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/v1ServerEvent'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of v1ServerEvent
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: user
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AiChatStreamGenerateContentBody'
      tags:
        - AiChat
  /v1/organizations/{organization}:queryDashboardData:
    post:
      summary: |-
        Resolves a `ResourceQuery` into rows of data for rendering inside
        a CollectionWidget. The handler dispatches per query.resource_type;
        v1 supports `pivox.assets/Asset` only.
      description: |-
        Each row is a `google.protobuf.Struct` whose fields mirror the
        CollectionWidget.columns / IconConfig contract documented on the
        widget itself: `name`, `display_name`, `media_type`, `state`,
        `size_bytes`, `create_time`, plus server-synthesized `icon` (the
        numeric `Icon` enum value derived from the asset's content type)
        and `thumbnail_url` (empty in v1; the per-row URL composition
        lands when the storage-gateway session work merges).

        Permission: dashboards.read gates the verb. Per-resource ListPermission
        (e.g. assets.assets.read) is checked at the handler layer once the
        role hierarchy diverges enough that the two permissions can be
        granted independently.
      operationId: Dashboards_QueryDashboardData
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1QueryDashboardDataResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/DashboardsQueryDashboardDataBody'
      tags:
        - Dashboards
