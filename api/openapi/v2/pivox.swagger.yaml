  v1Member:
    type: object
    properties:
      name:
        type: string
        description: |-
          The resource name of the member.
          Format: `organizations/{organization}/members/{member}` or
                  `organizations/{organization}/spaces/{space}/members/{member}`
          where `{member}` is `user-{user_id}` or `group-{group_id}`.
      user:
        type: string
        description: 'The user principal. Format: `organizations/{organization}/users/{user}`.'
      group:
        type: string
        description: 'The group principal. Format: `organizations/{organization}/groups/{group}`.'
      role:
        type: string
        description: |-
          Required. Reference to the role this principal holds at this scope.
          Format: `organizations/{organization}/roles/{role}`. v1 accepts only
          system roles (`owner`, `admin`, `editor`, `viewer`).
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this membership.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when this binding was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this membership.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when this binding was last modified.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current
          value of the Member resource. Sent on update and delete requests for
          optimistic concurrency control.
        readOnly: true
    description: |-
      Multi-parent: a Member lives under either an organization or a space.
      The URL segment `{member}` encodes the principal as `user-{user_id}`
      or `group-{group_id}` — uniqueness by construction means a given
      principal can hold at most one role per scope.

      Permission resolution unions org-level and space-level Member
      bindings: an org owner is implicitly a space owner. Server-side
      resolver is the source of truth; this proto defines only the wire
      shape.
    title: |-
      A Member binds a principal (user or group) to a role at a scope
      (organization or space). The single source of truth for "who has
      what role where."
    required:
      - role
  v1Message:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the message.
          Format: `organizations/{organization}/users/{user}/conversations/{conversation}/messages/{message}`
      role:
        type: string
        description: |-
          Output only. The role of the message author. One of:
          "user", "assistant", "system", "tool". String (not enum) so the
          wire shape matches Vercel UIMessage.role on both the streaming
          path and Get/List Message responses — REST-gateway consumers can
          deserialize a Message directly into a UIMessage-shaped client
          type without a role-string remap.
        readOnly: true
      parts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1MessagePart'
        description: Output only. The structured parts of the message.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. When the message was created.
        readOnly: true
    description: |-
      A message within a conversation. Messages are produced by the streaming
      path and are read-only through this API.
  v1MessageMetadata:
    type: object
    properties:
      messageMetadata:
        $ref: '#/definitions/v1ChatMessageMetadata'
    description: |-
      Mid-stream metadata update chunk. The wire chunk nests the payload
      under `messageMetadata`, hence the recursive field name — matches
      Vercel's UIMessageChunk shape verbatim.
  v1MessagePart:
    type: object
    properties:
      type:
        type: string
        description: |-
          Discriminator. See the message-level comment for the variant
          catalog.
      text:
        type: string
        description: |-
          ─── text / reasoning ────────────────────────────────────
          The text content. Required when `type` is "text" or
          "reasoning"; ignored otherwise (CEL enforced above).
      state:
        type: string
        description: |-
          Streaming state. Vercel emits "streaming" while the part is
          mid-generation and "done" once closed. Producers can leave it
          unset; persistence round-trips whatever was last set.
      mediaType:
        type: string
        title: ─── file / source-document ──────────────────────────────
      url:
        type: string
      filename:
        type: string
      sourceId:
        type: string
        title: ─── source-url / source-document ────────────────────────
      title:
        type: string
      toolCallId:
        type: string
        description: |-
          ─── tool-<name> / dynamic-tool ──────────────────────────
          The unique ID of the tool call. Threads the state machine for
          a single tool invocation (input → output / error / denied).
      toolName:
        type: string
        description: |-
          The tool's name. Populated explicitly for "dynamic-tool" (the
          type alone doesn't carry it); for "tool-<name>" parts it
          duplicates the suffix in `type` and is informational.
      input:
        type: object
        description: |-
          The fully-parsed tool input arguments. Crosses both wire and
          persistence as structured data — no JSON-string double-encode.
      output:
        type: object
        description: |-
          The tool's result, structured. Populated when `state` is
          "output-available".
      errorText:
        type: string
        description: |-
          Human-readable error text. Populated when `state` is
          "output-error" or "input-error".
      providerExecuted:
        type: boolean
        description: |-
          True when the tool ran on the provider side (e.g. Anthropic
          web search). False / unset for client-executed tools.
      dynamic:
        type: boolean
        description: |-
          True when the tool was not statically declared in the
          request's `tools` list — i.e. the provider suggested it at
          runtime.
      id:
        type: string
        description: |-
          ─── data-<name> ─────────────────────────────────────────
          Stable replace-on-update key for `data-<name>` parts.
      data:
        type: object
        description: Free-form payload for `data-<name>` parts.
      providerMetadata:
        type: object
        description: |-
          ─── Cross-variant ───────────────────────────────────────
          Provider-specific metadata attached to the part (e.g.
          Anthropic prompt-cache stats, OpenAI reasoning summaries).
      callProviderMetadata:
        type: object
        description: |-
          Provider metadata captured at the tool-call site, distinct
          from provider_metadata which describes the part itself.
    description: |-
      - Inbound (POST /v1/...:streamGenerateContent) decodes Vercel-
          emitted UIMessage[] directly via protojson, no boundary
          translator.
        - Outbound (Get/List Message) returns the same shape via
          grpc-gateway, so the chat UI and persistence agree on the wire.

      Variants are discriminated by `type`:

        - "text" / "reasoning" — populate `text` (and `state` when known)
        - "file" — populate `media_type`, `url`, `filename`
        - "source-url" — populate `source_id`, `url`, `title`
        - "source-document" — populate `source_id`, `media_type`, `title`,
          `filename`
        - "step-start" — no fields
        - "tool-<name>" — populate `tool_call_id`, the state machine
          (`state` = input-streaming|input-available|output-available|
          output-error|output-denied|...), and the corresponding payload
          (`input` / `output` / `error_text`)
        - "dynamic-tool" — same shape as tool-<name>, populate `tool_name`
          explicitly (the type alone doesn't carry it)
        - "data-<name>" — populate `id` (optional, replace-on-update key)
          and `data` (free-form JSON object)

      `provider_metadata` and `call_provider_metadata` cross every
      variant for upstream-provider passthrough.
    title: |-
      A single part of a message. Shape-matches the Vercel AI SDK
      `UIMessagePart` wire format verbatim, so:
    required:
      - type
  v1OidcConfig:
    type: object
    properties:
      issuer:
        type: string
        description: |-
          Required. The IDP issuer URL. Must support OIDC discovery at
          `<issuer>/.well-known/openid-configuration`. Example:
          `https://accounts.google.com` or
          `https://example.okta.com/oauth2/default`.
      clientId:
        type: string
        description: |-
          Required. The OAuth 2.0 client ID registered with the IDP for
          this Pivox organization.
      clientSecret:
        type: string
        description: |-
          Optional on read; the server returns this field empty (the actual
          value is encrypted at rest and never returned to clients). Set on
          Update via the `update_mask`. Only required when using the
          authorization-code flow (response_type.code = true).

          Travels cleartext over TLS to the server, which envelope-encrypts
          it via Cloud KMS before persisting.
      responseType:
        $ref: '#/definitions/OidcConfigResponseType'
        description: |-
          Required. The OIDC response type the IDP returns to Firebase
          Auth's callback. Most production setups use `code` (authorization-
          code flow with `client_secret`). `id_token` is the implicit flow
          and does not require a secret.
    description: |-
      OIDC provider configuration. Maps onto Firebase Admin SDK's
      `OIDCProviderConfig` shape — server reads these fields and calls
      `CreateOIDCProviderConfig` / `UpdateOIDCProviderConfig` against
      Firebase Auth on Update.
    required:
      - issuer
      - clientId
      - responseType
  v1Organization:
    type: object
    properties:
      name:
        type: string
        description: |-
          Output only. The resource name of the organization. This is the
          organization's relative path in the API. Its format is
          "organizations/[organization_id]". For example, "organizations/1234".
        readOnly: true
      displayName:
        type: string
        description: |-
          Output only. A human-readable string that refers to the organization in the
          Pivox Console. This string is set by the server and cannot be
          changed. The string will be set to the primary domain (for example,
          "acme.com") of the customer that owns the organization.
        readOnly: true
      state:
        $ref: '#/definitions/v1OrganizationState'
        description: Output only. The organization's current lifecycle state.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this organization.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the Organization was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this organization.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the Organization was last modified.
        readOnly: true
      deletedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that requested deletion of this organization.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the Organization was requested for deletion.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: |-
          Output only. The time at which this organization will be purged.
          Approximately 30 days after deletion.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Organization resource. This may be sent on update and delete
          requests to ensure the client has an up-to-date value before proceeding.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Labels associated with this organization.
          Labels are key-value pairs that can be used to organize and track resources.
    description: |-
      The root node in the resource hierarchy to which a particular entity's
      (a company, for example) resources belong.
  v1OrganizationState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - ACTIVE
      - DELETE_REQUESTED
    default: STATE_UNSPECIFIED
    description: |-
      Organization lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state.  This is only useful for distinguishing unset values.
       - ACTIVE: The normal and active state.
       - DELETE_REQUESTED: The organization has been marked for deletion by the user.
  v1OrganizationsTestIamPermissionsBody:
    type: object
    properties:
      permissions:
        type: array
        items:
          type: string
        description: |-
          Required. The permissions to check. Each entry is a permission ID
          (e.g. `spaces.create`, `assets.assets.list`). Wildcards are not
          supported.
    description: |-
      Request message for `Iam.TestIamPermissions`.

      Used by clients (notably UI layers) to ask the server: "out of this
      list of permissions, which ones does the caller actually have on
      this resource?" The server resolves the caller's effective role at
      the resource and returns the subset of requested permissions that
      role grants.
    required:
      - permissions
  v1Permission:
    type: object
    properties:
      name:
        type: string
        title: |-
          The resource name of the permission.
          Format: `permissions/{permission}` (e.g. `permissions/spaces.create`)
      displayName:
        type: string
        description: A human-readable name for the permission.
        readOnly: true
      description:
        type: string
        description: A description of what the permission allows.
        readOnly: true
    description: |-
      A system-defined permission that can be assigned to roles. Permissions
      are global (no parent resource) and code-defined; they are exposed
      read-only via `Iam.ListPermissions`.
