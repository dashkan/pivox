  v1Icon:
    type: string
    enum:
      - ICON_UNSPECIFIED
      - ICON_DOCUMENT
      - ICON_FOLDER
      - ICON_PHOTO
      - ICON_VIDEO
      - ICON_AUDIO
      - ICON_CODE
      - ICON_ARCHIVE
      - ICON_PERSON
      - ICON_PEOPLE
      - ICON_ORGANIZATION
      - ICON_SHARE
      - ICON_TRASH
      - ICON_TAG
      - ICON_PIN
      - ICON_STAR
      - ICON_DOWNLOAD
      - ICON_UPLOAD
      - ICON_COPY
      - ICON_EDIT
      - ICON_CHECK
      - ICON_X_MARK
      - ICON_WARNING
      - ICON_INFO
      - ICON_LOCK
      - ICON_UNLOCKED
      - ICON_ELLIPSIS
      - ICON_PLUS
      - ICON_MINUS
      - ICON_SETTINGS
      - ICON_SEARCH
    default: ICON_UNSPECIFIED
    description: |-
      Icon is a curated cross-platform semantic icon catalog. Renderers map
      each value to a platform-native icon (SF Symbols on macOS, Fluent
      System Icons on Windows, equivalent on the web). The enum is purely
      semantic — variants like filled vs. outlined are chosen by the
      renderer based on context.

      Numeric values are partitioned into thousand-blocks per category.
      Within a category, values are sequential: enum numbers are wire
      identifiers, not display order, so middle-of-category alphabetical
      insertion isn't an invariant. Pre-prod freedom permits reordering
      the source list (and renumbering) until the first paying customer
      persists a row that references one of these values.

      New icons must be added in three places at once: this enum, the
      macOS SF Symbol map, and the WinUI Fluent map. CI lint catches
      drift.

      Categories (thousand-block ranges):

        * File / content types   — 1xxx
        * Identity               — 2xxx
        * Actions                — 3xxx
        * Status                 — 4xxx
        * Navigation             — 5xxx

       - ICON_UNSPECIFIED: Default value when no icon is specified. Renderers may pick an
      appropriate fallback.
       - ICON_DOCUMENT: Generic document. (File / content types.)
       - ICON_FOLDER: A folder or container.
       - ICON_PHOTO: A photograph or raster image.
       - ICON_VIDEO: A video clip.
       - ICON_AUDIO: An audio clip.
       - ICON_CODE: Source code or a code snippet.
       - ICON_ARCHIVE: An archive (zip, tar, etc.).
       - ICON_PERSON: A single person / individual user. (Identity.)
       - ICON_PEOPLE: A group of people.
       - ICON_ORGANIZATION: An organization, company, or team.
       - ICON_SHARE: Share an item. (Actions.)
       - ICON_TRASH: Move to trash / delete.
       - ICON_TAG: A tag / label.
       - ICON_PIN: Pin an item to a position.
       - ICON_STAR: Mark an item as starred / favorite.
       - ICON_DOWNLOAD: Download an item.
       - ICON_UPLOAD: Upload an item.
       - ICON_COPY: Copy / duplicate an item.
       - ICON_EDIT: Edit / modify an item.
       - ICON_CHECK: Success / completed indicator. (Status.)
       - ICON_X_MARK: Close / dismiss / failure indicator.
       - ICON_WARNING: Warning indicator.
       - ICON_INFO: Informational indicator.
       - ICON_LOCK: Locked state.
       - ICON_UNLOCKED: Unlocked state.
       - ICON_ELLIPSIS: Overflow / "more options" indicator (typically `…`). (Navigation.)
       - ICON_PLUS: Add / create.
       - ICON_MINUS: Remove / subtract.
       - ICON_SETTINGS: Settings / configuration.
       - ICON_SEARCH: Search.
  v1IconConfig:
    type: object
    properties:
      sourceField:
        type: string
        description: |-
          Optional. Name of the row field whose value is a thumbnail URL.
          When set and non-empty, the renderer fetches the image (subject to
          gateway-host bearer-token attachment).
      iconField:
        type: string
        description: |-
          Optional. Name of the row field whose value is the numeric
          `Icon` enum value (e.g. `1002` for `ICON_PHOTO`). Encoded as the
          wire integer rather than the symbolic name so renaming an `Icon`
          value never silently breaks persisted dashboards. Server handlers
          synthesize this per row.
      initialsField:
        type: string
        description: |-
          Optional. Name of the row field whose value is used to derive
          initials when no thumbnail or semantic icon is available
          (typically "display_name" or "name").
      fallbackIcon:
        $ref: '#/definitions/v1Icon'
        description: |-
          Optional. The static fallback icon used when none of
          `source_field` / `icon_field` / `initials_field` produces a value.
      size:
        $ref: '#/definitions/IconConfigIconSize'
        description: |-
          Optional. The size hint for the leading icon — applies to whichever
          derivation path resolved.
      fallbackColor:
        $ref: '#/definitions/typeColor'
        description: |-
          Optional. Background color for the icon backplate. Renderer-honored
          when icon or initials are shown without a thumbnail.
    description: |-
      IconConfig describes how to derive the leading icon / thumbnail for
      each row in a CollectionWidget. The four derivation paths
      (`source_field` → `icon_field` → `initials_field` → `fallback_icon`)
      are tried in order: the first one that produces a value wins.
      `size` and `fallback_color` are presentation knobs that apply to
      whichever derivation path resolves.
  v1InlineContent:
    type: object
    properties:
      data:
        type: string
        format: byte
        description: The raw content bytes. Stripped in List responses, returned in Get.
      mimeType:
        type: string
        description: The MIME type of the content (e.g. "text/x-python", "text/markdown").
      sizeBytes:
        type: string
        format: int64
        description: The size of the data in bytes.
    description: |-
      Inline content stored directly in the artifact version.
      Capped at 1 MB for text-only artifacts.
  v1InputMessage:
    type: object
    properties:
      id:
        type: string
        description: |-
          Optional. The Vercel-side message ID. Carried for audit/replay
          round-trip; not used to key persistence on the server (the
          server generates its own message IDs for persisted turns).
      role:
        type: string
        description: |-
          Required. The role of this message's author. One of:
          "user", "assistant", "system", "tool".

          Vercel `useChat` sends the full conversation history on every
          turn — including its own prior `assistant` responses, and an
          optional `system` opening — so the server must accept all four
          roles on input. The historical concern that a caller could
          inject a fake assistant turn is addressed via:
            - stateful mode: when `conversation` is set, the server hydrates
              history from the DB and ignores client-claimed assistant turns
              beyond the most recent user message.
            - stateless mode: the caller controls the model context anyway;
              forging assistant context only deceives the caller's own
              model call.

          String (not enum) because Vercel writes lowercase strings on the
          wire; `protojson` would round-trip a proto enum as uppercase,
          forcing a translator shim.
      parts:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1MessagePart'
        description: Required. The structured parts of this message.
      metadata:
        type: object
        description: |-
          Optional. Free-form metadata associated with this message.
          Round-trips on the wire as Vercel's UIMessage.metadata.
    description: |-
      A single conversation turn supplied as input to a generation.
      Shape-matches the Vercel AI SDK `UIMessage` on the wire so the
      SSE handler can decode a request body into `[]*InputMessage`
      directly via `protojson.Unmarshal`. Tool calls, tool results,
      files, reasoning, and text are all represented as `MessagePart`
      variants — no separate request envelopes for tool flows.
    required:
      - role
      - parts
  v1Invitation:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the invitation.
          Format: `organizations/{organization}/invitations/{invitation}`
        readOnly: true
      email:
        type: string
        description: Required. The email address of the user being invited.
      role:
        type: string
        title: |-
          Optional. The role to assign when the invitation is accepted.
          Format: `organizations/{organization}/roles/{role}`
      state:
        $ref: '#/definitions/v1InvitationState'
        description: Output only. The current state of the invitation.
        readOnly: true
      inviter:
        type: string
        description: Output only. The resource name of the user who created the invitation.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the invitation was created.
        readOnly: true
      expireTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the invitation expires.
        readOnly: true
      acceptTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the invitation was accepted.
        readOnly: true
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Invitation resource.
        readOnly: true
    description: |-
      An invitation to join an organization. Invitations are created by org
      admins and sent to users by email. The recipient can accept or decline.
    required:
      - email
  v1InvitationPolicy:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the invitation policy.
          Format: `organizations/{organization}/invitationPolicy`
        readOnly: true
      disablePublicEmailAddresses:
        type: boolean
        description: |-
          Optional. When true, invitations to public email addresses (gmail.com,
          yahoo.com, etc.) are rejected. The server maintains the list of
          public email domains.
      allowedDomains:
        type: array
        items:
          type: string
        description: |-
          Optional. If non-empty, only email addresses from these domains are
          allowed. This is the strictest check and takes precedence over other
          settings.
      disallowedDomains:
        type: array
        items:
          type: string
        description: |-
          Optional. Email addresses from these domains are always rejected,
          even if they pass other checks.
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when the policy was last modified.
        readOnly: true
      etag:
        type: string
        description: Output only. A checksum for optimistic concurrency control.
        readOnly: true
    description: |-
      The invitation policy for an organization. Controls which email
      addresses can be invited to join the organization.
  v1InvitationState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PENDING
      - ACCEPTED
      - DECLINED
      - REVOKED
      - EXPIRED
    default: STATE_UNSPECIFIED
    description: |-
      Invitation lifecycle states.

       - STATE_UNSPECIFIED: Unspecified state.
       - PENDING: The invitation is pending acceptance.
       - ACCEPTED: The invitation has been accepted and a user membership was created.
       - DECLINED: The invitation was declined by the recipient.
       - REVOKED: The invitation was revoked by an org admin.
       - EXPIRED: The invitation expired before being accepted or declined.
  v1IosKeyRestrictions:
    type: object
    properties:
      allowedBundleIds:
        type: array
        items:
          type: string
        description: Optional. A list of bundle IDs that are allowed when making API calls with this key.
    description: The iOS apps that are allowed to use the key.
  v1Key:
    type: object
    properties:
      name:
        type: string
        description: |-
          Output only. The resource name of the key.
          The `name` has the form:
          `organizations/{organization}/keys/{key}`.
          For example:
          `organizations/123/keys/my-api-key`.
        readOnly: true
      displayName:
        type: string
        description: |-
          Optional. Human-readable display name of this key that you can modify.
          The maximum length is 63 characters.
      keyString:
        type: string
        description: |-
          Output only. An encrypted and signed value held by this key.
          This field can be accessed only through the `GetKeyString` method.
        readOnly: true
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this API key.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: |-
          Output only. A timestamp identifying the time this key was originally
          created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this API key.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: |-
          Output only. A timestamp identifying the time this key was last
          updated.
        readOnly: true
      deletedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that requested deletion of this API key.
        readOnly: true
      deleteTime:
        type: string
        format: date-time
        description: |-
          Output only. A timestamp when this key was deleted. If the resource is not
          deleted, this must be empty.
        readOnly: true
      purgeTime:
        type: string
        format: date-time
        description: |-
          Output only. The time at which this key will be purged.
          Approximately 30 days after deletion.
        readOnly: true
      annotations:
        type: object
        additionalProperties:
          type: string
        description: |-
          Optional. Annotations is an unstructured key-value map stored with a policy that
          may be set by external tools to store and retrieve arbitrary metadata.
          They are not queryable and should be preserved when modifying objects.
      restrictions:
        $ref: '#/definitions/v1Restrictions'
        description: Optional. Key restrictions.
      etag:
        type: string
        description: |-
          Output only. A checksum computed by the server based on the current value
          of the Key resource. This may be sent on update and delete requests to
          ensure the client has an up-to-date value before proceeding.
        readOnly: true
    description: The representation of a key managed by the API Keys API.
  v1LineItem:
    type: object
    properties:
      name:
        type: string
        title: |-
          Output only. The resource name of the line item. Format:
          `organizations/{organization}/spaces/{space}/requests/{request}/lineItems/{line_item}`
        readOnly: true
      displayName:
        type: string
        description: Required. A human-readable name for the deliverable.
      description:
        type: string
        description: Optional. A description of what is expected for this deliverable.
      state:
        $ref: '#/definitions/v1LineItemState'
        description: Output only. The current state of the line item.
        readOnly: true
      asset:
        type: string
        description: |-
          Output only. The linked PLACEHOLDER asset. Created when the line
          item is created. Transitions to ACTIVE when the artist fulfills
          the line item.
        readOnly: true
      mediaType:
        $ref: '#/definitions/AssetMediaType'
        description: Optional. The expected media type for this deliverable.
      annotations:
        type: object
        additionalProperties:
          type: string
        description: Optional. Annotations associated with this line item.
      createdBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that created this line item.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Output only. Timestamp when this line item was created.
        readOnly: true
      updatedBy:
        $ref: '#/definitions/typesActor'
        description: Output only. The identity that last modified this line item.
        readOnly: true
      updateTime:
        type: string
        format: date-time
        description: Output only. Timestamp when this line item was last modified.
        readOnly: true
    description: |-
      A line item within a request. Each line item represents a single
      deliverable and is linked to a PLACEHOLDER asset that is fulfilled
      when the artist uploads the file.
    required:
      - displayName
  v1LineItemState:
    type: string
    enum:
      - STATE_UNSPECIFIED
      - PENDING
      - IN_PROGRESS
      - DELIVERED
      - APPROVED
      - REVISION_REQUESTED
    default: STATE_UNSPECIFIED
    description: |-
      Line item states.

       - STATE_UNSPECIFIED: Unspecified state.
       - PENDING: Awaiting artist delivery.
       - IN_PROGRESS: Artist is working on this item.
       - DELIVERED: Artist uploaded the deliverable.
       - APPROVED: Producer approved this item.
       - REVISION_REQUESTED: Producer requested changes on this item.
  v1ListAccountOrganizationsResponse:
