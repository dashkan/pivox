    get:
      summary: Gets an org-scope Member by resource name.
      operationId: Organizations_GetMember
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Member'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: member
          in: path
          required: true
          type: string
      tags:
        - Organizations
    delete:
      summary: |-
        Deletes an org-scope Member binding. Refuses to delete the last
        owner — use TransferOwnership first or promote a co-owner.
      operationId: Organizations_DeleteMember
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: member
          in: path
          required: true
          type: string
        - name: etag
          description: Optional. The etag known to the client for optimistic concurrency.
          in: query
          required: false
          type: string
      tags:
        - Organizations
    patch:
      summary: |-
        Updates an org-scope Member's role. Only `role` is mutable.
        Refuses to demote the last owner — use TransferOwnership instead.
      operationId: Organizations_UpdateMember
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Member'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: member
          in: path
          required: true
          type: string
        - name: member
          description: |-
            A Member binds a principal (user or group) to a role at a scope
            (organization or space). The single source of truth for "who has
            what role where."

            Required. The Member with updated fields. The `name` field must
            identify the existing member.
          in: body
          required: true
          schema:
            type: object
            properties:
              user:
                type: string
                description: 'The user principal. Format: `organizations/{organization}/users/{user}`.'
              group:
                type: string
                description: 'The group principal. Format: `organizations/{organization}/groups/{group}`.'
              role:
                type: string
                description: |-
                  Required. Reference to the role this principal holds at this scope.
                  Format: `organizations/{organization}/roles/{role}`. v1 accepts only
                  system roles (`owner`, `admin`, `editor`, `viewer`).
              createdBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that created this membership.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Output only. Timestamp when this binding was created.
                readOnly: true
              updatedBy:
                $ref: '#/definitions/typesActor'
                description: Output only. The identity that last modified this membership.
                readOnly: true
              updateTime:
                type: string
                format: date-time
                description: Output only. Timestamp when this binding was last modified.
                readOnly: true
              etag:
                type: string
                description: |-
                  Output only. A checksum computed by the server based on the current
                  value of the Member resource. Sent on update and delete requests for
                  optimistic concurrency control.
                readOnly: true
            description: |-
              Required. The Member with updated fields. The `name` field must
              identify the existing member.
            title: |-
