        - Spaces
  /v1/organizations/{organization}/spaces/{space}/requests:
    get:
      summary: Lists requests in a space.
      operationId: Requests_ListRequests
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListRequestsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: space
          in: path
          required: true
          type: string
        - name: pageSize
          description: Optional. The maximum number of requests to return.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Optional. A pagination token from a previous call.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Optional. An expression for filtering the results.
            Filterable fields:

            + `state`
            + `priority`
            + `assignee`
            + `displayName`
            + `creator`
            + `createTime` (supports comparison operators)
            + `dueTime` (supports comparison operators)

            Examples:

            + `state = OPEN` — only open requests.
            + `assignee = "users/123"` — requests assigned to a user.
            + `priority = URGENT` — urgent requests only.
            + `state = IN_PROGRESS AND assignee = ""` — unassigned in-progress.

            For more information, see [AIP-160](https://aip.dev/160).
          in: query
          required: false
          type: string
        - name: orderBy
          description: |-
            Optional. A comma-separated list of fields to order by.
            Supported fields:

            + `displayName`
            + `createTime`
            + `updateTime`
            + `dueTime`
            + `priority`
            + `name`

            Example: `priority desc, dueTime`
          in: query
          required: false
          type: string
        - name: showDeleted
          description: Optional. If true, include soft-deleted requests in the response.
          in: query
          required: false
          type: boolean
      tags:
        - Requests
    post:
      summary: |-
        Creates a new request in the specified space. Line items can be
        included in the request body — each line item creates a
        PLACEHOLDER asset in the space.
      description: |-
        The caller must have `assets.requests.create` permission on the
        parent space.
      operationId: Requests_CreateRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/longrunningOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: organization
          in: path
          required: true
          type: string
        - name: space
          in: path
          required: true
          type: string
        - name: request
          description: |-
            Required. The request to create. May include line items in the
            line_items field — each will create a PLACEHOLDER asset.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Request'
        - name: validateOnly
          description: Optional. If set to true, validate only without persisting.
          in: query
          required: false
          type: boolean
      tags:
        - Requests
