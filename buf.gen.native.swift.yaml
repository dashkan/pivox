version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: api/proto
    paths:
      - api/proto/pivox
      - api/proto/google/rpc
      - api/proto/google/type
plugins:
  # Swift proto types — consumed by the macOS SwiftUI app and surfaced to the
  # shared C++ chat client via Swift↔C++ interop.
  - remote: buf.build/apple/swift:v1.36.1
    out: native/platform/macos/swift-packages/PivoxModels/Sources/PivoxModels/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores

  # Swift proto-bridge extensions — non-generic, non-throwing serializer
  # wrappers so C++ can read/write proto bytes through interop. Source in
  # tools/cmd/protoc-gen-pivox-swift-protobridge/. Binary built by Makefile.
  - local: bin/protoc-gen-pivox-swift-protobridge
    out: native/platform/macos/swift-packages/PivoxModels/Sources/PivoxModels/Generated
    opt:
      - swift_module=PivoxModels

  # NOTE: the Swift facade runs from a separate template
  # (buf.gen.native.facade.yaml) so it can use the narrow scope that
  # matches the C++ bridge (only services with a C++ counterpart —
  # currently pivox.ai.v1.AiChat). Broaden both together when you want
  # the facade to cover additional services.
