version: v2
clean: true
managed:
  enabled: true
inputs:
  - directory: api/proto
    paths:
      - api/proto/pivox
      - api/proto/google/rpc
      - api/proto/google/type
      - api/proto/google/longrunning
      - api/proto/google/api
plugins:
  # Swift proto types — message structs, enums, oneofs. Generated into
  # the PivoxModels SwiftPM package; the macOS app does `import
  # PivoxModels` to get all message types and gRPC client stubs.
  - remote: buf.build/apple/swift:v1.37.0
    out: native/platform/macos/swift-packages/PivoxModels/Sources/PivoxModels/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores

  # grpc-swift-2 client stubs — typed async clients with AsyncSequence
  # streaming. Server side stays off; the cloud is Go. The plugin
  # binary is built once from grpc-swift-protobuf's SwiftPM checkout
  # (see PivoxModels/.build/checkouts/) — there is no public BSR
  # plugin for grpc-swift-2 yet (only v1 at buf.build/grpc/swift).
  - local: bin/protoc-gen-grpc-swift-2
    out: native/platform/macos/swift-packages/PivoxModels/Sources/PivoxModels/Generated
    opt:
      - Visibility=Public
      - FileNaming=PathToUnderscores
      - Client=true
      - Server=false
