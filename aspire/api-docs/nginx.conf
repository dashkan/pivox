# Static file server for the Scalar API reference + the OpenAPI v3 spec.
#
# WHY THIS EXISTS: the ingress cannot serve files. agentgateway's directResponse
# takes an INLINE BODY only — no filename — and inlining is not an option here:
# the spec is ~660KB (and growing), and index.html contains a JS template literal
# that the ingress config's whole-file shell expansion would try to resolve as an
# env var and abort startup on. So the docs sit behind a real static server, which
# is where they belonged anyway.
#
# Bonus: nginx gzips. agentgateway has no compression policy at all, so without
# this the 660KB spec would go out uncompressed on every load.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # LOAD-BEARING. nginx builds ABSOLUTE redirects from the connection IT sees —
    # the plaintext gateway->nginx hop on :80 — not the client's origin. Without
    # this, the /api-docs -> /api-docs/ redirect below goes out as
    # `http://localhost/api-docs/`: scheme downgraded to http, and the port dropped
    # ($host excludes it, and :80 is then omitted as the http default). The browser
    # follows that to a port nothing listens on.
    #
    # And because that redirect is a 301 — PERMANENT — the browser caches the bad
    # Location and stops asking the server, so fixing this config does not dislodge
    # it; you have to clear the cache. (Cost of learning that: one debugging round.)
    #
    # A relative `Location: /api-docs/` is resolved against the origin the client
    # actually used, so it is correct on every listener and through the tunnel.
    absolute_redirect off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/html application/javascript application/yaml text/plain;
    # LOAD-BEARING, and not obvious: gzip_proxied defaults to `off`, which means
    # "do not compress any request that carries a Via header". EVERY request to this
    # server arrives through the gateway, so the moment anything in front of us sets
    # Via — a gateway upgrade, a CDN, the tunnel — compression silently switches off
    # and the 660KB spec goes out raw on every page load, with no error and no log.
    # `any` compresses regardless of Via, which is unconditionally right here: 100%
    # of this server's traffic is proxied, and there is no cache in between to
    # confuse.
    gzip_proxied      any;

    # Canonicalise the bare /api-docs onto /api-docs/. The trailing slash is not
    # cosmetic: it sets the base URL the page resolves relative refs against. At
    # /api-docs a relative `app.js` would resolve to /app.js; at /api-docs/ it
    # resolves to /api-docs/app.js. Serving index.html at both paths would work
    # today (Scalar comes from a CDN and the spec is fetched at the absolute
    # /api-docs/pivox.yaml — no relative refs) but would silently break the
    # no-slash URL the day someone adds one.
    location = /api-docs {
        return 301 /api-docs/;
    }

    location /api-docs/ {
        index index.html;

        # nginx's default mime.types has no entry for .yaml, so the spec would be
        # served as application/octet-stream. The spec must be application/yaml.
        location ~ \.yaml$ {
            default_type application/yaml;
        }
    }

    # This container serves /api-docs and nothing else. Without this, `root` above
    # falls through to the nginx image's own html dir, and anything else routed here
    # gets the stock "Welcome to nginx!" page instead of a 404 — a confusing 200 for
    # a path this server was never meant to answer.
    location / {
        return 404;
    }
}
